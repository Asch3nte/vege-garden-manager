<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendrier — vue unifiée · Carnet vivant</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" />

<link rel="stylesheet" href="bg-directions.css" />
<link rel="stylesheet" href="calendrier.css" />
<style>
  html, body { height: 100%; }
  body { background:
    radial-gradient(120% 90% at 50% -10%, color-mix(in srgb, var(--c-primary) 9%, var(--page)), var(--page) 60%); }
  #root { min-height: 100vh; display: grid; place-items: center; padding: clamp(16px, 4vw, 48px); }
  .stagewrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .stagewrap .cap { font-family: var(--font-body); font-size: 12.5px; color: var(--page-ink2); display: inline-flex; align-items: center; gap: 7px; }
  .stagewrap .cap i { color: var(--c-primary); font-size: 14px; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#2F7D4F"/>
    <rect x="20" y="22" width="60" height="56" rx="7" fill="#FFFDF7"/>
    <rect x="20" y="22" width="60" height="14" rx="7" fill="#6A3D5B"/>
    <rect x="28" y="44" width="10" height="10" rx="2" fill="#D6573D"/>
    <rect x="45" y="44" width="10" height="10" rx="2" fill="#E0A82E"/>
    <rect x="62" y="44" width="10" height="10" rx="2" fill="#4FA06A"/>
    <rect x="28" y="60" width="10" height="10" rx="2" fill="#4E89B0"/>
    <rect x="45" y="60" width="10" height="10" rx="2" fill="#6A3D5B"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="calendrier.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "startView": "mois",
  "agendaScope": "semaine"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <>
      <div className="stagewrap">
        <CalendrierApp startView={t.startView} agendaScope={t.agendaScope} />
        <span className="cap"><i className="ph-fill ph-hand-tap"></i>Tape une tâche pour la cocher · bascule Agenda / Mois / Saison en haut</span>
      </div>

      <TweaksPanel>
        <TweakSection label="Vue Calendrier" />
        <TweakRadio label="Vue par défaut" value={t.startView}
          options={[{ value: "agenda", label: "Agenda" }, { value: "mois", label: "Mois" }, { value: "saison", label: "Saison" }]}
          onChange={(v) => setTweak("startView", v)} />
        <TweakRadio label="Portée de l'agenda" value={t.agendaScope}
          options={[{ value: "semaine", label: "Semaine" }, { value: "mois", label: "Mois entier" }]}
          onChange={(v) => setTweak("agendaScope", v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

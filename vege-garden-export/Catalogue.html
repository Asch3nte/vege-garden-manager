<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catalogue — fiches & réseau · Carnet vivant</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" />

<link rel="stylesheet" href="bg-directions.css" />
<link rel="stylesheet" href="catalogue.css" />
<style>
  html, body { height: 100%; }
  body { background:
    radial-gradient(120% 90% at 50% -10%, color-mix(in srgb, var(--c-green-mid) 9%, var(--page)), var(--page) 60%); }
  #root { min-height: 100vh; display: grid; place-items: center; padding: clamp(16px, 4vw, 48px); }
  .stagewrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .stagewrap .cap { font-family: var(--font-body); font-size: 12.5px; color: var(--page-ink2); display: inline-flex; align-items: center; gap: 7px; text-align: center; }
  .stagewrap .cap i { color: var(--c-primary); font-size: 14px; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#1E4D33"/>
    <line x1="35" y1="32" x2="64" y2="30" stroke="#8FCB8E" stroke-width="2"/>
    <line x1="35" y1="32" x2="40" y2="64" stroke="#8FCB8E" stroke-width="2"/>
    <line x1="64" y1="30" x2="70" y2="62" stroke="#8FCB8E" stroke-width="2"/>
    <line x1="40" y1="64" x2="70" y2="62" stroke="#8FCB8E" stroke-width="2"/>
    <circle cx="35" cy="32" r="9" fill="#D6573D"/>
    <circle cx="64" cy="30" r="9" fill="#4FA06A"/>
    <circle cx="40" cy="64" r="9" fill="#A9744B"/>
    <circle cx="70" cy="62" r="9" fill="#6A3D5B"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="catalogue-data.jsx"></script>
<script type="text/babel" src="catalogue.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "startView": "fiches",
  "showBad": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <>
      <div className="stagewrap">
        <CatalogueApp startView={t.startView} showBad={t.showBad} />
        <span className="cap"><i className="ph-fill ph-hand-tap"></i>Cherche &amp; filtre · bascule Fiches / Réseau · touche une plante → fiche</span>
      </div>

      <TweaksPanel>
        <TweakSection label="Catalogue" />
        <TweakRadio label="Vue par défaut" value={t.startView}
          options={[{ value: "fiches", label: "Fiches" }, { value: "reseau", label: "Réseau" }]}
          onChange={(v) => setTweak("startView", v)} />
        <TweakToggle label="Réseau : montrer les associations à éviter" value={t.showBad}
          onChange={(v) => setTweak("showBad", v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

i18n:
  fr:
    nom_commun: Blé tendre
    noms_alternatifs: [Froment, Blé]
    description: >
      Céréale de la famille des Poacées, cultivée pour ses grains panifiables.
      Au potager, une petite planche de blé se cultive à but pédagogique ou
      pour la paille et la farine maison. Existe en blé d'hiver (semé en
      automne, très rustique) et blé de printemps (semé au printemps, cycle
      plus court).
    conseils_culture: >
      Semer à la volée puis enfouir légèrement, en sol riche et bien préparé.
      Le blé d'hiver, semé en octobre-novembre, tallent en hiver et se récolte
      l'été suivant. Peu exigeant en eau une fois installé. Désherber les
      premières semaines, le temps que le couvert se referme.
    conseils_recolte: >
      Récolter à maturité complète, quand les épis sont secs et dorés et que le
      grain est dur (ne se marque plus à l'ongle). Battre puis vanner pour
      séparer le grain de la balle ; stocker au sec.
    erreurs_frequentes:
      - Semis trop dense (verse et maladies foliaires)
      - Récolte prématurée (grains mous, mauvaise conservation)
      - Excès d'azote (verse des tiges)
  en:
    nom_commun: Bread wheat
    noms_alternatifs: [Common wheat]
    description: >
      A Poaceae grown for its bread-making grain. In the garden, a small wheat
      bed is grown for teaching, straw or home flour. Available as hardy winter
      wheat and shorter-cycle spring wheat.


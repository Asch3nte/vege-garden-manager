i18n:
  fr:
    nom_commun: Amarante
    noms_alternatifs: [Amarante queue-de-renard, Discipline de religieuse]
    description: >
      Pseudo-céréale de la famille des Amaranthacées, à la fois ornementale
      (longs épis retombants) et nourricière : ses minuscules graines très
      protéinées et ses jeunes feuilles se consomment. Plante en C4, vigoureuse
      et résistante à la chaleur et à la sécheresse.
    conseils_culture: >
      Semer après les dernières gelées (frileuse), en sol réchauffé. Éclaircir
      les jeunes plants. Croissance rapide en été. Récolter les feuilles jeunes
      au fil des besoins ; laisser mûrir les épis pour la récolte des graines.
    conseils_recolte: >
      Feuilles : cueillir jeunes comme des épinards. Graines : couper les épis
      quand ils sèchent et qu'ils libèrent les grains au froissement, puis
      battre et vanner. Séchage complet avant stockage.
    erreurs_frequentes:
      - Semis trop précoce (très sensible au froid)
      - La cultiver après épinard, betterave ou quinoa (même famille)
      - La laisser grainer partout (ressemis abondant)
  en:
    nom_commun: Amaranth
    noms_alternatifs: [Love-lies-bleeding, Tassel flower]
    description: >
      A pseudo-cereal of the Amaranthaceae family, both ornamental (long drooping
      tassels) and edible: its tiny protein-rich seeds and young leaves are
      eaten. A vigorous C4 plant tolerant of heat and drought.


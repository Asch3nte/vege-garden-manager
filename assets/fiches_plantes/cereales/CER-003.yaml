id: CER-003
version_fiche: 1
categorie: cereale
schema_version: 1
difficulte: 2
usages:
  - alimentaire

rusticite:
  zone_min: zone6
nom_scientifique: Chenopodium quinoa
famille_botanique: Amaranthaceae

i18n:
  fr:
    nom_commun: Quinoa
    noms_alternatifs: [Riz du Pérou, Chénopode quinoa]
    description: >
      Pseudo-céréale de la famille des Amaranthacées (comme l'épinard et la
      betterave), cultivée pour ses graines riches en protéines ; les jeunes
      feuilles se consomment aussi comme des épinards. Rustique et tolérante à
      la sécheresse, elle s'acclimate bien en climat tempéré.
    conseils_culture: >
      Semer au printemps, en sol léger et drainé. Éclaircir les jeunes plants.
      Peu gourmande en eau une fois installée. Rincer les graines récoltées à
      l'eau claire pour éliminer la saponine amère qui les enrobe.
    conseils_recolte: >
      Récolter quand les panicules sont sèches et que les graines se détachent
      sous les doigts. Battre, vanner, puis rincer abondamment avant séchage
      et stockage au sec.
    erreurs_frequentes:
      - Oublier de rincer les graines (amertume de la saponine)
      - Semis en sol détrempé (fonte des semis)
      - La cultiver après épinard ou betterave (même famille, mêmes ravageurs)
  en:
    nom_commun: Quinoa
    description: >
      A pseudo-cereal of the Amaranthaceae family (like spinach and beetroot),
      grown for its protein-rich seeds; young leaves are eaten like spinach.
      Hardy and drought-tolerant, it adapts well to temperate climates.


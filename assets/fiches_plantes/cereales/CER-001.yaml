i18n:
  fr:
    nom_commun: Maïs doux
    noms_alternatifs: [Maïs sucré, Blé d'Inde]
    description: >
      Céréale annuelle de la famille des Poacées, cultivée pour ses épis
      sucrés récoltés au stade laiteux. Pilier de la « milpa » (les trois
      sœurs) : sa tige robuste sert de tuteur vivant au haricot grimpant,
      tandis que la courge couvre le sol à ses pieds.
    conseils_culture: >
      Semer après les dernières gelées, en blocs serrés (plusieurs rangs
      rapprochés) plutôt qu'en ligne unique : la pollinisation se fait par le
      vent et exige la proximité des plants. Sol riche et frais, arrosages
      soutenus à la floraison et au remplissage des grains.
    conseils_recolte: >
      Récolter au stade laiteux : les soies (barbes) brunissent et un grain
      pressé à l'ongle libère un jus laiteux. La teneur en sucre chute vite
      après récolte : consommer ou transformer dans les heures qui suivent.
    erreurs_frequentes:
      - Semer en une seule ligne (pollinisation ratée, épis incomplets)
      - Récolter trop tard (grains farineux, perte de sucre)
      - Manque d'eau à la floraison (épis mal remplis)
  en:
    nom_commun: Sweet corn
    noms_alternatifs: [Sugar corn]
    description: >
      An annual Poaceae grown for its sweet ears harvested at the milk stage.
      Cornerstone of the "three sisters": its sturdy stalk is a living stake for
      climbing beans while squash covers the ground below.


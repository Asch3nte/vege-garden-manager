# Fiche mère (espèce) — Origan.
# Taxonomie : Origanum vulgare. Agronomie : références horticoles.
id: ARO-010
varietes_connues: [ARO-010-V001, ARO-010-V002]
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 1
usages:
  - condimentaire
  - medicinale
  - mellifere
  - attire_auxiliaires
  - couvre_sol

rusticite:
  zone_min: zone5

nom_scientifique: Origanum vulgare
famille_botanique: Lamiaceae

i18n:
  fr:
    nom_commun: Origan
    noms_alternatifs: [Marjolaine sauvage, Origan commun, Thé rouge]
    description: >
      Vivace herbacée à souche traçante, spontanée sur les coteaux calcaires
      d'Europe. Tiges dressées de 30 à 60 cm portant de petites feuilles ovales
      et des bouquets de fleurs roses à pourpres de juillet à septembre —
      l'une des plantes les plus visitées du potager par les abeilles, papillons
      et syrphes. Sa teneur en carvacrol, donc son parfum, dépend fortement de
      l'ensoleillement : un origan cultivé à l'ombre est fade.
    conseils_culture: >
      Plein soleil impératif pour le parfum, sol drainé même pauvre et
      caillouteux. Très rustique et sobre en eau une fois installé. La souche
      s'étend doucement : diviser tous les 3 ans pour rajeunir. Rabattre les
      tiges sèches en fin d'hiver. Excellent en bordure ou en rocaille, où il
      joue aussi le rôle de couvre-sol et de réservoir d'auxiliaires.
    conseils_recolte: >
      Récolter les tiges juste au début de la floraison, moment où la
      concentration en huiles essentielles est maximale — c'est le seul moment
      qui donne l'arôme puissant de l'origan séché du commerce. Couper à 10 cm
      du sol ; une seconde pousse suit en fin d'été.
    erreurs_frequentes:
      - Culture à l'ombre ou en sol trop riche (feuillage abondant mais sans parfum)
      - Récolte trop tardive après la pleine floraison (arôme retombé)
      - Confusion avec la marjolaine (Origanum majorana), plus douce et non rustique
  en:
    nom_commun: Oregano
    noms_alternatifs: [Wild marjoram]
    description: >
      Hardy herbaceous perennial of European limestone hillsides. Its flavour
      depends strongly on sunlight — oregano grown in shade is bland. Its
      summer flowers are among the most visited by pollinators in the garden.


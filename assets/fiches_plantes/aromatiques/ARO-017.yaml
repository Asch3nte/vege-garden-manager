# Fiche mère (espèce) — Laurier-sauce.
# Taxonomie : Laurus nobilis. Seul « laurier » comestible : ne pas confondre
# avec le laurier-rose ou le laurier-cerise, tous deux toxiques.
id: ARO-017
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 1
usages:
  - condimentaire
  - medicinale
  - ornementale
  - brise_vent

rusticite:
  zone_min: zone8

nom_scientifique: Laurus nobilis
famille_botanique: Lauraceae

i18n:
  fr:
    nom_commun: Laurier-sauce
    noms_alternatifs: [Laurier noble, Laurier d'Apollon, Laurier vrai]
    description: >
      Arbre ou grand arbuste méditerranéen à feuillage persistant, pouvant
      atteindre 10 m en pleine terre mais se conduisant très bien taillé à 2 m
      ou en bac. Feuilles coriaces, vert sombre et luisantes, au parfum
      balsamique caractéristique, base du bouquet garni. C'est le laurier des
      couronnes de l'Antiquité — et le seul laurier comestible du jardin :
      le laurier-rose (Nerium) et le laurier-cerise (Prunus laurocerasus) sont
      toxiques et ne doivent jamais être utilisés en cuisine.
    conseils_culture: >
      Sol ordinaire bien drainé, exposition chaude et abritée des vents froids.
      Rustique jusqu'à environ –10 °C une fois adulte ; les jeunes sujets sont
      plus fragiles et méritent un voile hivernal les premières années. Au nord
      de la Loire, la culture en bac à rentrer en hiver est la plus sûre.
      Tailler au printemps, il supporte très bien la taille (topiaire, haie).
      Surveiller le psylle du laurier, qui enroule et déforme les jeunes feuilles.
    conseils_recolte: >
      Cueillir les feuilles toute l'année, en préférant les plus âgées, plus
      parfumées que les jeunes pousses tendres. Une feuille fraîche est plus
      amère qu'une feuille séchée : le séchage adoucit et affine l'arôme.
    erreurs_frequentes:
      - Confondre avec le laurier-rose ou le laurier-cerise, toxiques
      - Planter en situation froide et venteuse sans protection (dégâts à -10 °C)
      - Utiliser les jeunes feuilles fraîches en grande quantité (amertume)
  en:
    nom_commun: Bay laurel
    noms_alternatifs: [Sweet bay, True laurel]
    description: >
      Evergreen Mediterranean tree or large shrub, easily kept clipped or grown
      in a pot. The only edible laurel in the garden — oleander and cherry
      laurel are toxic and must never be used in cooking.


# Fiche mère (espèce) — Sarriette vivace.
# Taxonomie : Satureja montana. Distincte de la sarriette annuelle (ARO-013).
id: ARO-014
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 1
usages:
  - condimentaire
  - medicinale
  - mellifere
  - compagnonnage
  - ornementale

rusticite:
  zone_min: zone5

nom_scientifique: Satureja montana
famille_botanique: Lamiaceae

i18n:
  fr:
    nom_commun: Sarriette vivace
    noms_alternatifs: [Sarriette des montagnes, Sarriette d'hiver, Pèbre d'ai]
    description: >
      Sous-arbuste vivace des garrigues et des pentes calcaires, formant un
      coussin dense et persistant de 30 à 40 cm. Feuilles étroites, coriaces et
      pointues, au goût nettement plus fort, camphré et poivré que celui de la
      sarriette annuelle. Floraison blanche tardive, d'août à octobre, qui en
      fait une ressource nectarifère précieuse en fin de saison, quand peu de
      plantes fleurissent encore. Très rustique et très longévive.
    conseils_culture: >
      Plein soleil, sol caillouteux, sec et calcaire, drainage impératif.
      Ne demande ni arrosage ni fertilisation une fois installée. Tailler
      légèrement au printemps pour maintenir le coussin compact, sans entamer
      le vieux bois. Excellente en bordure de planche permanente, en rocaille
      ou au pied d'un mur exposé au sud, où elle reste verte tout l'hiver.
    conseils_recolte: >
      Récolter toute l'année, le feuillage étant persistant, avec un maximum
      d'arôme juste avant la floraison d'août. Prélever les jeunes pousses de
      l'extrémité des rameaux.
    erreurs_frequentes:
      - Sol lourd et humide en hiver (pourriture du collet)
      - Taille dans le vieux bois (pas de reprise)
      - L'utiliser en même quantité que la sarriette annuelle (son goût est bien plus puissant)
  en:
    nom_commun: Winter savory
    noms_alternatifs: [Mountain savory]
    description: >
      Hardy evergreen sub-shrub of limestone scrubland, with a stronger, more
      camphorous flavour than summer savory. Its late flowering is a valuable
      nectar source at the end of the season.


i18n:
  fr:
    nom_commun: Persil
    noms_alternatifs: [Persil commun, Persil plat, Persil frisé]
    description: >
      Plante herbacée bisannuelle de la famille des Apiacées, cultivée pour ses
      feuilles aromatiques consommées en condiment. Le persil plat (var. neapolitanum)
      possède un arôme plus puissant ; le persil frisé (var. crispum) est plus
      décoratif et résistant. Très riche en vitamine C, K et A. La germination
      est notairement lente (2 à 6 semaines), décourageant les jardiniers débutants.
    conseils_culture: >
      Semer en pleine terre ou en terrine dès le printemps. Tremper les graines
      12 h dans l'eau chaude avant le semis pour accélérer la levée. Maintenir le
      sol humide pendant la germination (souvent 3 à 5 semaines). En seconde année,
      la plante monte en graines — à cueillir avant si l'on veut conserver les
      arômes foliaires. Paillage conseillé pour garder la fraîcheur du sol.
    conseils_recolte: >
      Cueillir les tiges extérieures au fur et à mesure des besoins, de préférence
      le matin. Ne jamais récolter plus du tiers de la plante d'un coup. La récolte
      est possible jusqu'au début de la montée en graines en deuxième année.
    erreurs_frequentes:
      - Découragement face à la germination lente (normale, jusqu'à 5 semaines)
      - Sol trop sec lors de la levée (graines avortées ou germination bloquée)
      - Plantation en plein soleil en été (brûlures des feuilles, montée en graines précoce)
  en:
    nom_commun: Parsley
    noms_alternatifs: [Flat-leaf parsley, Garden parsley]
    description: >
      Biennial herb in the Apiaceae family, widely cultivated for its aromatic
      leaves used as a condiment. Notoriously slow to germinate (2–6 weeks).
      Very rich in vitamins C, K, and A.


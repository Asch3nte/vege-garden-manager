# Fiche mère (espèce) — Mélisse.
# Taxonomie : Melissa officinalis. Agronomie : références horticoles.
id: ARO-012
varietes_connues: [ARO-012-V001]
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 1
usages:
  - condimentaire
  - medicinale
  - mellifere
  - attire_auxiliaires

rusticite:
  zone_min: zone4

nom_scientifique: Melissa officinalis
famille_botanique: Lamiaceae

i18n:
  fr:
    nom_commun: Mélisse
    noms_alternatifs: [Mélisse officinale, Citronnelle, Piment des abeilles, Thé de France]
    description: >
      Vivace herbacée très rustique formant une touffe dense de 50 à 80 cm, aux
      feuilles gaufrées vert tendre dégageant au froissement une odeur
      citronnée franche (citral, citronellal). Son nom vient du grec melissa,
      « abeille » : les apiculteurs frottaient jadis les ruches de ses feuilles
      pour y fixer les essaims. Fleurs blanches discrètes de juin à septembre,
      très mellifères. Se ressème abondamment et peut devenir envahissante.
    conseils_culture: >
      L'une des rares aromatiques qui préfère la mi-ombre et un sol frais : au
      plein soleil brûlant, son feuillage jaunit. Sol ordinaire, même lourd,
      pourvu qu'il reste frais. Rabattre à 10 cm après la floraison pour obtenir
      une repousse tendre et éviter le semis spontané massif. Diviser la touffe
      tous les 3 ou 4 ans. À contenir si l'on ne veut pas la voir coloniser :
      supprimer les fleurs avant montée en graine.
    conseils_recolte: >
      Cueillir les feuilles jeunes, avant la floraison — ensuite, le parfum
      citronné faiblit nettement. Utiliser de préférence fraîche : la mélisse
      est l'une des herbes qui perdent le plus à la dessiccation.
    erreurs_frequentes:
      - Plein soleil et sol sec (feuillage jauni, parfum médiocre)
      - Récolte après floraison (arôme citronné très atténué)
      - La laisser monter en graine (semis spontanés envahissants)
      - Compter sur la mélisse séchée (parfum largement perdu ; préférer fraîche ou congelée)
  en:
    nom_commun: Lemon balm
    noms_alternatifs: [Common balm, Bee balm]
    description: >
      Very hardy herbaceous perennial with crinkled leaves smelling strongly of
      lemon. One of the few herbs preferring part shade and cool soil. Loved by
      bees, and a vigorous self-seeder.


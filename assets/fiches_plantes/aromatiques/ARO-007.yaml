i18n:
  fr:
    nom_commun: Fenouil
    noms_alternatifs: [Fenouil commun, Fenouil officinal, Fenouil aromatique]
    description: >
      Plante vivace de la famille des Apiacées, cultivée pour son feuillage
      anisé, ses graines et ses ombelles très visitées par les auxiliaires
      (syrphes, guêpes parasitoïdes). À distinguer du fenouil bulbeux
      (var. azoricum), cultivé en légume annuel. Attention : fenouil réputé
      allélopathique, à isoler des cultures.
    conseils_culture: >
      Semer en place au printemps, en plein soleil et sol drainé. Le planter
      à l'écart du potager : ses exsudats racinaires inhibent de nombreuses
      cultures voisines. Rabattre en fin de saison ; la souche repart chaque
      année en climat doux.
    conseils_recolte: >
      Prélever le feuillage au besoin tout au long de la saison. Récolter les
      graines quand les ombelles brunissent, puis les faire sécher à l'ombre.
    erreurs_frequentes:
      - Le planter au milieu du potager (effet allélopathique sur les voisins)
      - Le confondre avec le fenouil-bulbe (légume, cycle annuel)
      - Laisser toutes les ombelles grainer (ressemis envahissant)
  en:
    nom_commun: Fennel
    noms_alternatifs: [Common fennel, Herb fennel]
    description: >
      A perennial of the Apiaceae family grown for its anise-scented foliage and
      seeds; its umbels attract many beneficial insects. Distinct from bulb
      fennel (var. azoricum). Reputedly allelopathic — best isolated from crops.


# Fiche mère (espèce) — Aneth.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Aromatique ombellifère, attire les auxiliaires. Créée au lot « fleurs
# compagnes » pour résoudre les références orphelines (ex-id legacy `aneth`).
id: ARO-007
varietes_connues: [ARO-007-V001, ARO-007-V002]
version_fiche: 2
categorie: aromatique
schema_version: 1
difficulte: 1
usages:
  - condimentaire
  - attire_auxiliaires
  - mellifere

rusticite:
  zone_min: zone7
nom_scientifique: Anethum graveolens
famille_botanique: Apiaceae

i18n:
  fr:
    nom_commun: Aneth
    noms_alternatifs: [Fenouil bâtard, Aneth odorant]
    description: >
      Plante aromatique annuelle de la famille des Apiacées, au feuillage fin et
      aux ombelles jaunes. Feuilles et graines sont condimentaires. Ses fleurs
      attirent de nombreux insectes auxiliaires (syrphes, guêpes parasitoïdes).
    conseils_culture: >
      Semer en place, l'aneth supporte mal le repiquage à cause de sa racine
      pivotante. Sol léger et bien drainé, plein soleil. Échelonner les semis
      pour disposer de feuilles fraîches tout l'été.
    conseils_recolte: >
      Cueillir les feuilles jeunes avant la floraison pour le maximum d'arôme.
      Récolter les graines quand les ombelles brunissent.
    erreurs_frequentes:
      - Repiquage (la racine pivotante supporte mal le déplacement)
      - Semis unique (montée à graines rapide, feuilles vite épuisées)
  en:
    nom_commun: Dill
    description: >
      Annual herb of the Apiaceae family with feathery foliage and yellow
      umbels. Leaves and seeds are used as seasoning; its flowers attract many
      beneficial insects.


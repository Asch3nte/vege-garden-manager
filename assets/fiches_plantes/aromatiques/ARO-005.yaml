nom_scientifique: Mentha piperita
famille_botanique: Lamiaceae

i18n:
  fr:
    nom_commun: Menthe poivrée
    noms_alternatifs: [Menthe anglaise, Peppermint]
    description: >
      Hybride naturel vivace entre la menthe aquatique et la menthe verte
      (Mentha × piperita), aux feuilles ovales vert foncé à reflets violacés,
      dégageant un puissant arôme mentholé froid. Rhizomateuse et envahissante
      si non contenue. Très facile à cultiver, tolère la mi-ombre et les sols
      frais, voire humides. Propriétés digestives reconnues en phytothérapie.
    conseils_culture: >
      Planter en pot ou délimiter la zone de plantation avec une barrière
      enfoncée à 30 cm pour maîtriser l'expansion des rhizomes. Préfère un
      sol frais et légèrement ombragé. Arroser régulièrement. Couper les tiges
      florales pour prolonger la production de feuilles. Diviser les touffes
      tous les 2–3 ans.
    conseils_recolte: >
      Couper les tiges à 5 cm du sol dès qu'elles atteignent 20 cm. La repousse
      est rapide. Récolter avant floraison pour un taux de menthol maximal.
      On peut réaliser 2 à 3 coupes par saison.
    erreurs_frequentes:
      - Ne pas contenir les rhizomes (colonise toute la planche en une saison)
      - Sol trop sec (feuilles petites et arôme réduit)
      - Laisser fleurir sans tailler (la plante s'épuise et le menthol diminue)
  en:
    nom_commun: Peppermint
    noms_alternatifs: [English mint]
    description: >
      Natural hybrid perennial (Mentha × piperita) with strongly menthol-scented
      leaves. Rhizomatous and spreading — plant in containers or with a root
      barrier. Easy to grow, tolerates semi-shade and moist soils.


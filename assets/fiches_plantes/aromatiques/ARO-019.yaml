    conditions_i18n: { fr: "Feuilles séchées à l'ombre ; le goût reste très puissant après séchage", en: "Leaves dried in the shade; the flavour stays very strong" }
  - methode: congelation
    duree_mois: 12
  - methode: frais
    duree_jours: 5
utilisations_culinaires_i18n:

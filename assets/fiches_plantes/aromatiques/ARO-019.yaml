# Fiche mère (espèce) — Livèche.
# Taxonomie : Levisticum officinale. Agronomie : références horticoles.
id: ARO-019
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 1
usages:
  - condimentaire
  - medicinale
  - mellifere
  - attire_auxiliaires

rusticite:
  zone_min: zone4

nom_scientifique: Levisticum officinale
famille_botanique: Apiaceae

i18n:
  fr:
    nom_commun: Livèche
    noms_alternatifs: [Ache des montagnes, Céleri perpétuel, Herbe à Maggi]
    description: >
      Grande vivace très rustique et très longévive, atteignant 1,50 à 2 m en
      pleine végétation, aux larges feuilles luisantes découpées rappelant
      celles du céleri. Son goût, extrêmement puissant, évoque le céleri
      concentré — d'où son surnom d'« herbe à Maggi », bien que la marque n'en
      contienne pas. Grandes ombelles jaune verdâtre en juin-juillet, très
      visitées par les syrphes et les micro-guêpes auxiliaires. Un seul pied
      suffit largement à un foyer.
    conseils_culture: >
      Réserver un emplacement définitif en fond de planche ou en bordure de
      potager : la livèche est encombrante et vit 10 à 15 ans au même endroit.
      Sol profond, frais et riche, mi-ombre ou soleil non brûlant. Semer les
      graines fraîches à l'automne (elles perdent vite leur pouvoir germinatif)
      ou diviser une touffe au printemps. Rabattre après floraison pour obtenir
      une repousse de feuilles tendres. Disparaît totalement en hiver et
      repart de souche en mars.
    conseils_recolte: >
      Cueillir les jeunes feuilles de mai à septembre, à la demande. Les tiges
      creuses se consomment comme du céleri branche, les graines s'utilisent
      comme condiment. Doser très peu : une seule feuille suffit à parfumer un
      grand potage.
    erreurs_frequentes:
      - Sous-estimer sa taille adulte et la planter au milieu d'une planche (elle ombrage tout)
      - Dosage culinaire trop généreux (le goût domine entièrement le plat)
      - Semer des graines anciennes (pouvoir germinatif perdu en un an)
  en:
    nom_commun: Lovage
    noms_alternatifs: [Garden lovage, Maggi herb]
    description: >
      Very hardy, long-lived perennial reaching up to 2 m, with a powerful
      concentrated celery flavour. One plant is ample for a household. Its
      umbels are much visited by hoverflies and parasitic wasps.


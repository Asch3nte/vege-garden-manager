associations:
  beneficies:
    - id: LEG-020
      type: repulsion_ravageur
      raison_i18n: { fr: "Réputée fortifier les pommes de terre voisines et gêner leurs ravageurs", en: "Reputed to strengthen neighbouring potatoes and hamper their pests" }
    - id: LEG-001
      type: attraction_pollinisateurs
      raison_i18n: { fr: "Ses larges ombelles attirent syrphes et micro-guêpes, auxiliaires contre les pucerons", en: "Its broad umbels draw hoverflies and parasitic wasps, allies against aphids" }
    - id: LEG-013
      type: attraction_pollinisateurs
      raison_i18n: { fr: "Réservoir d'auxiliaires en bordure des rangs de haricots", en: "A reservoir of beneficial insects at the edge of bean rows" }
  defavorables:
    - id: LEG-014
      type: competition_lumiere
      raison_i18n: { fr: "Son ombre portée est trop dense pour des salades installées à moins d'un mètre", en: "Its shade is too dense for lettuces planted within a metre" }
    - id: LEG-004
      type: meme_famille_ravageurs
      raison_i18n: { fr: "Même famille que la carotte : partage la mouche de la carotte et les maladies des apiacées", en: "Same family as carrot: shares carrot root fly and apiaceae diseases" }

rotation:

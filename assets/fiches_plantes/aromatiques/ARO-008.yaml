associations:
  beneficies:
    - id: LEG-007
      type: [repulsion_ravageur, brouillage_olfactif]
      raison_i18n: { fr: "Son odeur camphrée perturbe la piéride et la mouche du chou en quête de crucifères", en: "Its camphor scent confuses cabbage white and cabbage root fly hunting for brassicas" }
    - id: LEG-006
      type: repulsion_ravageur
      raison_i18n: { fr: "Éloigne les chenilles de piéride des brocolis", en: "Deters cabbage white caterpillars from broccoli" }
    - id: LEG-004
      type: brouillage_olfactif
      raison_i18n: { fr: "Masque l'odeur des carottes auprès de la mouche de la carotte", en: "Masks the carrot smell from carrot root fly" }
    - id: LEG-013
      type: repulsion_ravageur
      raison_i18n: { fr: "Réputé éloigner la bruche et les pucerons des haricots", en: "Reputed to deter bean weevil and aphids" }

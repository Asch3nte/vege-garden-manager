    duree_jours: 10
    conditions_i18n: { fr: "Rameaux au réfrigérateur dans un linge humide", en: "Sprigs refrigerated in a damp cloth" }
  - methode: sechage
    duree_mois: 24
    conditions_i18n: { fr: "Bouquets suspendus à l'ombre ; l'arôme se conserve très longtemps", en: "Bunches hung in the shade; the aroma keeps for a very long time" }
  - methode: congelation
    duree_mois: 12

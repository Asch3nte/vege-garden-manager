# Fiche mère (espèce) — Romarin.
# Taxonomie : Salvia rosmarinus (ex-Rosmarinus officinalis, reclassé dans Salvia
# en 2017). Agronomie : références horticoles.
id: ARO-008
varietes_connues: [ARO-008-V001, ARO-008-V002]
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 1
usages:
  - condimentaire
  - medicinale
  - mellifere
  - compagnonnage
  - ornementale

rusticite:
  zone_min: zone7

nom_scientifique: Salvia rosmarinus
famille_botanique: Lamiaceae

i18n:
  fr:
    nom_commun: Romarin
    noms_alternatifs: [Rosmarinus officinalis, Encensier, Herbe aux couronnes]
    description: >
      Arbuste vivace méditerranéen à feuillage persistant, aux feuilles étroites
      en aiguilles, vert sombre dessus et blanchâtres dessous, très riches en
      huiles essentielles (cinéole, camphre). Reclassé dans le genre Salvia en
      2017, il reste universellement connu sous son ancien nom Rosmarinus
      officinalis. Floraison bleu pâle de février à mai — l'une des toutes
      premières ressources nectarifères de l'année pour les abeilles. Peut
      atteindre 1,5 m et vivre plus de vingt ans en sol drainé.
    conseils_culture: >
      Planter au plein soleil, en sol caillouteux, pauvre et parfaitement
      drainé ; le romarin meurt d'excès d'eau bien plus souvent que de froid.
      En terre lourde, planter sur butte ou en grand pot. Aucun arrosage une
      fois établi, sauf pot. Tailler légèrement après la floraison, jamais dans
      le vieux bois qui ne repart pas. En zone 6 ou plus froide, cultiver en
      pot à rentrer, ou choisir une variété prostrée abritée d'un mur au sud.
    conseils_recolte: >
      Récolter toute l'année en prélevant les jeunes rameaux de l'extrémité, de
      préférence le matin. Ne jamais dénuder un rameau entier. L'arôme est le
      plus concentré juste avant la floraison.
    erreurs_frequentes:
      - Sol lourd et humide en hiver (première cause de mort, avant le gel)
      - Taille dans le vieux bois (la branche ne repart pas)
      - Arrosage régulier une fois la plante établie (pourriture des racines)
      - Fertilisation azotée (pousse molle, arôme dilué, sensibilité au froid)
  en:
    nom_commun: Rosemary
    noms_alternatifs: [Rosmarinus officinalis]
    description: >
      Evergreen Mediterranean shrub with narrow needle-like leaves rich in
      essential oils. Flowers very early in the year, a key nectar source for
      bees. Dies of waterlogging far more often than of cold.


rusticite:
  zone_min: zone3
nom_scientifique: Anethum graveolens
famille_botanique: Apiaceae

i18n:
  fr:
    nom_commun: Aneth
    noms_alternatifs: [Fenouil bâtard, Aneth odorant]
    description: >
      Plante annuelle de la famille des Apiacées, au feuillage plumeux anisé et
      aux graines aromatiques. Ses ombelles jaunes attirent fortement les
      auxiliaires (syrphes, guêpes parasitoïdes des chenilles), ce qui en fait
      une bonne compagne des choux.
    conseils_culture: >
      Semer en place à partir du printemps (supporte mal le repiquage, racine
      pivotante). Échelonner les semis pour un feuillage tendre en continu.
      Éviter la proximité du fenouil (croisement) et de la carotte (même
      famille, ravageurs communs).
    conseils_recolte: >
      Cueillir le feuillage jeune au besoin ; il perd son arôme après la
      montée en fleurs. Récolter les graines à maturité brune des ombelles.
    erreurs_frequentes:
      - Repiquage (la racine pivotante supporte mal la transplantation)
      - Semis unique (montée en graines rapide, prévoir des semis échelonnés)
      - Proximité de la carotte ou du fenouil
  en:
    nom_commun: Dill
    description: >
      An annual of the Apiaceae family with feathery anise-scented foliage and
      aromatic seeds. Its yellow umbels strongly attract beneficial insects,
      making it a good companion to brassicas.


conservation:
  - methode: frais
    duree_jours: 5
    conditions_i18n: { fr: "Tiges au réfrigérateur dans un linge humide", en: "Stems refrigerated in a damp cloth" }
  - methode: conserves
    duree_mois: 12
    conditions_i18n: { fr: "Meilleure conservation : branches entières dans du vinaigre blanc — le vinaigre à l'estragon est un classique", en: "Best method: whole sprigs in white vinegar — tarragon vinegar is a classic" }
  - methode: congelation
    duree_mois: 6
  - methode: sechage
    duree_mois: 6
    conditions_i18n: { fr: "Déconseillé : l'arôme anisé disparaît presque entièrement", en: "Not recommended: the anise aroma is almost entirely lost" }

associations:
  beneficies:
    - id: LEG-002
      type: repulsion_ravageur
      raison_i18n: { fr: "Réputé éloigner plusieurs ravageurs des solanacées par son odeur anisée", en: "Reputed to deter several nightshade pests with its anise scent" }
    - id: LEG-014
      raison_i18n: { fr: "Bon voisin des salades, sans concurrence en surface", en: "A good neighbour to lettuces, with no surface competition" }
    - id: LEG-001
      type: brouillage_olfactif

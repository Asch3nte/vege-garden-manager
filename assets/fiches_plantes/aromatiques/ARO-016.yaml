# Fiche mère (espèce) — Estragon.
# Taxonomie : Artemisia dracunculus. Attention : l'estragon français est stérile
# et se multiplie uniquement par division/bouturage (voir conseils_culture).
id: ARO-016
varietes_connues: [ARO-016-V001]
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 2
usages:
  - condimentaire
  - medicinale

rusticite:
  zone_min: zone5

nom_scientifique: Artemisia dracunculus
famille_botanique: Asteraceae

i18n:
  fr:
    nom_commun: Estragon
    noms_alternatifs: [Estragon français, Herbe dragon, Serpentine]
    description: >
      Vivace herbacée de 60 à 100 cm, aux longues feuilles étroites vert
      brillant, au parfum anisé et légèrement réglissé caractéristique
      (estragol). L'estragon dit « français », le seul intéressant en cuisine,
      est stérile : il ne produit pas de graines viables et se multiplie
      exclusivement par division de touffe ou bouturage. Tout sachet de graines
      d'« estragon » vendu dans le commerce est en réalité de l'estragon de
      Russie, plus rustique mais nettement moins parfumé.
    conseils_culture: >
      Acheter un plant, jamais des graines, si l'on veut l'estragon français.
      Sol léger, drainé, plutôt pauvre, exposition chaude et abritée. Craint
      l'humidité hivernale bien plus que le froid : pailler le pied en sol
      lourd, ou cultiver en pot. Diviser la touffe tous les 3 ans, sans quoi
      elle s'épuise et le parfum faiblit. Rabattre les tiges sèches en fin
      d'hiver ; la végétation redémarre tard, en avril.
    conseils_recolte: >
      Cueillir les jeunes tiges feuillées de mai à septembre, avant la
      floraison. Le parfum est maximal en début d'été. Utiliser de préférence
      frais ou conservé au vinaigre : le séchage lui va mal.
    erreurs_frequentes:
      - Semer des graines en croyant obtenir l'estragon français (on récolte l'estragon de Russie, fade)
      - Sol lourd et humide en hiver (pourriture des racines, principale cause de perte)
      - Touffe jamais divisée (épuisement, perte de parfum au bout de 3-4 ans)
      - Séchage (l'arôme anisé s'évapore presque entièrement)
  en:
    nom_commun: Tarragon
    noms_alternatifs: [French tarragon]
    description: >
      Herbaceous perennial with narrow glossy leaves and a distinctive anise
      flavour. True French tarragon is sterile and can only be propagated by
      division or cuttings — seed always yields the blander Russian type.


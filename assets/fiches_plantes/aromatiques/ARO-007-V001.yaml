# Fiche fille (variété) — Fenouil bronze 'Purpureum'. Hérite de ARO-007.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: ARO-007-V001
parent_id: ARO-007
version_fiche: 1
schema_version: 1

nom_scientifique: "Foeniculum vulgare 'Purpureum'"

i18n:
  fr:
    nom_commun: Fenouil bronze 'Purpureum'
    noms_alternatifs: [Fenouil pourpre, Bronze fennel]
    description: >
      Variété ornementale à feuillage bronze-pourpre finement découpé, aussi
      aromatique que le type. Prisée en bordure décorative et comme plante
      hôte des chenilles du machaon. Mêmes ombelles mellifères jaunes.
    conseils_culture: >
      Culture identique au fenouil commun. La coloration pourpre est plus
      intense en plein soleil. À isoler du potager comme le type
      (allélopathie).
  en:
    nom_commun: Bronze fennel 'Purpureum'
    description: >
      An ornamental variety with finely cut bronze-purple foliage, as aromatic
      as the type and a host plant for swallowtail caterpillars.

sources:
  - https://fr.wikipedia.org/wiki/Fenouil_commun
contributeurs:

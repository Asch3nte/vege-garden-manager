# Fiche mère (espèce) — Marjolaine.
# Taxonomie : Origanum majorana. Distincte de l'origan (ARO-010) : plus douce,
# non rustique ssous nos climats, cultivée en annuelle.
id: ARO-011
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 2
usages:
  - condimentaire
  - medicinale
  - mellifere

rusticite:
  zone_min: zone9

nom_scientifique: Origanum majorana
famille_botanique: Lamiaceae

i18n:
  fr:
    nom_commun: Marjolaine
    noms_alternatifs: [Marjolaine à coquilles, Origan des jardins, Grand origan]
    description: >
      Vivace d'origine méditerranéenne orientale, gélive sous nos climats et de
      ce fait cultivée en annuelle au nord de la Loire. Feuilles petites, ovales
      et grises, au parfum nettement plus doux, sucré et floral que celui de
      l'origan. Ses inflorescences en petites « coquilles » vert pâle, d'où son
      nom, s'épanouissent en fleurs blanches de juillet à septembre. Plante
      délicate, de 30 à 40 cm, qui demande chaleur et lumière.
    conseils_culture: >
      Semer au chaud (18–20 °C) en mars-avril, repiquer après les dernières
      gelées : la marjolaine ne supporte pas le froid et fond au premier gel.
      Sol léger, drainé, plutôt riche — contrairement à l'origan, elle apprécie
      un sol fertile. Arrosages modérés mais réguliers en pot, où elle réussit
      très bien. Sous climat doux (zone 9+), elle passe l'hiver et devient
      vivace ; ailleurs, rentrer un pied en pot pour le conserver.
    conseils_recolte: >
      Couper les tiges avant la pleine floraison, quand les « coquilles » sont
      formées mais les fleurs à peine ouvertes. Deux à trois coupes possibles
      dans la saison. Son parfum délicat s'évapore à la cuisson : l'ajouter en
      fin de préparation.
    erreurs_frequentes:
      - Semis ou plantation trop tôt (la moindre gelée est fatale)
      - La confondre avec l'origan et la croire rustique (elle ne passe pas l'hiver)
      - Cuisson prolongée (l'arôme, plus volatil que celui de l'origan, disparaît)
  en:
    nom_commun: Sweet marjoram
    noms_alternatifs: [Knotted marjoram]
    description: >
      Tender Mediterranean perennial, grown as an annual in temperate gardens.
      Sweeter and more floral than oregano, and — unlike it — killed by the
      first frost.


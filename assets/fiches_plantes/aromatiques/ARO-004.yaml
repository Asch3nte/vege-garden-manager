i18n:
  fr:
    nom_commun: Thym
    noms_alternatifs: [Thym commun, Thym ordinaire, Farigoule]
    description: >
      Sous-arbuste vivace méditerranéen de la famille des Lamiacées, cultivé
      depuis l'Antiquité pour ses propriétés aromatiques et médicinales. Feuilles
      ovales, vert grisâtre, recouvertes d'huiles essentielles (thymol, carvacrol).
      Très rustique une fois établi, il supporte la sécheresse, le calcaire et
      le froid jusqu'à –15 °C. Ses petites fleurs mauves en juin-juillet sont
      extrêmement mellifères.
    conseils_culture: >
      Planter en sol bien drainé, pauvre à modéré, au plein soleil. Éviter les
      terres lourdes et humides qui font pourrir le collet. Le thym tolère
      parfaitement la sécheresse une fois enraciné. Tailler après la floraison
      pour éviter le boisement excessif et maintenir un port compact. Peut
      passer 5 à 10 ans au même endroit sans problème.
    conseils_recolte: >
      Cueillir les rameaux verts en matinée après la rosée, avant floraison
      pour un arôme maximal. Ne pas couper dans le bois mort. Une taille annuelle
      d'un tiers du volume après floraison suffit à maintenir la plante productive.
    erreurs_frequentes:
      - Sol trop riche (favorise la croissance végétative au détriment des arômes)
      - Sol mal drainé ou trop arrosé (pourriture du collet et des racines)
      - Taille trop sévère dans le bois mort (la plante ne repousse pas sur bois)
  en:
    nom_commun: Thyme
    noms_alternatifs: [Common thyme, Garden thyme]
    description: >
      Hardy Mediterranean sub-shrub from the Lamiaceae family, cultivated since
      antiquity for its culinary and medicinal uses. Very drought-tolerant once
      established. Extremely attractive to bees when in flower.


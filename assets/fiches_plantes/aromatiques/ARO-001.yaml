# Agronomie généralisée depuis la variété + références. Généré (Lot 3), relu.
id: ARO-001
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 1
usages:
  - condimentaire
  - repulsif

rusticite:
  zone_min: zone10
nom_scientifique: Ocimum basilicum
famille_botanique: Lamiaceae

i18n:
  fr:
    nom_commun: Basilic
    noms_alternatifs: [Basilic commun, Basilic doux]
    description: >
      Plante aromatique annuelle de la famille des Lamiacées, originaire des
      régions tropicales, cultivée pour ses feuilles parfumées. En climat
      tempéré, elle se cultive en annuelle.
    conseils_culture: >
      Planter après les dernières gelées, en plein soleil et sol riche. Pincer
      régulièrement les sommités pour favoriser la ramification et retarder la
      montée en fleurs.
    conseils_recolte: >
      Récolter les feuilles au fur et à mesure des besoins, de préférence le
      matin. Cueillir avant la floraison pour préserver l'arôme.
    erreurs_frequentes:
      - Plantation trop précoce (très sensible au froid)
      - "Manque d'eau en pleine chaleur (flétrissement rapide)"
  en:
    nom_commun: Basil
    description: >
      A culinary herb of the Lamiaceae family, native to the tropics, grown for
      its fragrant leaves.


# Fiche mère (espèce) — Coriandre.
# Taxonomie : tool/scrap_fiche.dart (GBIF × Wikidata). Agronomie : références horticoles.
id: ARO-006
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 2
usages:
  - condimentaire
  - alimentaire

rusticite:
  zone_min: zone10

nom_scientifique: Coriandrum sativum
famille_botanique: Apiaceae

i18n:
  fr:
    nom_commun: Coriandre
    noms_alternatifs: [Coriandre cultivée, Persil arabe, Cilantro]
    description: >
      Plante herbacée annuelle de la famille des Apiacées, cultivée pour ses
      feuilles aromatiques (usage frais) et ses graines séchées (usage comme
      épice). Arôme puissant et caractéristique — apprécié en cuisine
      asiatique, mexicaine et méditerranéenne. Tendance à monter en graines
      (bolting) très rapidement par temps chaud, ce qui nécessite des semis
      successifs. Les graines constituent une épice à part entière.
    conseils_culture: >
      Semer directement en place toutes les 3–4 semaines pour assurer une
      production continue. Éviter de transplanter (pivotante, sensible au
      repiquage). Arroser régulièrement pour retarder la montée en graines.
      Préférer une exposition mi-ombragée en été chaud. Récolter graines et
      feuilles sont deux utilisations distinctes.
    conseils_recolte: >
      Récolter les feuilles dès que la plante atteint 15–20 cm, avant la
      montée en fleurs. Pour les graines, laisser monter à floraison et
      récolter les ombelles quand les graines brunissent (juillet–août).
      Faire sécher les ombelles têtes en bas sur papier.
    erreurs_frequentes:
      - Transplantation (racine pivotante — semer uniquement en place)
      - Un seul semis (montée en graines rapide, production feuilles interrompue)
      - Sol trop pauvre ou trop sec (montée en graines encore plus rapide)
  en:
    nom_commun: Coriander
    noms_alternatifs: [Cilantro, Chinese parsley]
    description: >
      Annual herb of the Apiaceae family cultivated for its aromatic leaves
      (fresh use) and dried seeds (spice). Prone to bolting in warm weather
      — successive sowings ensure continuous leaf harvest.


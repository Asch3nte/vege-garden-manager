# Fiche mère (espèce) — Hysope.
# Taxonomie : Hyssopus officinalis. Agronomie : références horticoles.
id: ARO-015
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 1
usages:
  - condimentaire
  - medicinale
  - mellifere
  - attire_auxiliaires
  - compagnonnage
  - ornementale

rusticite:
  zone_min: zone5

nom_scientifique: Hyssopus officinalis
famille_botanique: Lamiaceae

i18n:
  fr:
    nom_commun: Hysope
    noms_alternatifs: [Hysope officinale, Herbe sacrée, Herbe de Joseph]
    description: >
      Sous-arbuste vivace méditerranéen au port dressé et compact, de 40 à
      60 cm, aux feuilles étroites vert foncé et au parfum camphré, amer et
      pénétrant. Longs épis de fleurs bleu vif de juillet à septembre,
      littéralement couverts d'abeilles, de bourdons et de papillons — c'est
      l'une des meilleures plantes à auxiliaires du potager. Plante de bordure
      classique des jardins monastiques, taillable en petite haie basse.
    conseils_culture: >
      Plein soleil et sol drainé, calcaire, pauvre ; l'hysope redoute
      l'humidité stagnante bien plus que le froid. Aucun arrosage une fois
      installée. Tailler d'un tiers au printemps pour garder un port dense et
      éviter le boisement. Vit 6 à 8 ans, puis se remplace par bouture ou
      semis. Idéale en bordure de planche, où sa floraison attire les syrphes
      dont les larves consomment les pucerons.
    conseils_recolte: >
      Cueillir les sommités fleuries en début de floraison, ou les jeunes
      feuilles avant floraison pour un usage culinaire. Le goût est très
      prononcé et amer : à doser avec parcimonie, contrairement aux autres
      aromatiques de la même famille.
    erreurs_frequentes:
      - Sol humide en hiver (pourriture)
      - Dosage culinaire excessif (amertume dominante)
      - Tailler trop bas dans le bois (repousse compromise)
  en:
    nom_commun: Hyssop
    noms_alternatifs: [Common hyssop]
    description: >
      Hardy Mediterranean sub-shrub with narrow leaves and a camphorous, bitter
      flavour. Its vivid blue flower spikes are among the very best in the
      garden for bees, bumblebees and hoverflies.


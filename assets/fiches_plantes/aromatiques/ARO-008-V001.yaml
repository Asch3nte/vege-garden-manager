# Fiche fille (variété) — Aneth 'Bouquet'. Hérite de ARO-008.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: ARO-008-V001
parent_id: ARO-008
version_fiche: 1
schema_version: 1

nom_scientifique: "Anethum graveolens 'Bouquet'"

i18n:
  fr:
    nom_commun: Aneth 'Bouquet'
    noms_alternatifs: [Aneth compact 'Bouquet']
    description: >
      Variété la plus répandue, compacte et très productive, à grosses ombelles
      idéales pour les conserves (cornichons, saumure). Feuillage abondant et
      montée en graines un peu plus tardive que les types sauvages.
    conseils_culture: >
      Culture identique à l'aneth commun. Sa vigueur en fait une variété de
      choix pour un premier semis ; échelonner tout de même pour du feuillage
      tendre en continu.
  en:
    nom_commun: Dill 'Bouquet'
    description: >
      The most common variety — compact and highly productive, with large
      umbels ideal for pickling. Abundant foliage and slightly later bolting.

sources:

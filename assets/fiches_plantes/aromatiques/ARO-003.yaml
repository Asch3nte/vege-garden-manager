i18n:
  fr:
    nom_commun: Ciboulette
    noms_alternatifs: [Civette, Ciboulette commune, Appétit]
    description: >
      Plante vivace de la famille des Amaryllidacées, formant des touffes de
      tiges creuses vert vif de 20 à 35 cm. Arôme délicat d'oignon doux. Parmi
      les aromates les plus faciles à cultiver : rustique, peu exigeante et très
      productive. Ses fleurs mauves en pompon sont également comestibles et
      mellifères. Se multiplie par division de touffes ou par semis.
    conseils_culture: >
      Cultiver en touffes denses. Couper régulièrement les tiges à 5 cm du sol
      pour stimuler la repousse. Diviser les touffes tous les 2–3 ans pour
      revitaliser la plante. Peut aussi être cultivée en pot sur un rebord de
      fenêtre. La montée en fleurs est normale : couper les tiges florales si
      l'on veut favoriser la production de feuilles.
    conseils_recolte: >
      Ciseler les tiges à 2–3 cm du sol dès qu'elles atteignent 15 cm. La
      ciboulette repousse rapidement après coupe. Récolter avant la floraison
      pour un arôme optimal. Les fleurs récoltées au stade bouton ou épanouies
      sont comestibles (décoration de salades).
    erreurs_frequentes:
      - Planter trop peu (1–2 pieds : insuffisant pour une vraie récolte régulière)
      - Ne pas diviser les touffes (s'épuisent et se dégarnissent au centre après 3 ans)
      - Laisser monter en graines sans récolter les fleurs (favorise la propagation incontrôlée)
  en:
    nom_commun: Chives
    noms_alternatifs: [Common chives, Onion chives]
    description: >
      Hardy perennial forming dense clumps of hollow green stems (20–35 cm)
      with a mild onion flavour. Very easy to grow, productive, and virtually
      pest-free. Edible purple pompom flowers are also attractive to pollinators.


i18n:
  fr:
    nom_commun: Cerfeuil
    noms_alternatifs: [Cerfeuil commun, Cerfeuil des jardins, Persil d'Espagne]
    description: >
      Annuelle de 30 à 50 cm au feuillage finement découpé, vert tendre,
      dégageant un parfum délicat d'anis et de persil. C'est l'une des quatre
      « fines herbes » de la cuisine française, avec le persil, la ciboulette
      et l'estragon. Plante de mi-ombre à cycle court qui monte très vite en
      graine dès les chaleurs — d'où l'intérêt de semis échelonnés. Ses
      ombelles blanches attirent de nombreux insectes auxiliaires.
    conseils_culture: >
      Semer en place, à la volée ou en ligne, tous les 15 jours de mars à
      septembre : le cerfeuil ne se repique pas et file en graine en 6 à 8
      semaines. Préférer la mi-ombre et un sol frais — au plein soleil d'été,
      il monte presque immédiatement. Ne pas enterrer les graines (elles ont
      besoin de lumière) : simple plombage. Garder le sol humide jusqu'à la
      levée. Semis d'automne possible sous châssis pour une récolte hivernale.
    conseils_recolte: >
      Couper les feuilles 6 à 8 semaines après semis, avant l'apparition des
      tiges florales. Toujours l'utiliser cru ou ajouté en fin de cuisson : la
      chaleur détruit entièrement son parfum, le plus fragile des fines herbes.
    erreurs_frequentes:
      - Semis unique en début de saison (récolte finie en six semaines)
      - Plein soleil en été (montaison quasi immédiate)
      - Graines enterrées trop profond (levée très irrégulière)
      - Cuisson (le parfum disparaît totalement)
  en:
    nom_commun: Chervil
    noms_alternatifs: [Garden chervil, French parsley]
    description: >
      Annual with finely cut foliage and a delicate anise-and-parsley flavour,
      one of the four French fines herbes. Short-cycled and quick to bolt in
      heat, so it is best sown little and often, in part shade.


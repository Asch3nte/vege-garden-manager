# Fiche mère (espèce) — Sarriette des jardins (annuelle).
# Taxonomie : Satureja hortensis. Distincte de la sarriette vivace (ARO-014).
id: ARO-013
version_fiche: 1
categorie: aromatique
schema_version: 1
difficulte: 1
usages:
  - condimentaire
  - medicinale
  - mellifere
  - compagnonnage
  - repulsif

rusticite:
  zone_min: zone9

nom_scientifique: Satureja hortensis
famille_botanique: Lamiaceae

i18n:
  fr:
    nom_commun: Sarriette des jardins
    noms_alternatifs: [Sarriette annuelle, Sarriette commune, Herbe de Saint-Julien, Poivre d'âne]
    description: >
      Annuelle méditerranéenne de 30 à 40 cm, aux tiges fines et rougeâtres
      portant d'étroites feuilles vert sombre au goût poivré et chaud, proche
      du thym mais plus piquant. Petites fleurs blanc rosé de juillet à
      septembre, très visitées par les abeilles. C'est la sarriette
      traditionnellement semée au pied des fèves et des haricots, réputée en
      éloigner les pucerons noirs — l'une des associations les mieux ancrées
      dans la pratique potagère.
    conseils_culture: >
      Semer en place en avril-mai, en sol léger, drainé et pauvre, au plein
      soleil : la sarriette ne se repique pas volontiers. Éclaircir à 20 cm.
      Aucun arrosage sauf sécheresse marquée, aucun apport d'azote. Semer
      directement entre les rangs de fèves et de haricots pour bénéficier de
      son effet répulsif. Se ressème seule d'une année sur l'autre en sol léger.
    conseils_recolte: >
      Récolter les tiges avant ou pendant la floraison, moment où l'arôme est
      le plus puissant. Couper la plante entière en fin d'été et la sécher en
      bouquets : la sarriette séchée conserve très bien son goût poivré.
    erreurs_frequentes:
      - Semis en godet puis repiquage (la plante supporte mal le déplacement)
      - Sol trop riche ou trop arrosé (végétation molle, arôme fade)
      - La confondre avec la sarriette vivace, plus dure et plus camphrée
  en:
    nom_commun: Summer savory
    noms_alternatifs: [Annual savory]
    description: >
      Mediterranean annual with a peppery, thyme-like flavour. Traditionally
      sown among broad beans and beans, where it is reputed to keep blackfly
      away. Best sown in place — it dislikes being transplanted.


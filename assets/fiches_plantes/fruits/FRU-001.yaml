i18n:
  fr:
    nom_commun: Pommier
    noms_alternatifs: [Pommier domestique, Pommier commun]
    description: >
      Arbre fruitier vivace de la famille des Rosacées, l'un des plus cultivés
      des vergers tempérés. Floraison printanière mellifère, fructification à
      l'automne. La plupart des variétés sont autostériles : prévoir un second
      pommier (ou un pommier d'ornement) fleurissant à la même période pour la
      pollinisation croisée.
    conseils_culture: >
      Planter à racines nues de l'automne au début du printemps, hors gel, en
      sol profond et frais. Choisir le porte-greffe selon la place (nain pour
      petit jardin, franc pour grand verger). Tailler en hiver pour aérer la
      charpente. Éclaircir les fruits en juin pour de plus beaux calibres.
    conseils_recolte: >
      Cueillir quand le pédoncule se détache facilement en soulevant le fruit.
      Les variétés de garde se conservent plusieurs mois en cave fraîche ;
      récolter avant pleine maturité pour la conservation.
    erreurs_frequentes:
      - Planter une seule variété autostérile (peu ou pas de fruits)
      - Enterrer le point de greffe (affranchissement du porte-greffe)
      - Négliger l'éclaircissage (petits fruits, alternance de production)
  en:
    nom_commun: Apple tree
    description: >
      A perennial Rosaceae fruit tree, among the most grown in temperate
      orchards. Spring bee-friendly bloom, autumn fruiting. Most varieties are
      self-sterile — plant a second compatible pollinator nearby.


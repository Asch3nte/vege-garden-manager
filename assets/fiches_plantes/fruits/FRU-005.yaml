i18n:
  fr:
    nom_commun: Pêcher
    noms_alternatifs: [Pêcher commun]
    description: >
      Arbre fruitier vivace de la famille des Rosacées (genre Prunus), de
      taille modérée et à vie assez courte (15–20 ans). Floraison rose très
      précoce, sensible aux gelées. La plupart des variétés sont autofertiles.
      Sa hantise : la cloque du pêcher, maladie fongique déformant le feuillage.
    conseils_culture: >
      Planter en situation chaude et abritée (mur au sud idéal), en sol drainé.
      Traiter préventivement contre la cloque en fin d'hiver (bouillie
      bordelaise, décoction de prêle) avant l'ouverture des bourgeons. Tailler
      chaque année : le pêcher fructifie sur le bois de l'année précédente.
    conseils_recolte: >
      Récolter les pêches à pleine maturité (parfum marqué, légère souplesse au
      toucher près du pédoncule) : elles ne sucrent plus après cueillette et se
      conservent peu. Manipuler avec soin, chair fragile.
    erreurs_frequentes:
      - Négliger la prévention de la cloque (défoliation, arbre affaibli)
      - Ne pas tailler (dégarnissement, fruits repoussés en bout de branche)
      - Situation gélive (floraison précoce détruite)
  en:
    nom_commun: Peach tree
    description: >
      A perennial Rosaceae (genus Prunus), moderate-sized and fairly short-lived.
      Very early pink bloom, frost-sensitive. Mostly self-fertile. Its main
      enemy is peach leaf curl, a fungal disease deforming the foliage.


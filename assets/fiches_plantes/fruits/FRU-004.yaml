i18n:
  fr:
    nom_commun: Prunier
    noms_alternatifs: [Prunier domestique, Prunier européen]
    description: >
      Arbre fruitier vivace de la famille des Rosacées (genre Prunus), rustique
      et généralement de taille moyenne. Floraison blanche mellifère, récolte
      des prunes de la fin de l'été au début de l'automne. Certaines variétés
      sont autofertiles, d'autres exigent un pollinisateur.
    conseils_culture: >
      Planter en sol profond et drainé, au soleil. Tailler peu et de préférence
      en été (comme tous les Prunus) pour limiter gommose et chancre. Éclaircir
      si la charge est excessive pour éviter l'épuisement et l'alternance.
    conseils_recolte: >
      Récolter à pleine maturité (fruit souple, pruine intacte) pour les prunes
      de bouche ; un peu plus fermes pour la cuisson et le transport. La
      maturité s'étale sur 2–3 semaines selon les variétés.
    erreurs_frequentes:
      - Taille d'hiver (écoulement de gomme, portes d'entrée aux maladies)
      - Surcharge non éclaircie (petits fruits, branches cassées)
      - Récolte trop précoce (prunes acides, peu sucrées)
  en:
    nom_commun: Plum tree
    noms_alternatifs: [European plum]
    description: >
      A hardy perennial Rosaceae (genus Prunus), usually medium-sized. White
      bee-friendly bloom, late-summer to autumn harvest. Some varieties are
      self-fertile, others need a pollinator.


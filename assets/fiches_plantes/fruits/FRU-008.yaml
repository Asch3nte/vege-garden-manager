i18n:
  fr:
    nom_commun: Vigne
    noms_alternatifs: [Vigne cultivée, Raisin de table]
    description: >
      Liane fruitière vivace de la famille des Vitacées, cultivée pour ses
      grappes de raisin. Grimpante par vrilles, elle se conduit sur treille,
      pergola ou palissage — utile aussi comme ombrage comestible. La plupart
      des variétés sont autofertiles. Exige chaleur et soleil pour bien mûrir
      ses sucres.
    conseils_culture: >
      Planter en situation très ensoleillée et abritée, en sol drainé même
      pauvre. Palisser sur fils de fer. La taille hivernale est essentielle :
      la vigne fructifie sur les rameaux de l'année issus du bois d'un an ;
      tailler court chaque hiver pour équilibrer vigueur et fructification.
      Éclaircir les grappes et effeuiller autour pour l'ensoleillement.
    conseils_recolte: >
      Récolter les grappes à pleine maturité : le raisin ne sucre plus après
      cueillette. Goûter pour juger (couleur seule trompeuse). Couper la grappe
      entière au sécateur, la manipuler par la rafle pour préserver la pruine.
    erreurs_frequentes:
      - Ne pas tailler (bois envahissant, grappes rares et petites)
      - Situation trop fraîche ou ombragée (raisin acide, mildiou/oïdium)
      - Récolte sur la seule couleur (raisin coloré mais pas encore sucré)
  en:
    nom_commun: Grapevine
    noms_alternatifs: [Table grape]
    description: >
      A perennial Vitaceae liana grown for its grape clusters. Climbing by
      tendrils, trained on wires, pergola or trellis — also an edible shade.
      Mostly self-fertile. Needs heat and sun to ripen its sugars.


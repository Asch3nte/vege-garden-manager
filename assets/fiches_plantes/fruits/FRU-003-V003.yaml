# Fiche fille (variété) — Cerisier 'Reverchon'. Hérite de FRU-003.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: FRU-003-V003
parent_id: FRU-003
version_fiche: 1
schema_version: 1

i18n:
  fr:
    nom_commun: Cerisier 'Reverchon'
    noms_alternatifs: [Bigarreau Reverchon, Bigarreau Hâtif de Reverchon]
    description: >
      Bigarreau français à gros fruit rouge vermillon devenant presque pourpre,
      à chair très ferme, croquante, sucrée et parfumée. Variété de mi-saison à
      tardive, réputée pour la tenue de ses fruits après cueillette.
    conseils_culture: >
      Arbre vigoureux à port érigé, de bonne fertilité. Autostérile : lui
      associer un pollinisateur compatible. La fermeté de la chair limite
      l'éclatement, mais éviter tout de même les situations où l'eau stagne sur
      les fruits.
    conseils_recolte: >
      Récolter fin juin à juillet, un peu après les variétés précoces. Se tient
      bien quelques jours au frais, pédoncule attaché.
  en:
    nom_commun: Cherry 'Reverchon'
    description: >
      French bigarreau with large vermilion-to-purple fruit and very firm, crisp,
      sweet, aromatic flesh. A mid to late season variety noted for how well the
      fruit holds after picking. Self-sterile — needs a compatible pollinator.

periodes:
  hemisphere_nord:
    oceanique:
      recolte: [6, 7]
    continental:
      recolte: [6, 7]

sources:

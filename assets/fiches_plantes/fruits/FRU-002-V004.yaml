# Fiche fille (variété) — Poirier 'Beurré Hardy'. Hérite de FRU-002.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: FRU-002-V004
parent_id: FRU-002
version_fiche: 1
schema_version: 1

i18n:
  fr:
    nom_commun: Poirier 'Beurré Hardy'
    noms_alternatifs: [Beurré Hardy, Hardy]
    description: >
      Variété française du XIXᵉ siècle, à gros fruit vert bronze entièrement
      roussi, chair blanc rosé, fine, fondante et juteuse, au parfum légèrement
      musqué de rose. Poire d'automne réputée pour sa régularité et sa robustesse.
    conseils_culture: >
      Arbre très vigoureux et rustique, l'un des poiriers les plus faciles au
      jardin : peu sensible à la tavelure, il supporte les sols moyens et les
      climats frais. Il sert aussi d'intermédiaire de greffage sur cognassier
      pour les variétés incompatibles. Attention : incompatible avec 'Williams'
      pour la pollinisation.
    conseils_recolte: >
      Cueillir fin septembre, encore ferme, et laisser mûrir une à deux semaines
      en fruitier. Se consomme en septembre–octobre, la garde est courte.
  en:
    nom_commun: Pear 'Beurré Hardy'
    description: >
      19th-century French variety with large, fully russeted bronze-green fruit
      and fine, melting, juicy pinkish-white flesh with a light rose-musk aroma.
      A robust, reliable autumn pear — one of the easiest in the garden, and also
      used as an interstem on quince rootstock.

periodes:
  hemisphere_nord:
    oceanique:
      recolte: [9, 9]
    continental:
      recolte: [9, 10]

conservation:
  - methode: frais
    duree_mois: 1
    conditions_i18n: { fr: "Fruitier frais ; garde courte", en: "Cool fruit store; short keeping" }

sources:

# Fiche fille (variété) — Cerisier 'Cœur de Pigeon'. Hérite de FRU-003.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: FRU-003-V007
parent_id: FRU-003
version_fiche: 1
schema_version: 1

i18n:
  fr:
    nom_commun: Cerisier 'Cœur de Pigeon'
    noms_alternatifs: [Bigarreau Cœur de Pigeon]
    description: >
      Ancienne variété française, nommée d'après la forme nettement cordiforme et
      pointue de son fruit. Cerise rouge clair à jaune rosé, de calibre moyen, à
      chair ferme, fine, sucrée et peu acide. Variété de collection, appréciée
      dans les vergers conservatoires.
    conseils_culture: >
      Arbre de vigueur moyenne, rustique, à conduire en plein vent ou en
      demi-tige. Fertilité correcte mais calibre modeste : ne pas chercher le
      rendement. Autostérile : prévoir un pollinisateur.
    conseils_recolte: >
      Récolter en juin, dès la coloration. Fruit fragile qui se consomme dans la
      journée ou se transforme rapidement.
  en:
    nom_commun: Cherry 'Cœur de Pigeon'
    description: >
      Heirloom French variety named for its distinctly heart-shaped, pointed
      fruit. Medium-sized, light red to pinkish-yellow, with firm, fine, sweet
      and low-acid flesh. A collector's variety kept in conservation orchards.

periodes:
  hemisphere_nord:
    oceanique:
      recolte: [6, 6]
    continental:
      recolte: [6, 7]

sources:

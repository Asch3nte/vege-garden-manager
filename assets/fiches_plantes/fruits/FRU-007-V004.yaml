# Fiche fille (variété) — Noisetier 'Butler'. Hérite de FRU-007.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: FRU-007-V004
parent_id: FRU-007
version_fiche: 1
schema_version: 1

i18n:
  fr:
    nom_commun: Noisetier 'Butler'
    description: >
      Variété américaine sélectionnée en Oregon, à grosse noisette allongée à
      coque assez fine et amande de bonne qualité. Très productive et de mise à
      fruit rapide, elle est surtout connue comme la pollinisatrice attitrée
      d'Ennis, avec laquelle elle est presque toujours plantée.
    conseils_culture: >
      Arbuste vigoureux, à port dressé, facile à conduire en cépée. Sa floraison
      mâle abondante en fait un bon pollinisateur général. Éviter les sols
      gorgés d'eau. Protéger la récolte du balanin en ramassant sans délai.
    conseils_recolte: >
      Récolter en septembre, au sol, dès la chute. Sécher deux à trois semaines
      à l'air libre avant stockage.
  en:
    nom_commun: Hazel 'Butler'
    description: >
      American variety selected in Oregon, with large elongated nuts, a fairly
      thin shell and good kernel quality. Productive and quick to bear, it is
      best known as the standard pollinator for 'Ennis', with which it is almost
      always planted.

periodes:

i18n:
  fr:
    nom_commun: Cerisier
    noms_alternatifs: [Cerisier doux, Merisier (forme sauvage)]
    description: >
      Arbre fruitier vivace de la famille des Rosacées (genre Prunus),
      vigoureux et souvent grand. Floraison blanche précoce très mellifère,
      récolte des cerises en début d'été. Beaucoup de variétés de cerisier
      doux sont autostériles et exigent un pollinisateur compatible.
    conseils_culture: >
      Planter en sol profond, drainé et non détrempé (craint l'excès d'eau).
      Tailler le moins possible et uniquement en été (« taille en vert ») pour
      éviter les écoulements de gomme et la propagation des maladies. Protéger
      la récolte des oiseaux (filet).
    conseils_recolte: >
      Cueillir les cerises bien colorées et fermes, avec leur pédoncule pour
      une meilleure conservation. La récolte est concentrée sur 2–3 semaines.
      Éviter de récolter par temps de pluie (fruits éclatés).
    erreurs_frequentes:
      - Tailler en hiver (gommose, chancre)
      - Sol lourd et humide (asphyxie racinaire, court la vie de l'arbre)
      - Oublier le pollinisateur (floraison abondante mais peu de fruits)
  en:
    nom_commun: Cherry tree
    noms_alternatifs: [Sweet cherry]
    description: >
      A vigorous perennial Rosaceae (genus Prunus), often large. Early white
      bee-friendly bloom, early-summer harvest. Many sweet cherries are
      self-sterile and need a compatible pollinator.


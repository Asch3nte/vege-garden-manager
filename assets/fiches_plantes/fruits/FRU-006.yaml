# Fiche mère (espèce) — Figuier.
# Rédigée à la main (lot « fruits »).
# Taxonomie vérifiée GBIF × Wikidata ; agronomie de références horticoles.
id: FRU-006
version_fiche: 1
categorie: fruit
schema_version: 1
difficulte: 1
usages:
  - alimentaire
  - ornementale

rusticite:
  zone_min: zone7
nom_scientifique: Ficus carica
famille_botanique: Moraceae

i18n:
  fr:
    nom_commun: Figuier
    noms_alternatifs: [Figuier commun]
    description: >
      Arbre fruitier vivace de la famille des Moracées, au feuillage ample et
      découpé, très ornemental. Rustique et peu exigeant une fois installé, il
      supporte la sécheresse et se plaît en situation chaude. Les variétés
      cultivées en Europe (type « commun ») fructifient sans pollinisation.
      Selon la variété : une récolte (figues d'automne) ou deux (figues-fleurs
      au début de l'été, puis figues d'automne).
    conseils_culture: >
      Planter au printemps, en situation chaude et abritée (contre un mur au
      sud en climat frais). Limiter les arrosages et l'azote, qui favorisent le
      feuillage au détriment des fruits. En zone froide, cultiver en grand pot
      à rentrer, ou protéger la souche l'hiver : il peut geler en surface et
      repartir de la base.
    conseils_recolte: >
      Récolter les figues à pleine maturité, quand elles s'infléchissent au
      collet, deviennent souples et qu'une goutte de nectar perle à l'œil. Elles
      ne mûrissent plus après cueillette et se conservent très peu.
    erreurs_frequentes:
      - Excès d'eau et d'azote (beaucoup de feuilles, peu de figues)
      - Récolte trop précoce (figue ferme, insipide)
      - En climat froid, exposition non abritée (gel des rameaux)
  en:
    nom_commun: Fig tree
    description: >
      A perennial Moraceae with large, lobed, highly ornamental leaves. Hardy
      and undemanding once established, drought-tolerant and heat-loving.
      European "common" types fruit without pollination.


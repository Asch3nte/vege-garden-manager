i18n:
  fr:
    nom_commun: Noisetier
    noms_alternatifs: [Coudrier, Avelinier]
    description: >
      Arbuste fruitier vivace de la famille des Bétulacées, souvent conduit en
      cépée (touffe multi-troncs). Floraison hivernale : chatons mâles jaunes
      dès janvier–février, pollinisés par le vent. Autostérile en pratique :
      planter au moins deux variétés différentes pour une bonne fécondation.
      Fait aussi une excellente haie brise-vent nourricière.
    conseils_culture: >
      Planter à racines nues en hiver, en sol frais et drainé. Tailler pour
      aérer la cépée et supprimer les rejets en excès. Peu exigeant, rustique
      et vigoureux. Protéger la récolte des écureuils et du balanin (charançon)
      dont la larve creuse la noisette.
    conseils_recolte: >
      Récolter à l'automne quand les noisettes brunissent et tombent de leur
      involucre. Les ramasser rapidement au sol, faire sécher à l'air quelques
      semaines avant stockage au sec.
    erreurs_frequentes:
      - Planter une seule variété (pollinisation insuffisante, peu de fruits)
      - Laisser les noisettes au sol (balanin, moisissures)
      - Négliger le rajeunissement de la cépée (vieux bois peu productif)
  en:
    nom_commun: Hazel
    noms_alternatifs: [Cobnut, Filbert]
    description: >
      A perennial Betulaceae shrub, often grown as a multi-stemmed stool.
      Winter bloom: yellow male catkins wind-pollinated from January. Plant at
      least two different varieties for good fruit set. Also an excellent
      productive windbreak hedge.


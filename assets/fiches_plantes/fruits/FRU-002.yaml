i18n:
  fr:
    nom_commun: Poirier
    noms_alternatifs: [Poirier commun, Poirier domestique]
    description: >
      Arbre fruitier vivace de la famille des Rosacées, proche du pommier mais
      plus longévif et plus exigeant en chaleur. Floraison précoce (sensible
      aux gelées tardives), fructification de la fin d'été à l'automne. La
      plupart des variétés demandent un pollinisateur compatible.
    conseils_culture: >
      Planter en situation ensoleillée et abritée des gelées de printemps, en
      sol profond et frais. Se prête bien aux formes palissées (espalier,
      cordon) contre un mur chaud. Tailler en hiver ; l'arcure des branches
      favorise la mise à fruit.
    conseils_recolte: >
      Récolter les poires d'été à pleine maturité. Les poires d'automne et
      d'hiver se cueillent fermes, avant maturité, puis mûrissent en fruitier :
      c'est la clé d'une chair fondante et non granuleuse.
    erreurs_frequentes:
      - Laisser mûrir les poires d'hiver sur l'arbre (chair blette au cœur)
      - Situation gélive (fleurs précoces détruites)
      - Variété unique autostérile sans pollinisateur
  en:
    nom_commun: Pear tree
    description: >
      A perennial Rosaceae fruit tree, close to the apple but longer-lived and
      more heat-demanding. Early bloom (frost-sensitive), late-summer to autumn
      fruiting. Most varieties need a compatible pollinator.


nom_scientifique: "Ficus carica 'Violette de Bordeaux'"

i18n:
  fr:
    nom_commun: Figuier 'Violette de Bordeaux'
    noms_alternatifs: [Négronne]
    description: >
      Variété à figue allongée violet foncé à noir, chair rouge très sucrée et
      parfumée. Port compact adapté aux petits jardins et à la culture en pot.
      Assez rustique pour une figue de qualité. Culture identique au figuier
      type ; unifère à bifère selon le climat.
    conseils_culture: >
      Même conduite que le figuier commun. Son port compact la rend idéale en
      grand pot à hiverner sous climat froid.
  en:
    nom_commun: Fig 'Violette de Bordeaux'
    noms_alternatifs: [Negronne]
    description: >
      An elongated dark-purple to black fig with very sweet, aromatic red flesh.
      Compact habit suited to small gardens and container growing. Same culture
      as the type.


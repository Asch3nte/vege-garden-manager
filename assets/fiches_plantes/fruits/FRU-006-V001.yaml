# Fiche fille (variété) — Figuier 'Violette de Bordeaux'. Hérite de FRU-006.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: FRU-006-V001
parent_id: FRU-006
version_fiche: 1

    nom_commun: Seigle fourrager 'Dukato'
    noms_alternatifs: [Seigle multicaule 'Dukato']
    description: >
      Type fourrager très tallant, à forte production de biomasse foliaire,
      couramment employé comme couvert d'hiver. Culture et cycle identiques au
      seigle type ; couvre le sol densément dès l'automne.

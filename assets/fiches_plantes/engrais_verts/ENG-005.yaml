i18n:
  fr:
    nom_commun: Vesce commune
    noms_alternatifs: [Vesce cultivée, Vesce de printemps]
    description: >
      Légumineuse annuelle grimpante de la famille des Fabacées, fixatrice
      d'azote et productrice d'une biomasse abondante. Ses vrilles s'accrochent
      à un support : on l'associe classiquement à une graminée (seigle, avoine)
      qui lui sert de tuteur et équilibre le mélange.
    conseils_culture: >
      Semer à l'automne (couvert hivernal) ou au printemps, souvent en mélange
      avec une céréale. Faucher et enfouir à la floraison, avant que les tiges
      ne durcissent, juste avant une culture exigeante en azote.
    conseils_recolte: >
      « Récolte » = fauchage à la floraison. Le mélange vesce + céréale
      s'enfouit ensemble, la céréale apportant le carbone et la vesce l'azote.
    erreurs_frequentes:
      - La semer seule sans tuteur (elle se couche et pourrit au sol)
      - Enfouir des tiges trop lignifiées (faucher jeune)
  en:
    nom_commun: Common vetch
    noms_alternatifs: [Spring vetch]
    description: >
      An annual climbing Fabaceae, nitrogen-fixing and high-biomass. Its
      tendrils cling to a support, so it is classically mixed with a grass (rye,
      oats) that acts as a living stake.


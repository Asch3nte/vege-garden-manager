nom_scientifique: Trifolium incarnatum
famille_botanique: Fabaceae

i18n:
  fr:
    nom_commun: Trèfle incarnat
    noms_alternatifs: [Trèfle du Roussillon, Farouch]
    description: >
      Légumineuse annuelle de la famille des Fabacées, cultivée comme engrais
      vert fixateur d'azote. Ses nodosités racinaires captent l'azote de l'air
      et l'enrichissent au sol. Épis rouge vif très mellifères. Bon couvre-sol
      d'automne, il passe l'hiver et redémarre au printemps.
    conseils_culture: >
      Semer de la fin d'été au début d'automne, ou au printemps, sur sol
      ratissé. Supporte les sols pauvres. Faucher et enfouir à la floraison,
      quand l'azote fixé est maximal, avant une culture gourmande (chou,
      courge). Peu résistant aux très fortes gelées prolongées.
    conseils_recolte: >
      « Récolte » = fauchage à la floraison (azote fixé maximal). Enfouir
      superficiellement 3–4 semaines avant la culture suivante.
    erreurs_frequentes:
      - Enfouir trop tard (azote reparti dans la montée à graines)
      - Semer sur sol battant ou détrempé (levée irrégulière)
  en:
    nom_commun: Crimson clover
    noms_alternatifs: [Italian clover]
    description: >
      An annual Fabaceae grown as a nitrogen-fixing green manure. Root nodules
      capture atmospheric nitrogen and enrich the soil. Bright-red bee-friendly
      flower heads. A good autumn ground cover that overwinters.


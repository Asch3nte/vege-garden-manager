i18n:
  fr:
    nom_commun: Avoine
    noms_alternatifs: [Avoine cultivée, Avoine de printemps]
    description: >
      Céréale de la famille des Poacées, engrais vert à croissance rapide et
      biomasse abondante. Son enracinement dense améliore la structure de
      surface et mobilise l'azote résiduel. Moins rustique que le seigle :
      souvent semée au printemps, ou à l'automne comme couvert « gélif » qui se
      détruit seul en hiver froid.
    conseils_culture: >
      Semer au printemps, ou en fin d'été pour un couvert d'automne. Faucher ou
      laisser geler avant l'épiaison. S'associe bien à une légumineuse (vesce,
      trèfle) pour équilibrer l'apport carbone/azote. Se décompose vite après
      enfouissement.
    conseils_recolte: >
      « Récolte » = fauchage avant épiaison, ou destruction naturelle par le
      gel (mulch en place). Enfouir tendre pour une minéralisation rapide.
    erreurs_frequentes:
      - La croire aussi rustique que le seigle (gèle plus tôt)
      - Faucher trop tard (tiges creuses lignifiées)
  en:
    nom_commun: Oat
    noms_alternatifs: [Common oat, Spring oat]
    description: >
      A fast-growing Poaceae green manure with abundant biomass. Its dense roots
      improve topsoil structure and mobilise residual nitrogen. Less hardy than
      rye — often spring-sown, or autumn-sown as a winter-killed cover.


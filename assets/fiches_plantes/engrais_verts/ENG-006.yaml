i18n:
  fr:
    nom_commun: Sarrasin
    noms_alternatifs: [Blé noir, Renouée à trois angles]
    description: >
      Engrais vert d'été de la famille des Polygonacées, sans parenté avec les
      légumes courants. Croissance foudroyante qui étouffe les adventices ;
      capable de mobiliser le phosphore peu disponible du sol. Floraison
      blanche mellifère. Très gélif : culture strictement estivale.
    conseils_culture: >
      Semer après les dernières gelées et jusqu'en été, sur sol nu. Lève et
      couvre en quelques semaines. Faucher dès la pleine floraison (avant les
      premières graines) car il se ressème très facilement. Idéal pour occuper
      une planche libre entre deux cultures.
    conseils_recolte: >
      « Récolte » = fauchage à la floraison, impérativement avant grainaison.
      Enfouir tendre ou laisser en paillage ; se décompose vite.
    erreurs_frequentes:
      - Semer trop tôt au printemps (détruit par le moindre gel)
      - Le laisser grainer (ressemis abondant l'année suivante)
  en:
    nom_commun: Buckwheat
    description: >
      A summer green manure of the Polygonaceae family, unrelated to common
      vegetables. Extremely fast-growing, smothers weeds and mobilises poorly
      available soil phosphorus. Bee-friendly white flowers. Very frost-tender.


    nom_commun: Vesce commune 'Topaze'
    description: >
      Sélection de printemps couramment employée en couvert, à bon
      développement végétatif. Culture et cycle identiques à la vesce commune
      type ; à associer de préférence à une céréale.
    conseils_culture: >
      Même conduite que la vesce commune. Semée au printemps en mélange avec
      l'avoine ou le seigle pour un couvert dressé et facile à faucher.
  en:
    nom_commun: Common vetch 'Topaze'
    description: >
      A spring selection commonly used as a cover crop with good vegetative
      growth. Same culture as the type; best grown with a cereal.


rusticite:
  zone_min: zone7
nom_scientifique: Phacelia tanacetifolia
famille_botanique: Boraginaceae

i18n:
  fr:
    nom_commun: Phacélie
    noms_alternatifs: [Phacélie à feuilles de tanaisie]
    description: >
      Engrais vert de la famille des Boraginacées, sans parenté avec les
      légumes cultivés : elle s'insère donc dans toutes les rotations sans
      contrainte. Croissance rapide, biomasse abondante, floraison bleu-mauve
      extrêmement mellifère qui attire abeilles et auxiliaires.
    conseils_culture: >
      Semer à la volée du printemps à la fin de l'été, sur sol nu ; recouvrir
      légèrement (germe à l'obscurité). Étouffe efficacement les adventices.
      Faucher à la floraison pour un enfouissement tendre. Gélive : détruite
      par les fortes gelées, elle fait aussi un bon mulch hivernal.
    conseils_recolte: >
      « Récolte » = fauchage à la floraison (compromis biomasse / azote). Pour
      favoriser les pollinisateurs, laisser fleurir quelques semaines avant de
      couper, sans laisser grainer.
    erreurs_frequentes:
      - Semer trop clair (adventices non étouffées)
      - Semer en surface sans recouvrir (germination à l'obscurité)
      - Attendre la montée à graines (ressemis)
  en:
    nom_commun: Phacelia
    noms_alternatifs: [Lacy phacelia]
    description: >
      A Boraginaceae green manure unrelated to any common vegetable, so it fits
      any rotation. Fast-growing with abundant biomass and highly bee-friendly
      blue-mauve flowers.


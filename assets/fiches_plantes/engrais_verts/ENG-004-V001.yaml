i18n:
  fr:
    nom_commun: Luzerne 'Europe'
    description: >
      Variété très répandue, rustique et productive, à bonne pérennité. Culture
      et cycle identiques à la luzerne type ; adaptée à une installation de
      longue durée sur parcelle au repos.
    conseils_culture: >
      Même conduite que la luzerne cultivée. Semer sur sol bien préparé et non
      acide pour réussir l'implantation de cette variété pérenne.
  en:
    nom_commun: Alfalfa 'Europe'
    description: >
      A widely grown, hardy and productive variety with good persistence. Same
      culture as the type.


# Fiche mère (espèce) — Luzerne.
# Rédigée à la main (lot « engrais verts »).
# Taxonomie vérifiée GBIF × Wikidata ; agronomie de références permacoles.
id: ENG-004
version_fiche: 1
categorie: engrais_vert
schema_version: 1
difficulte: 2
usages:
  - engrais_vert
  - fourrage
  - mellifere

rusticite:
  zone_min: zone4
nom_scientifique: Medicago sativa
famille_botanique: Fabaceae

i18n:
  fr:
    nom_commun: Luzerne
    noms_alternatifs: [Luzerne cultivée, Foin de Bourgogne]
    description: >
      Légumineuse vivace de la famille des Fabacées, fixatrice d'azote, à racine
      pivotante très profonde (plusieurs mètres) qui décompacte le sol et
      remonte les minéraux des couches basses. Engrais vert de longue durée
      (plusieurs années) pour parcelles au repos.
    conseils_culture: >
      Semer au printemps en sol drainé et non acide (elle déteste l'excès
      d'eau). Installation lente la première année ; ensuite très pérenne et
      productive. Faucher plusieurs fois par saison en laissant les résidus au
      sol. Idéale pour restructurer une parcelle fatiguée sur 2–3 ans.
    conseils_recolte: >
      « Récolte » = fauches répétées à la floraison. Broyer et laisser en
      surface, ou exporter en fourrage. Retourner la luzernière en fin de cycle
      libère un stock d'azote important.
    erreurs_frequentes:
      - Sol acide ou mal drainé (échec de l'implantation)
      - Impatience la première année (croissance lente au départ)
      - La ressemer aussitôt sur elle-même (autotoxicité)
  en:
    nom_commun: Alfalfa
    noms_alternatifs: [Lucerne]
    description: >
      A perennial nitrogen-fixing Fabaceae with a very deep taproot that
      decompacts soil and lifts minerals from lower layers. A long-term green
      manure for resting beds.


# Fiche mère (espèce) — Moutarde blanche.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Engrais vert brassicacée à croissance rapide. Créée au lot « fleurs compagnes »
# pour résoudre les références orphelines (ex-id legacy `moutarde`).
# ⚠ Brassicacée : partage maladies/ravageurs avec les choux (rotation).
id: ENG-001
version_fiche: 1
categorie: engrais_vert
schema_version: 1
difficulte: 1
usages:
  - engrais_vert
  - couvre_sol
  - mellifere

rusticite:
  zone_min: zone7
nom_scientifique: Sinapis alba
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Moutarde blanche
    noms_alternatifs: [Sénevé blanc, Moutarde jaune]
    description: >
      Engrais vert annuel de la famille des Brassicacées, à croissance très
      rapide. Semée entre deux cultures, elle couvre le sol, capte les nitrates
      et structure la terre. Sa floraison jaune est mellifère. À ne pas placer
      dans une rotation de choux (même famille).
    conseils_culture: >
      Semer à la volée sur sol nu, du printemps à l'automne. Faucher ou coucher
      avant la montée à graines pour éviter les ressemis, puis laisser se
      décomposer en surface ou incorporer superficiellement.
    conseils_recolte: >
      Pas de récolte : couper au stade floraison et laisser la biomasse au sol
      comme couvert ou l'incorporer avant la culture suivante.
    erreurs_frequentes:
      - Semis dans une parcelle destinée aux choux (même famille, mêmes maladies)
      - Fauchage trop tardif (montée à graines et ressemis envahissant)
  en:
    nom_commun: White mustard
    description: >
      Fast-growing annual green manure of the Brassicaceae family. Sown between
      crops, it covers the soil, captures nitrates and improves structure. Do
      not use in a brassica rotation (same family).


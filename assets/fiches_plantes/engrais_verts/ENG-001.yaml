i18n:
  fr:
    nom_commun: Moutarde blanche
    noms_alternatifs: [Moutarde jaune, Sénevé blanc]
    description: >
      Engrais vert de la famille des Brassicacées, à croissance très rapide.
      Étouffe les adventices, structure le sol par sa racine pivotante et libère
      des composés soufrés (biofumigation) réduisant certains champignons et
      nématodes. Attention : c'est un chou, à compter dans la rotation des
      Brassicacées.
    conseils_culture: >
      Semer à la volée du printemps à début d'automne, sur sol nu ratissé.
      Lève en quelques jours. Faucher et enfouir avant la floraison pour un
      apport de matière tendre, ou la laisser geler comme mulch hivernal. Ne
      pas l'utiliser avant ou après un chou (mêmes maladies).
    conseils_recolte: >
      « Récolte » = fauchage : couper au ras avant montée à graines (pour
      éviter le ressemis) puis incorporer superficiellement ou laisser en
      paillage.
    erreurs_frequentes:
      - L'employer dans une parcelle à choux (partage hernie et altises)
      - La laisser grainer (ressemis envahissant)
      - Enfouir une biomasse trop ligneuse (faucher jeune)
  en:
    nom_commun: White mustard
    noms_alternatifs: [Yellow mustard]
    description: >
      A fast-growing Brassicaceae green manure. Smothers weeds, structures soil
      with its taproot and releases sulphur compounds (biofumigation). Being a
      brassica, it counts in the Brassicaceae rotation.


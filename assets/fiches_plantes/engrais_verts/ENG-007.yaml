i18n:
  fr:
    nom_commun: Seigle
    noms_alternatifs: [Seigle forestier, Seigle fourrager]
    description: >
      Céréale de la famille des Poacées, employée comme engrais vert d'hiver
      très rustique. Son puissant système racinaire fasciculé structure le sol
      en profondeur et capte l'azote résiduel, évitant son lessivage. Ses
      exsudats racinaires freinent la germination des adventices (allélopathie).
    conseils_culture: >
      Semer à l'automne, sur sol nu ratissé. Passe l'hiver même rigoureux et
      redémarre vigoureusement au printemps. Se marie très bien avec une vesce
      qu'il tuteure. Broyer et enfouir au printemps ; laisser 3–4 semaines
      avant de semer (l'allélopathie gêne les semis fins juste après).
    conseils_recolte: >
      « Récolte » = broyage/roulage au stade épiaison, avant durcissement des
      tiges. Enfouir superficiellement ou laisser en paillage roulé (couvert
      permanent).
    erreurs_frequentes:
      - Semer une culture à petites graines juste après l'enfouissement (allélopathie)
      - Broyer trop tard (tiges lignifiées, décomposition lente)
  en:
    nom_commun: Rye
    noms_alternatifs: [Cereal rye, Winter rye]
    description: >
      A very hardy Poaceae used as a winter green manure. Its powerful fibrous
      roots structure the soil deeply and capture residual nitrogen, preventing
      leaching. Root exudates suppress weed germination (allelopathy).


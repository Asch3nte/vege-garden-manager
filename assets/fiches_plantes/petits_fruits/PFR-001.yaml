rusticite:
  zone_min: zone4

nom_scientifique: Fragaria × ananassa
famille_botanique: Rosaceae

i18n:
  fr:
    nom_commun: Fraisier
    noms_alternatifs: [Fraisier cultivé, Fraisier hybride, Fraise des jardins]
    description: >
      Plante vivace rampante de la famille des Rosacées, cultivée pour ses
      fruits rouges juteux (fraises). Hybride créé au XVIIIe siècle entre
      Fragaria chiloensis (Amérique du Sud) et Fragaria virginiana (Amérique
      du Nord). Extrêmement diversifiée : variétés non-remontantes (une récolte
      en juin-juillet), remontantes (deux récoltes : juin et septembre-octobre)
      et « perpetuelles » (récolte continue). Se multiplie naturellement par
      stolons (tiges rampantes).
    conseils_culture: >
      Planter en sol riche, légèrement acide, bien drainé, en plein soleil.
      Espacer de 30–40 cm. Pailler le sol au printemps pour garder les fruits
      propres et l'humidité. Retirer les stolons si l'on souhaite maximiser la
      production des plants existants. Renouveler les plants tous les 3–4 ans
      (déclin de la productivité passé ce stade).
    conseils_recolte: >
      Récolter à pleine maturité : la fraise doit être uniformément rouge et
      dégager son parfum caractéristique. Cueillir le matin, par temps sec.
      La fraise ne continue pas à mûrir après la cueillette.
    erreurs_frequentes:
      - Sol trop calcaire (chlorose, plants chétifs)
      - Ne pas renouveler les plants après 3–4 ans (chute de productivité)
      - Récolter trop tôt (fruit blanc au cœur, sans saveur)
  en:
    nom_commun: Strawberry
    noms_alternatifs: [Garden strawberry, Cultivated strawberry]
    description: >
      Perennial rosaceous plant cultivated for its red juicy fruits. 18th-century
      hybrid between two American Fragaria species. Spreads by runners (stolons).
      Varieties include June-bearing, everbearing, and day-neutral types.


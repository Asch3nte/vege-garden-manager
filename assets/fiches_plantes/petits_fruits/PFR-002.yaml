i18n:
  fr:
    nom_commun: Framboisier
    noms_alternatifs: [Framboisier commun, Ronce du Mont Ida]
    description: >
      Arbrisseau vivace de la famille des Rosacées aux tiges biennales
      (cannes). Les cannes de la première année (primocanes) produisent des
      feuilles, celles de la deuxième année (floricanes) portent les fleurs
      et les fruits. Fruits rouges (ou jaunes selon la variété) de 2–4 g,
      très aromatiques et fragiles. Deux types : variétés non-remontantes
      (une récolte en juillet) et remontantes (juillet + automne).
    conseils_culture: >
      Planter en rang, espacer les cannes de 50–60 cm, les rangs de 1,5 m.
      Tuteurer sur fil de fer tendus entre piquets. Arroser régulièrement en
      été, pailler. Après la récolte : couper au ras du sol les cannes ayant
      fructifié (floricanes). Laisser les nouvelles cannes vertes (primocanes)
      qui produiront l'année suivante.
    conseils_recolte: >
      Récolter à pleine maturité (fruit rouge profond, légèrement souple) —
      la framboise ne continue pas à mûrir après cueillette. Récolter tous
      les 2–3 jours par temps chaud. Les fruits sont très fragiles : manipuler
      délicatement, ne jamais superposer plus de 2–3 couches.
    erreurs_frequentes:
      - Ne pas tailler les vieilles cannes (enchevêtrement, perte de production)
      - Oublier d'arroser en été (manque d'eau entraîne des fruits petits et secs)
      - Plantation en sol calcaire (chlorose ferrique — préférer sol légèrement acide)
  en:
    nom_commun: Raspberry
    noms_alternatifs: [Red raspberry, Common raspberry]
    description: >
      Hardy perennial shrub with biennial canes. Primocanes grow in year 1;
      floricanes fruit in year 2. Very aromatic red (or yellow) fruits.
      Summer-fruiting and autumn-fruiting (everbearing) varieties available.


i18n:
  fr:
    nom_commun: Groseillier rouge
    noms_alternatifs: [Groseillier à grappes, Groseillier commun]
    description: >
      Arbuste fruitier vivace de la famille des Grossulariacées, produisant
      des grappes de petites baies rouge vif acidulées à la fin du printemps.
      Extrêmement rustique (–25 °C), peu exigeant, il tolère la mi-ombre
      mieux que la plupart des fruitiers. Durée de vie d'un buisson : 15 à
      25 ans avec une taille annuelle. Existe aussi en variété blanche
      (Ribes rubrum var. albidum) et rose.
    conseils_culture: >
      Planter à l'automne de préférence, en sol humifère, frais, bien drainé.
      Exposer en plein soleil ou mi-ombre légère. Tailler chaque année en
      hiver : supprimer les branches de plus de 4 ans et les rameaux croisés.
      Le groseillier est très résistant aux maladies et aux ravageurs.
      Aucun traitement généralement nécessaire.
    conseils_recolte: >
      Récolter les grappes entières dès que les fruits sont uniformément
      rouges et brillants (juillet). Utiliser un peigne ou une fourchette
      pour égrener rapidement les grappes. Consommer ou transformer dans
      les 5–7 jours.
    erreurs_frequentes:
      - Négliger la taille annuelle (vieillissement du buisson, production décroissante)
      - Plantation en sol trop sec (buisson chétif, fruits petits et peu nombreux)
      - Confusion avec le cassis (feuilles et fruits différents, arôme très distinct)
  en:
    nom_commun: Red currant
    noms_alternatifs: [Redcurrant]
    description: >
      Hardy deciduous fruiting shrub producing clusters of tart red berries
      in early summer. Extremely cold-hardy (–25 °C), low-maintenance and
      tolerant of partial shade. Productive for 15–25 years with annual pruning.


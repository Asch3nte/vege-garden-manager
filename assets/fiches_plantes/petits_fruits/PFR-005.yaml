# Fiche mère (espèce) — Myrtille arbustive.
# Taxonomie : tool/scrap_fiche.dart (GBIF × Wikidata). Agronomie : références horticoles.
# Note : Vaccinium corymbosum = myrtille arbustive cultivée (dite 'highbush blueberry').
# Distincte de la myrtille sauvage européenne (V. myrtillus), plus difficile à cultiver.
id: PFR-005
version_fiche: 1
categorie: petit_fruit
schema_version: 1
difficulte: 3
usages:
  - alimentaire
  - medicinale

rusticite:
  zone_min: zone5

nom_scientifique: Vaccinium corymbosum
famille_botanique: Ericaceae

i18n:
  fr:
    nom_commun: Myrtille
    noms_alternatifs: [Myrtille arbustive, Myrtille américaine, Grande myrtille, Bleuet en corymbes]
    description: >
      Arbuste fruitier vivace nord-américain de la famille des Éricacées,
      cultivé pour ses grosses baies bleues riches en antioxydants (anthocyanes),
      aux propriétés reconnues pour la santé oculaire et cardiovasculaire.
      Exige impérativement un sol très acide (pH 4,5–5,5) — condition sine
      qua non de sa culture. Planter au minimum 2 variétés différentes pour
      assurer la pollinisation croisée et maximiser la production. Port buissonnant
      décoratif, coloré en automne.
    conseils_culture: >
      Acidifier le sol avec de la tourbe, de l'écorce de pin ou du soufre.
      Vérifier le pH avant la plantation (pH > 5,5 = échec garanti). Pailler
      avec des écorces de pin. Arroser avec de l'eau de pluie de préférence
      (l'eau calcaire remonte le pH). Planter 2 variétés pour la pollinisation
      croisée. La myrtille met 3 ans à produire pleinement.
    conseils_recolte: >
      Récolter à pleine maturité : la baie doit être bleu-violet uniforme,
      légèrement pruineuse, et se détacher facilement. Ne pas récolter les
      baies encore rouges ou roses. Une récolte tous les 5–7 jours en pleine
      saison (juillet-août).
    erreurs_frequentes:
      - Sol non acidifié ou pH > 5,5 (chlorose sévère, mort de la plante à moyen terme)
      - Une seule variété plantée (production très faible sans pollinisation croisée)
      - Arrosage avec eau calcaire du robinet (neutralise progressivement l'acidité)
  en:
    nom_commun: Blueberry
    noms_alternatifs: [Highbush blueberry, Northern highbush blueberry]
    description: >
      North American perennial shrub from the Ericaceae family, grown for its
      large antioxidant-rich berries. Requires very acidic soil (pH 4.5–5.5)
      — non-negotiable. Plant at least 2 varieties for cross-pollination.
      Takes 3 years to reach full production.


i18n:
  fr:
    nom_commun: Cassis
    noms_alternatifs: [Groseillier noir, Poirier noir, Blackcurrant]
    description: >
      Arbuste fruitier vivace de la famille des Grossulariacées, aux baies
      noires très aromatiques et particulièrement riches en vitamine C
      (5 fois plus que l'orange) et en anthocyanes aux propriétés
      antioxydantes reconnues. Feuilles persistantes dégageant une odeur
      caractéristique de cassis. Rustique (–25 °C), productif et peu
      exigeant. Donne de superbes préparations alcoolisées (crème de cassis,
      kir) et des confitures très parfumées.
    conseils_culture: >
      Planter à l'automne en sol riche, frais, légèrement acide. Tolérant
      à la mi-ombre mais plus productif en plein soleil. Tailler chaque
      hiver : supprimer les branches de plus de 4 ans. Le cassis est plus
      vigoureux que le groseillier et exige plus d'azote. Pailler pour
      garder l'humidité — sensible à la sécheresse prolongée.
    conseils_recolte: >
      Récolter les grappes entières en juillet-août quand tous les fruits
      sont noirs et légèrement mous. Contrairement au groseillier, le cassis
      peut rester sur l'arbuste quelques jours supplémentaires après
      maturité sans se dégrader.
    erreurs_frequentes:
      - Sol trop calcaire ou trop sec (chlorose, fruits petits)
      - Négliger la taille annuelle (vieillissement rapide, production divisée par 2)
      - Confondre avec le groseillier (saveur, couleur et arôme très différents)
  en:
    nom_commun: Blackcurrant
    noms_alternatifs: [Black currant, Cassis]
    description: >
      Deciduous fruiting shrub producing fragrant black berries exceptionally
      rich in vitamin C and antioxidant anthocyanins. Hardy to –25 °C.
      Basis of crème de cassis, kir, jams and health preparations.


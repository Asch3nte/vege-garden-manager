i18n:
  fr:
    nom_commun: Chou-rave
    noms_alternatifs: [Chou-pomme, Colrave]
    description: >
      Brassicacée bisannuelle cultivée comme annuelle pour sa tige renflée en
      boule au-dessus du sol, à chair tendre au goût doux de chou. Culture rapide
      et facile, à récolter jeune.
    conseils_culture: >
      Semer ou repiquer en sol frais et riche, arroser régulièrement pour une
      croissance sans à-coups. Récolter avant que la boule ne devienne fibreuse.
    conseils_recolte: >
      Couper la boule quand elle atteint la taille d'une pomme (7–10 cm) ; ne pas
      attendre trop longtemps sous peine de chair dure et filandreuse.
    erreurs_frequentes:
      - Récolte trop tardive (chair fibreuse et piquante)
      - Croissance ralentie par la sécheresse (boules ligneuses)
  en:
    nom_commun: Kohlrabi
    description: >
      Biennial brassica grown as an annual for its swollen above-ground stem with
      tender, mild cabbage-flavoured flesh. A quick, easy crop, harvested young.


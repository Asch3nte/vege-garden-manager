nom_scientifique: "Cucurbita moschata 'Waltham Butternut'"

i18n:
  fr:
    nom_commun: Courge Butternut Waltham
    noms_alternatifs: [Doubeurre Waltham]
    description: >
      Butternut de référence, à fruits piriformes beige clair, à chair orange
      dense, sucrée et sans fils. Bonne conservation hivernale. Variété fiable et
      productive, adaptée aux climats tempérés.
  en:
    nom_commun: Waltham Butternut Squash
    description: >
      The reference butternut, with pale-beige pear-shaped fruits and dense,
      sweet, stringless orange flesh. Good winter keeper.

conservation:

nom_scientifique: "Lactuca sativa 'Grosse Blonde Paresseuse'"

i18n:
  fr:
    nom_commun: Laitue Grosse Blonde Paresseuse
    noms_alternatifs: [Grosse Blonde Paresseuse]
    description: >
      Grosse laitue pommée blonde d'été, à pomme volumineuse et tendre. Réputée
      lente à monter à graines (« paresseuse »), elle résiste bien à la chaleur
      pour les récoltes estivales.
  en:
    nom_commun: Grosse Blonde Paresseuse Lettuce
    description: >
      Large blond summer butterhead with a big, tender head. Slow to bolt
      ("lazy"), it stands well in heat for summer harvests.


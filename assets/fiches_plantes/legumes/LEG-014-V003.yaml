# Fiche fille (variété) — Laitue Grosse Blonde Paresseuse. Hérite de LEG-014.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-014-V003
parent_id: LEG-014
version_fiche: 1

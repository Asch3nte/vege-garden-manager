# Fiche mère (espèce) — Pastèque.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Cucurbitacée de chaleur à gros fruit. Lot « courantes restantes ».
id: LEG-041
version_fiche: 1
categorie: legume
sous_type: legume_fruit
schema_version: 1
difficulte: 3
usages:
  - alimentaire

rusticite:
  zone_min: zone9
nom_scientifique: Citrullus lanatus
famille_botanique: Cucurbitaceae

i18n:
  fr:
    nom_commun: Pastèque
    noms_alternatifs: [Melon d'eau]
    description: >
      Cucurbitacée annuelle cultivée pour ses gros fruits à chair juteuse et
      sucrée, très riche en eau. Exigeante en chaleur et en soleil, elle demande
      une longue saison chaude, difficile à satisfaire en climat frais.
    conseils_culture: >
      Semer au chaud, repiquer en sol très réchauffé et riche après les gelées,
      en plein soleil, sous abri en climat frais. Limiter le nombre de fruits par
      pied pour qu'ils mûrissent. Pailler pour conserver la chaleur.
    conseils_recolte: >
      Récolter à pleine maturité : la vrille proche du fruit sèche, la tache au
      sol jaunit et le fruit sonne creux.
    erreurs_frequentes:
      - Climat trop frais ou saison trop courte (fruits qui ne mûrissent pas)
      - Excès d'eau en fin de maturité (chair fade et éclatée)
      - Trop de fruits par pied (aucun n'arrive à maturité)
  en:
    nom_commun: Watermelon
    description: >
      Annual cucurbit grown for its large, juicy, sweet, very watery fruit. Very
      demanding in heat and sun, needing a long warm season.

besoins:

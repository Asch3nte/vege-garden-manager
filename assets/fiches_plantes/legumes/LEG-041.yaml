    note_i18n:
      fr: >-
        Arrosez régulièrement au pied pendant la nouaison et le grossissement,
        sans mouiller le feuillage. Réduisez fortement les apports dès que les
        fruits approchent de la maturité pour concentrer les sucres et éviter
        l'éclatement.

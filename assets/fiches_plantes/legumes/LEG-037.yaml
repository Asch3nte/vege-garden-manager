i18n:
  fr:
    nom_commun: Rutabaga
    noms_alternatifs: [Chou-navet, Navet de Suède]
    description: >
      Légume-racine bisannuel de la famille des Brassicacées, cultivé pour sa
      grosse racine à chair jaune, sucrée et rustique. Se conserve longtemps et
      se bonifie avec le froid.
    conseils_culture: >
      Semer en place au début de l'été en sol frais et profond, éclaircir pour
      laisser grossir les racines. Arroser régulièrement pour éviter la chair
      piquante et fibreuse.
    conseils_recolte: >
      Arracher à l'automne avant les fortes gelées, ou récolter au fur et à
      mesure ; se conserve en cave ou en silo.
    erreurs_frequentes:
      - Semis trop tardif (racines trop petites)
      - Manque d'eau (chair piquante et ligneuse)
  en:
    nom_commun: Swede
    description: >
      Biennial root vegetable of the Brassicaceae family, grown for its large
      yellow-fleshed, sweet, hardy root. Stores well and sweetens with cold.


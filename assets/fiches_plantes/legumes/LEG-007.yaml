nom_scientifique: Brassica oleracea
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Chou cabus
    noms_alternatifs: [Chou pommé]
    description: >
      Chou pommé de la famille des Brassicacées, à tête dense de feuilles
      serrées et lisses, consommé comme légume-feuille.
    conseils_culture: >
      Semer sous abri tôt au printemps, repiquer en sol riche et bien travaillé.
      Espacer suffisamment (60 cm) pour que les pommes se forment. Butter
      légèrement le plant pour le stabiliser. Arroser régulièrement. Inspecter
      régulièrement les feuilles pour la piéride du chou.
    conseils_recolte: >
      Récolter quand la pomme est bien ferme sous la pression de la main. Couper
      à la base avec un couteau. Se conserve plusieurs mois en cave.
    erreurs_frequentes:
      - Espacement insuffisant (pommes mal formées)
      - Sol acide (hernie des crucifères)
      - Manque de cuivre dans le sol (chlorose)
  en:
    nom_commun: Cabbage
    description: >
      A leafy Brassica oleracea grown for its dense-leaved head.


# Fiche fille (variété) — Chou de Bruxelles de Rosny. Hérite de LEG-031.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-031-V001
parent_id: LEG-031
version_fiche: 1
schema_version: 1

nom_scientifique: "Brassica oleracea var. gemmifera 'de Rosny'"

i18n:
  fr:
    nom_commun: Chou de Bruxelles de Rosny
    noms_alternatifs: [de Rosny]
    description: >
      Variété ancienne rustique à pommes fermes et serrées, réparties sur toute la
      tige. Productive et de saveur douce après les gelées ; un classique de la
      culture d'hiver.
  en:
    nom_commun: de Rosny Brussels Sprout
    description: >
      Old hardy variety with firm, tight sprouts along the whole stem. Productive
      and mild-flavoured after frosts; a winter-cropping classic.

conservation:
  - methode: frais
    duree_jours: 10
    conditions_i18n: { fr: "Réfrigérateur ; ou récolte au fur et à mesure sur pied", en: "Refrigerator; or pick from the standing plant" }
utilisations_culinaires_i18n:
  fr: [Vapeur, sautés, rôtis au four, braisés]
  en: [Steamed, sautéed, oven-roasted, braised]

sources:
  - https://fr.wikipedia.org/wiki/Chou_de_Bruxelles
contributeurs:
  - "@potagerer"

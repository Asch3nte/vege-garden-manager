# Fiche plante — chou_fleur_de_bretagne.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: chou_fleur_de_bretagne
version_fiche: 1
categorie: legume
sous_type: legume_fleur
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Brassica oleracea var. botrytis 'De Bretagne'
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Chou-fleur De Bretagne
    noms_alternatifs: [Chou-fleur automnal de Bretagne]
    description: >
      Variété bretonne classique à grosse pomme blanche très dense et compacte
      (1,5–2,5 kg), d'une blancheur remarquable et d'une saveur fine. Variété
      d'automne très bien adaptée au climat oceanique. Résistante au vent et
      à la pluie. La Bretagne produit 70 % des choux-fleurs français.
    conseils_culture: >
      Semer en pépinière de mars à mai. Repiquer en sol riche, frais et
      profond. Butter légèrement. Attacher les grandes feuilles autour de la
      pomme pour la blanchir (les feuilles la protègent du soleil qui la ferait
      jaunir). Arroser régulièrement, la sécheresse favorise la montée à graines.
    conseils_recolte: >
      Couper quand la pomme est bien compacte et avant qu'elle ne commence à
      se diviser en fleurettes. Une fois coupée, consommer dans la semaine.
    erreurs_frequentes:
      - Oubli de blanchiment des pommes (jaunissement sous le soleil)
      - Sol acide (hernie des crucifères)
      - Sécheresse en formation de pomme (montaison)
  en:
    nom_commun: Brittany Cauliflower
    description: >
      Classic Brittany variety with a very dense, compact, remarkably white head
      (1.5–2.5 kg) and fine flavor. Autumn variety very well adapted to oceanic
      climate. Resistant to wind and rain.

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:
    - riche
    - bien_draine
    - frais
  ph_min: 6.5
  ph_max: 7.5
  temperature_min_germination: 10
  temperature_optimale: 17

cycle:
  type: annuelle
  duree_germination_jours: [7, 14]
  duree_avant_recolte_jours: [120, 160]
  hauteur_adulte_cm: [50, 70]
  espacement_cm: 60
  profondeur_semis_cm: 1

periodes:
  hemisphere_nord:
    oceanique:
      semis_interieur: [3, 5]
      plantation: [5, 7]
      recolte: [9, 12]
    continental:
      semis_interieur: [3, 4]
      plantation: [5, 6]
      recolte: [8, 11]
    mediterraneen:
      semis_interieur: [3, 5]
      plantation: [5, 7]
      recolte: [9, 12]
  hemisphere_sud:
    oceanique:
      semis_interieur: [9, 11]
      plantation: [11, 1]
      recolte: [3, 6]

associations:
  beneficies:
    - id: laitue
      raison_i18n: { fr: "Bon usage de l'espace sous les choux-fleurs", en: "Good use of space under cauliflowers" }
    - id: celeri
      raison_i18n: { fr: "Repousse la piéride du chou", en: "Repels cabbage white butterfly" }
  defavorables:
    - id: fraise
      raison_i18n: { fr: "Favorisent mutuellement les maladies du sol", en: "Mutually promote soil diseases" }
    - id: moutarde
      raison_i18n: { fr: "Même famille brassicaceae, mêmes ravageurs", en: "Same brassicaceae family, same pests" }
rotation:
  famille: brassicaceae
  delai_retour_annees: 4
  precedents_favorables: [legumineuses, solanaceae]
  precedents_defavorables: [brassicaceae]

conservation:
  - methode: frais
    duree_jours: 10
    conditions_i18n: { fr: "Réfrigérateur, dans un sac perforé", en: "Refrigerator, in a perforated bag" }
  - methode: congelation
    duree_mois: 12
    conditions_i18n: { fr: "Séparer en fleurettes, blanchir 3 min avant congélation", en: "Divide into florets, blanch 3 min before freezing" }
utilisations_culinaires_i18n:
  fr: [Vapeur, gratin, soupe, rôti au four, en pizza, en purée, cru en dip]
  en: [Steamed, gratin, soup, roasted, on pizza, purée, raw as dip]

sources:

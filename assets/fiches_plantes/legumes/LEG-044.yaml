# Fiche mère (espèce) — Topinambour.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Tubercule vivace rustique et productif. Lot « courantes restantes ».
id: LEG-044
version_fiche: 1
categorie: legume
sous_type: legume_tubercule
schema_version: 1
difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone4
nom_scientifique: Helianthus tuberosus
famille_botanique: Asteraceae

i18n:
  fr:
    nom_commun: Topinambour
    noms_alternatifs: [Artichaut de Jérusalem, Poire de terre]
    description: >
      Plante vivace de la famille des Astéracées, proche du tournesol, cultivée
      pour ses tubercules au goût d'artichaut. Extrêmement rustique et productive,
      elle peut devenir envahissante : le moindre tubercule oublié repart.
    conseils_culture: >
      Planter les tubercules au printemps, dans un coin dédié car la plante est
      envahissante et haute. Peu exigeante ; se passe presque d'entretien. Butter
      pour soutenir les tiges hautes.
    conseils_recolte: >
      Récolter les tubercules à l'automne et tout l'hiver, au fur et à mesure des
      besoins ; ils se conservent mieux en terre.
    erreurs_frequentes:
      - Plantation en pleine planche (envahit tout le potager)
      - Récolte incomplète (repousse spontanée l'année suivante)
  en:
    nom_commun: Jerusalem artichoke
    description: >
      Perennial of the Asteraceae family, close to the sunflower, grown for its
      artichoke-flavoured tubers. Extremely hardy and productive, it can become
      invasive.


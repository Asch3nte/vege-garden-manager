# Fiche fille (variété) — Pastèque Charleston Gray. Hérite de LEG-041.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-041-V003
parent_id: LEG-041
version_fiche: 1
schema_version: 1

nom_scientifique: "Citrullus lanatus 'Charleston Gray'"

i18n:
  fr:
    nom_commun: Pastèque Charleston Gray
    noms_alternatifs: [Charleston Gray]
    description: >
      Pastèque allongée à écorce vert-gris clair, à chair rouge ferme et sucrée.
      Gros fruits (8–12 kg), bonne tenue et bonne conservation. Résistante à
      l'anthracnose et à la fusariose ; demande une longue saison chaude.
  en:
    nom_commun: Charleston Gray Watermelon
    description: >
      Elongated watermelon with pale grey-green rind and firm, sweet red flesh.
      Large fruits (8–12 kg), good keeping; resistant to anthracnose and fusarium.
      Needs a long warm season.

conservation:
  - methode: frais
    duree_jours: 14
    conditions_i18n: { fr: "Frais et sombre entier ; réfrigérateur une fois coupé", en: "Cool and dark whole; refrigerator once cut" }
utilisations_culinaires_i18n:
  fr: [Crue en tranches, en salade de fruits, en jus]
  en: [Raw in slices, in fruit salad, juiced]

sources:
  - https://fr.wikipedia.org/wiki/Past%C3%A8que
contributeurs:
  - "@potagerer"

# Fiche plante — betterave_chioggia.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: betterave_chioggia
version_fiche: 1
categorie: legume
sous_type: legume_racine
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Beta vulgaris var. conditiva 'Chioggia'
famille_botanique: Amaranthaceae

i18n:
  fr:
    nom_commun: Betterave Chioggia
    noms_alternatifs: [Betterave Cible, Candy Stripe Beet]
    description: >
      Variété italienne spectaculaire à chair zébrée de rouge et de blanc en
      anneaux concentriques, à la saveur très douce et moins terreuse que les
      variétés classiques. Moins de pigments que la betterave rouge standard :
      ne tache pas lors de la découpe. Racine ronde de 6–8 cm.
    conseils_culture: >
      Semer en place, tremper les graines 24 h pour accélérer la germination.
      Éclaircir à 10 cm. Sol meuble et sans cailloux. Arroser modérément ;
      la sécheresse rend les racines fibreuses et moins savoureuses.
    conseils_recolte: >
      Récolter à 6–7 cm de diamètre pour une saveur optimale. Les grosses
      betteraves deviennent creuses et ligneuses.
    erreurs_frequentes:
      - Sol compact ou caillouteux (racines déformées)
      - Récolte trop tardive (fibrosité)
      - Semis non éclairci (grappes de racines grêles)
  en:
    nom_commun: Chioggia Beet
    noms_alternatifs: [Candy Stripe Beet, Bullseye Beet]
    description: >
      Spectacular Italian variety with flesh striped in concentric red and white
      rings, very mild and less earthy than standard beets. Minimal pigment bleed.

besoins:

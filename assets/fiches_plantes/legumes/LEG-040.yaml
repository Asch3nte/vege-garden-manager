i18n:
  fr:
    nom_commun: Pâtisson
    noms_alternatifs: [Bonnet de prêtre, Artichaut d'Espagne, Couronne impériale]
    description: >
      Courge d'été de la famille des Cucurbitacées, cultivée pour ses fruits en
      forme de soucoupe festonnée, récoltés jeunes à peau tendre. Proche de la
      courgette, elle se cultive de la même façon.
    conseils_culture: >
      Semer au chaud, repiquer après les gelées en sol riche et bien fumé, en
      plein soleil. Arroser au pied et pailler. Récolter régulièrement pour
      stimuler la production.
    conseils_recolte: >
      Cueillir les fruits jeunes (8–12 cm), quand la peau se raye encore à
      l'ongle, pour une chair tendre.
    erreurs_frequentes:
      - Récolte tardive (chair fibreuse, peau dure)
      - Arrosage sur le feuillage (oïdium)
      - Plantation en sol froid (croissance bloquée)
  en:
    nom_commun: Pattypan squash
    description: >
      Summer squash of the Cucurbitaceae family, grown for its scalloped
      saucer-shaped fruit, harvested young with tender skin. Grown like courgette.


# Fiche plante — laitue_batavia_rouge_grenobloise.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: laitue_batavia_rouge_grenobloise
version_fiche: 1
categorie: legume
sous_type: legume_feuille
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Lactuca sativa var. capitata 'Rouge Grenobloise'
famille_botanique: Asteraceae

i18n:
  fr:
    nom_commun: Laitue Batavia Rouge Grenobloise
    noms_alternatifs: [Grenobloise, Batavia rouge]
    description: >
      Variété batavia ancienne à feuilles très frisées, dorées à vert à la base
      et rouge acajou sur les bords. Pomme peu serrée, feuilles croquantes
      et savoureuses, très résistantes à la chaleur et à la montaison. L'une
      des laitues d'été les plus appréciées des jardiniers. Bien adaptée aux
      régions chaudes.
    conseils_culture: >
      Semer en place ou en terrine, repiquer à 30 cm. Résiste bien à la chaleur
      et à la sécheresse modérée. Peut se récolter feuille à feuille sur la
      durée (coupe-et-revient). Adapter les apports en eau pour éviter
      complètement la sécheresse qui ferait monter à graines.
    conseils_recolte: >
      Récolter la pomme entière ou prélever feuille par feuille en laissant le
      cœur pour prolonger la production.
    erreurs_frequentes:
      - Sol trop pauvre (feuilles petites et sans saveur)
      - Stress hydrique prolongé (montaison)
  en:
    nom_commun: Rouge Grenobloise Batavia Lettuce
    description: >
      Old batavia variety with very curly leaves, golden-green at the base and
      mahogany-red at the edges. Loosely packed head, crisp and flavorful leaves,
      very resistant to heat and bolting.


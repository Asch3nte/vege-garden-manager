# Fiche mère (espèce) — Rhubarbe.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Vivace à pétioles (feuilles toxiques). Lot « courantes restantes ».
id: LEG-045
version_fiche: 1
categorie: legume
sous_type: legume_tige
schema_version: 1
difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone3
nom_scientifique: Rheum rhabarbarum
famille_botanique: Polygonaceae

i18n:
  fr:
    nom_commun: Rhubarbe
    noms_alternatifs: [Rhubarbe des jardins]
    description: >
      Plante vivace de la famille des Polygonacées, cultivée pour ses pétioles
      acidulés consommés cuits (compotes, tartes). Très rustique et longévive,
      elle occupe la même place plusieurs années. Attention : les limbes des
      feuilles sont toxiques, seuls les pétioles se consomment.
    conseils_culture: >
      Planter un éclat de souche en sol profond, riche et frais, en situation
      dégagée. Ne pas récolter la première année pour laisser la souche
      s'installer. Supprimer les hampes florales pour prolonger la production.
    conseils_recolte: >
      Tirer les pétioles bien développés en les détachant à la base, à partir de
      la deuxième année, au printemps et au début de l'été. Ne jamais consommer
      les feuilles.
    erreurs_frequentes:
      - Récolte dès la première année (souche affaiblie)
      - Consommation des limbes (toxiques)
      - Récolte trop tardive en été (pétioles fibreux)
  en:
    nom_commun: Rhubarb
    description: >
      Perennial of the Polygonaceae family, grown for its tart petioles eaten
      cooked. Very hardy and long-lived. The leaf blades are toxic; only the
      petioles are edible.


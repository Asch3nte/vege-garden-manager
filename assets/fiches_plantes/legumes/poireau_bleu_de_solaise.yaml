# Fiche plante — poireau_bleu_de_solaise.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: poireau_bleu_de_solaise
version_fiche: 1
categorie: legume
sous_type: legume_tige
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Allium ampeloprasum 'Bleu de Solaise'
famille_botanique: Amaryllidaceae

i18n:
  fr:
    nom_commun: Poireau Bleu de Solaise
    noms_alternatifs: [Poireau d'hiver de Solaise]
    description: >
      Variété lyonnaise ancienne d'une exceptionnelle résistance au froid
      (jusqu'à −15 °C). Feuilles bleu-violet en hiver, très décoratives. Fût
      court et épais, saveur fine et douce. Idéal pour les régions continentales
      aux hivers rigoureux.
    conseils_culture: >
      Semer en pépinière de mars à avril. Repiquer en rigole profonde à 15 cm
      pour blanchir le fût. Buter progressivement au fil de la croissance.
      Arroser régulièrement en été, puis arrêter en automne. Résiste en terre
      tout l'hiver sans protection.
    conseils_recolte: >
      Récolter de novembre à mars selon les besoins. Laisser en terre comme
      légume-garde-manger. Déterrer à la fourche sans blesser le fût.
    erreurs_frequentes:
      - Repiquage sans buter (fût court et verdâtre)
      - Sol compact ou mal drainé (collet pourri)
  en:
    nom_commun: Bleu de Solaise Leek
    description: >
      Old Lyon variety of exceptional frost resistance (down to −15 °C).
      Blue-violet leaves in winter, very ornamental. Short, thick shaft,
      fine and mild flavor.

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:
    - riche
    - bien_draine
    - lourd
  ph_min: 6.0
  ph_max: 7.5
  temperature_optimale: 16

cycle:
  type: bisannuelle
  duree_germination_jours: [14, 21]
  duree_avant_recolte_jours: [200, 270]
  hauteur_adulte_cm: [40, 60]
  espacement_cm: 15
  profondeur_semis_cm: 1

periodes:
  hemisphere_nord:
    oceanique:
      semis_interieur: [3, 4]
      plantation: [6, 7]
      recolte: [11, 3]
    continental:
      semis_interieur: [3, 4]
      plantation: [6, 7]
      recolte: [11, 3]
    mediterraneen:
      semis_interieur: [2, 3]
      plantation: [5, 6]
      recolte: [10, 2]
  hemisphere_sud:
    oceanique:
      semis_interieur: [9, 10]
      plantation: [12, 1]
      recolte: [5, 9]

associations:
  beneficies:
    - id: carotte
      raison_i18n: { fr: "Éloignent mutuellement leurs mouches", en: "Mutually repel each other's flies" }
    - id: laitue
      raison_i18n: { fr: "Bon usage de l'espace, peu concurrentes", en: "Good use of space, low competition" }
  defavorables:
    - id: haricot
      raison_i18n: { fr: "Les alliacées inhibent les légumineuses", en: "Alliums inhibit legumes" }
    - id: pois
      raison_i18n: { fr: "Les alliacées inhibent les légumineuses", en: "Alliums inhibit legumes" }
rotation:
  famille: amaryllidaceae
  delai_retour_annees: 3
  precedents_favorables: [legumineuses, engrais_verts]
  precedents_defavorables: [amaryllidaceae]

conservation:
  - methode: frais
    duree_jours: 14
    conditions_i18n: { fr: "Réfrigérateur dans un sac perforé", en: "Refrigerator in a perforated bag" }
  - methode: congelation
    duree_mois: 12
    conditions_i18n: { fr: "Laver, découper, blanchir 2 min avant congélation", en: "Wash, slice, blanch 2 min before freezing" }
utilisations_culinaires_i18n:
  fr: [Soupe, flamiche, quiche, fondue de poireau, gratin, pot-au-feu]
  en: [Soup, flamiche, quiche, leek fondue, gratin, pot-au-feu]

sources:
  - https://fr.wikipedia.org/wiki/Poireau_cultiv%C3%A9
contributeurs:
  - "@potagerer"

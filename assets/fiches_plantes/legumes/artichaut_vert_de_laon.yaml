# Fiche plante — artichaut_vert_de_laon.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: artichaut_vert_de_laon
version_fiche: 1
categorie: legume
sous_type: legume_fleur
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Cynara scolymus 'Vert de Laon'
famille_botanique: Asteraceae

i18n:
  fr:
    nom_commun: Artichaut Vert de Laon
    noms_alternatifs: [Artichaut Camus du Nord, Camus de Laon]
    description: >
      Variété française ancienne du nord, très rustique (résiste jusqu'à −15 °C
      sous paillage), à gros capitules ronds et verts, charnus, à saveur fine
      et légèrement sucrée. Plant vivace très vigoureux, productif pendant 3–5 ans.
      L'une des rares variétés qui supporte les hivers froids.
    conseils_culture: >
      Planter des éclats de pied au printemps. Sol profond, riche, bien drainé.
      Pailler copieusement en automne pour protéger les souches du gel. Supprimer
      les tiges florales secondaires pour concentrer la sève sur les capitules
      principaux. Renouveler les pieds tous les 3–5 ans.
    conseils_recolte: >
      Récolter les capitules avant que les bractées s'ouvrent, encore serrées
      et fermes. Couper à 10 cm de tige. La récolte principale a lieu en mai–juin,
      avec parfois une seconde en automne.
    erreurs_frequentes:
      - Plantation sans paillage hivernal (gèle des souches)
      - Sol trop pauvre (capitules petits)
      - Récolte tardive (bractées ouvertes, cœur dur)
  en:
    nom_commun: Vert de Laon Artichoke
    noms_alternatifs: [Camus de Laon]
    description: >
      Old northern French variety, very hardy (to −15 °C under mulch), with large,
      round, green, fleshy, fine-flavored heads. Vigorous perennial productive
      for 3–5 years. One of the few varieties that tolerates cold winters.

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:

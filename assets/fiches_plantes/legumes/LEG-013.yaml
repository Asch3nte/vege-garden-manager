difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone9
nom_scientifique: Phaseolus vulgaris
famille_botanique: Fabaceae

i18n:
  fr:
    nom_commun: Haricot
    noms_alternatifs: [Haricot commun]
    description: >
      Plante annuelle de la famille des Fabacées, cultivée pour ses gousses ou
      ses graines riches en protéines ; fixe l'azote de l'air.
    conseils_culture: >
      Semer en place directement, jamais en motte (les racines ne supportent pas
      la transplantation). Sol chaud (≥ 15 °C). Échelonner les semis toutes les
      2–3 semaines pour une récolte continue. Ne pas arroser le feuillage.
    conseils_recolte: >
      Récolter tous les 2–3 jours quand les gousses atteignent 10–12 cm. Une
      gousse trop mûre devient filandreuse et freine la production.
    erreurs_frequentes:
      - Semis en sol froid (pourriture des graines)
      - Récolte trop tardive (gousses filandreuses)
      - "Arrosage du feuillage (favorise l'anthracnose)"
  en:
    nom_commun: Common bean
    description: >
      An annual legume (Fabaceae) grown for its pods or protein-rich seeds; it
      fixes atmospheric nitrogen.


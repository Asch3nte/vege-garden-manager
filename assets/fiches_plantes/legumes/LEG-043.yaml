# Fiche mère (espèce) — Scarole / Chicorée frisée.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Chicorée à salade d'automne. Lot « courantes restantes ».
id: LEG-043
version_fiche: 1
categorie: legume
sous_type: legume_feuille
schema_version: 1
difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone7
nom_scientifique: Cichorium endivia

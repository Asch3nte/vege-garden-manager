i18n:
  fr:
    nom_commun: Scarole
    noms_alternatifs: [Chicorée scarole, Chicorée frisée, Endive frisée]
    description: >
      Salade annuelle à bisannuelle de la famille des Astéracées, aux feuilles
      larges (scarole) ou finement découpées (frisée), légèrement amères.
      Salade de fin d'été et d'automne, plus rustique que la laitue.
    conseils_culture: >
      Semer de la fin du printemps à l'été, repiquer en sol frais et riche.
      Blanchir les pommes en fin de culture (voile ou assiette posée au cœur)
      pour adoucir l'amertume.
    conseils_recolte: >
      Récolter les pommes entières après blanchiment, quand le cœur est bien
      formé et tendre.
    erreurs_frequentes:
      - Manque d'eau (feuilles très amères, montée à graines)
      - Absence de blanchiment (cœur amer)
  en:
    nom_commun: Escarole
    description: >
      Annual-to-biennial salad of the Asteraceae family, with broad (escarole)
      or finely cut (frisée) slightly bitter leaves. A late-summer and autumn
      salad, hardier than lettuce.


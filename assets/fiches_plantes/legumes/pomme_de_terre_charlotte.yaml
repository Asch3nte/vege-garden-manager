# Fiche plante — pomme_de_terre_charlotte.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: pomme_de_terre_charlotte
version_fiche: 1
categorie: legume
sous_type: legume_tubercule
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Solanum tuberosum 'Charlotte'
famille_botanique: Solanaceae

i18n:
  fr:
    nom_commun: Pomme de Terre Charlotte
    noms_alternatifs: [Charlotte mi-saison]
    description: >
      Variété française de référence, mi-saison, à tubercules allongés à peau
      jaune lisse et chair ferme, peu farineuse. Chair se tient très bien à la
      cuisson, idéale pour les salades, vapeur et poêlées. Saveur fine et
      légèrement beurrée. Résistante aux maladies courantes.
    conseils_culture: >
      Faire germer les plants-tubercules en caissettes 3–4 semaines avant la
      plantation (pré-germination). Planter en sol meuble et bien travaillé.
      Butter 2–3 fois au cours de la croissance pour éviter le verdissement.
      Arroser régulièrement lors de la formation des tubercules.
    conseils_recolte: >
      Arracher quand les fanes commencent à jaunir. Laisser sécher les
      tubercules 2 h à l'air avant de stocker. Éviter la lumière (verdissement).
    erreurs_frequentes:
      - Pas de buttage (tubercules verts et toxiques)
      - Rotation insuffisante (mildiou, gale commune)
      - Sol compact (tubercules déformés)
  en:
    nom_commun: Charlotte Potato
    description: >
      French reference mid-season variety with oblong tubers, smooth yellow
      skin and firm, waxy flesh. Holds very well when cooked, ideal for salads,
      steamed and pan-fried. Fine, slightly buttery flavor.

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:
    - leger
    - bien_draine
    - riche
  ph_min: 5.5
  ph_max: 6.5
  temperature_min_germination: 8
  temperature_optimale: 18

cycle:
  type: annuelle
  duree_avant_recolte_jours: [80, 110]
  hauteur_adulte_cm: [50, 80]
  espacement_cm: 35
  profondeur_semis_cm: 10

periodes:
  hemisphere_nord:
    oceanique:
      plantation: [3, 5]
      recolte: [6, 9]
    continental:
      plantation: [4, 5]
      recolte: [7, 9]
    mediterraneen:
      plantation: [2, 4]
      recolte: [5, 8]
  hemisphere_sud:
    oceanique:
      plantation: [9, 11]
      recolte: [12, 3]

associations:
  beneficies:
    - id: haricot
      raison_i18n: { fr: "Le haricot fixe l'azote, la pomme de terre protège les racines", en: "Bean fixes nitrogen, potato protects roots" }
    - id: capucine
      raison_i18n: { fr: "Repousse les doryphores", en: "Repels Colorado beetles" }
  defavorables:
    - id: tomate
      raison_i18n: { fr: "Même famille solanaceae, partage le mildiou", en: "Same solanaceae family, shares blight" }
    - id: concombre
      raison_i18n: { fr: "Favorisent mutuellement le mildiou en conditions humides", en: "Mutually promote blight in humid conditions" }
rotation:
  famille: solanaceae
  delai_retour_annees: 4
  precedents_favorables: [legumineuses, engrais_verts]
  precedents_defavorables: [solanaceae]

conservation:
  - methode: frais
    duree_mois: 4
    conditions_i18n: { fr: "Cave sombre, fraîche (8–10 °C), aérée", en: "Dark, cool cellar (8–10 °C), airy" }
utilisations_culinaires_i18n:
  fr: [Vapeur, salade de pommes de terre, poêlée, gratinée, en soupe, écrasée]
  en: [Steamed, potato salad, pan-fried, gratin, soup, smashed]

sources:
  - https://fr.wikipedia.org/wiki/Pomme_de_terre
contributeurs:
  - "@potagerer"

usages:
  - alimentaire

rusticite:
  zone_min: zone9
nom_scientifique: Cucumis sativus
famille_botanique: Cucurbitaceae

i18n:
  fr:
    nom_commun: Concombre
    description: >
      Plante potagère grimpante de la famille des Cucurbitacées, cultivée pour
      son fruit allongé consommé comme légume, cru ou en condiment.
    conseils_culture: >
      Semer sous abri ou en pleine terre après les gelées. Planter en butte ou
      en pot profond, sol très riche. Conduire sur tuteur ou filet pour
      économiser l'espace. Arroser régulièrement : la sécheresse rend les fruits
      amers.
    conseils_recolte: >
      Récolter à 18–20 cm, bien vert. Un fruit jauni est trop mûr et amère.
      Récolter fréquemment pour stimuler la production.
    erreurs_frequentes:
      - "Irrégularité d'arrosage (amertume des fruits)"
      - 'Sol pauvre ou acide (chlorose, faible production)'
      - Attendre que le fruit jaunisse pour récolter
  en:
    nom_commun: Cucumber
    description: >
      A creeping vine of the Cucurbitaceae family grown for its cylindrical
      fruit used as a culinary vegetable.


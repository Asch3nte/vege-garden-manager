# Fiche mère (espèce) — Pak choï.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Chou asiatique à côtes, croissance rapide. Lot « courantes restantes ».
id: LEG-038
version_fiche: 1
categorie: legume
sous_type: legume_feuille
schema_version: 1
difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone7
nom_scientifique: Brassica rapa subsp. chinensis
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Pak choï
    noms_alternatifs: [Bok choy, Chou chinois à côtes, Pe-tsaï à côtes]
    description: >
      Chou asiatique de la famille des Brassicacées, non pommé, à côtes blanches
      ou vertes et feuilles tendres. Croissance rapide, idéal en cultures de
      printemps et d'automne ; monte vite à graines par temps chaud.
    conseils_culture: >
      Semer en place ou repiquer jeune, en sol frais et riche. Préférer le
      printemps et l'automne : les jours longs et la chaleur provoquent la montée
      à graines. Arroser régulièrement.
    conseils_recolte: >
      Récolter les pieds entiers jeunes, ou prélever les feuilles extérieures au
      fur et à mesure.
    erreurs_frequentes:
      - Culture en plein été (montée à graines rapide)
      - Sol sec (feuilles dures, croissance bloquée)
  en:
    nom_commun: Pak choi
    description: >
      Non-heading Asian brassica with white or green ribs and tender leaves.
      Fast-growing; best in spring and autumn as it bolts quickly in heat.


# Fiche fille (variété) — Serrano. Hérite de LEG-049.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-049-V004
parent_id: LEG-049
version_fiche: 1
schema_version: 1

i18n:
  fr:
    nom_commun: Serrano
    noms_alternatifs: [Piment serrano]
    description: >
      Piment mexicain fin et cylindrique de 4 à 6 cm, plus étroit et nettement
      plus fort que le jalapeño (10 000 à 23 000 SHU). Chair fine et croquante, goût
      vif et net. C'est le piment de la salsa fraîche mexicaine, employé cru et non
      épépiné, là où le jalapeño est jugé trop doux.
    conseils_culture: >
      Très productif : un plant porte souvent plus de cinquante fruits.
      Mêmes exigences que le jalapeño, cycle légèrement plus long.
    conseils_recolte: >
      Se récolte vert le plus souvent, mais peut rougir sur pied pour un
      goût plus rond.
  en:
    nom_commun: Serrano
    noms_alternatifs: [Serrano pepper]
    description: >
      Slim cylindrical Mexican chilli 4–6 cm long, narrower and distinctly
      hotter than jalapeño (10,000–23,000 SHU). Crisp thin flesh — the chilli of
      fresh Mexican salsa, used raw and unseeded.

cycle:
  duree_avant_recolte_jours: [80, 100]

utilisations_culinaires_i18n:
  fr: [Pico de gallo, salsa fraîche, guacamole, conserves au vinaigre]
  en: [Pico de gallo, fresh salsa, guacamole, pickles]

sources:
  - https://fr.wikipedia.org/wiki/Serrano_(piment)
contributeurs:
  - "@potagerer"

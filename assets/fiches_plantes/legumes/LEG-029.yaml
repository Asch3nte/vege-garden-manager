# Fiche mère (espèce) — Bette (poirée).
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Légume-feuille rustique, proche de la betterave. Lot « potagères courantes ».
id: LEG-029
version_fiche: 1
categorie: legume
sous_type: legume_feuille
schema_version: 1
difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone6
nom_scientifique: Beta vulgaris var. cicla
famille_botanique: Amaranthaceae

i18n:
  fr:
    nom_commun: Bette
    noms_alternatifs: [Blette, Poirée, Bette à cardes]
    description: >
      Légume-feuille bisannuel de la famille des Amaranthacées, proche de la
      betterave, cultivé pour ses larges feuilles et ses cardes charnues. Se
      récolte longtemps, feuille à feuille, sans arracher le pied.
    conseils_culture: >
      Semer en place au printemps, en sol riche et frais, arrosage régulier pour
      des feuilles tendres. Récolter les feuilles extérieures au fur et à mesure
      pour prolonger la production.
    conseils_recolte: >
      Cueillir les feuilles extérieures les plus développées à la main ou au
      couteau, en laissant le cœur produire de nouvelles feuilles.
    erreurs_frequentes:
      - Manque d'eau (feuilles coriaces, montée à graines)
      - Récolte du cœur (arrête la production)
  en:
    nom_commun: Chard
    description: >
      Biennial leaf vegetable of the Amaranthaceae family, close to beetroot,
      grown for its large leaves and fleshy stalks. Harvested leaf by leaf over a
      long period.


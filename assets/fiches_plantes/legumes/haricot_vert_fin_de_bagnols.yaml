# Fiche plante — haricot_vert_fin_de_bagnols.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: haricot_vert_fin_de_bagnols
version_fiche: 1
categorie: legume
sous_type: legume_fruit
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Phaseolus vulgaris 'Fin de Bagnols'
famille_botanique: Fabaceae

i18n:
  fr:
    nom_commun: Haricot vert Fin de Bagnols
    noms_alternatifs: [Haricot filet Bagnols]
    description: >
      Variété ancienne française à gousses très fines, longues (12–15 cm),
      sans fil, tendres et savoureuses. Plant nain très productif, idéal pour
      les petits potagers. L'une des variétés les plus appréciées des jardiniers.
    conseils_culture: >
      Semer en place directement, jamais en motte (les racines ne supportent
      pas la transplantation). Sol chaud (≥ 15 °C). Échelonner les semis toutes
      les 2–3 semaines pour une récolte continue. Ne pas arroser le feuillage.
    conseils_recolte: >
      Récolter tous les 2–3 jours quand les gousses atteignent 10–12 cm. Une
      gousse trop mûre devient filandreuse et freine la production.
    erreurs_frequentes:
      - Semis en sol froid (pourriture des graines)
      - Récolte trop tardive (gousses filandreuses)
      - Arrosage du feuillage (favorise l'anthracnose)
  en:
    nom_commun: French Bean Fin de Bagnols
    description: >
      Old French heirloom variety with very thin, long (12–15 cm), stringless,
      tender and flavorful pods. Highly productive dwarf bush plant.

besoins:

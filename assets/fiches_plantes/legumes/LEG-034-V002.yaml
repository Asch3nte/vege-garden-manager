# Fiche fille (variété) — Céleri branche Plein Blanc Pascal. Hérite de LEG-034.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-034-V002
parent_id: LEG-034
version_fiche: 1
schema_version: 1

nom_scientifique: "Apium graveolens var. dulce 'Plein Blanc Pascal'"

i18n:
  fr:
    nom_commun: Céleri branche Plein Blanc Pascal
    noms_alternatifs: [Plein Blanc Pascal, Géant doré Pascal]
    description: >
      Céleri à côtes larges et charnues que l'on blanchit en fin de culture pour
      les rendre tendres et douces. Variété volumineuse et productive ; demande
      un sol très riche et un arrosage abondant.
  en:
    nom_commun: Golden Pascal Celery
    description: >
      Celery with broad, fleshy ribs blanched at the end of the season to make
      them tender and mild. Large and productive; needs very rich soil and plenty
      of water.
conservation:
  - methode: frais
    duree_jours: 12
    conditions_i18n: { fr: "Réfrigérateur, pieds dans un peu d'eau", en: "Refrigerator, stalks in a little water" }
utilisations_culinaires_i18n:
  fr: [Cru en salade, braisé, en soupe, en gratin]
  en: [Raw in salad, braised, in soup, gratin]

sources:
  - https://fr.wikipedia.org/wiki/C%C3%A9leri
contributeurs:
  - "@potagerer"

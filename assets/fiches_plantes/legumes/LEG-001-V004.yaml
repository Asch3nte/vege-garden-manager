# Fiche fille (variété) — Tomate Noire de Crimée. Hérite de LEG-001.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-001-V004
parent_id: LEG-001
version_fiche: 1
schema_version: 1

nom_scientifique: "Solanum lycopersicum 'Black Krim'"

i18n:
  fr:
    nom_commun: Tomate Noire de Crimée
    noms_alternatifs: [Black Krim, Noire de Crimée, Tomate noire]
    description: >
      Variété ancienne de Crimée (Ukraine) à gros fruits aplatis (250–500 g),
      couleur rouge-brun foncé à presque noir avec des épaules vertes
      caractéristiques. Chair juteuse, dense, saveur intense aux notes sucrées
      et légèrement fumées, très appréciée des amateurs de tomates anciennes.
      Port indéterminé vigoureux (150–200 cm).
    conseils_culture: >
      Préférer un emplacement chaud et ensoleillé, sol humifère et léger.
      Espacer à 70–100 cm pour favoriser l'aération. Pincer les gourmands pour
      obtenir de gros fruits bien colorés. La coloration noire est plus intense
      avec un ensoleillement direct maximal ; en climat frais ou sous ombrage
      partiel, les fruits restent plus rouges. Arrosage modéré mais régulier.
    conseils_recolte: >
      Récolter 4–5 mois après le semis, quand les fruits sont souples sous le
      doigt et présentent leurs épaules vertes-brunes typiques. Ne pas attendre
      une coloration uniforme : la teinte foncée est normale et ne signifie pas
      sur-maturité.
    erreurs_frequentes:
      - Attendre une coloration rouge uniforme (la variété ne devient jamais entièrement rouge)
      - Arrosage irrégulier (éclatement des gros fruits)
      - "Culture à l'ombre partielle (réduction de la coloration noire caractéristique)"
  en:
    nom_commun: Black Krim Tomato
    description: >
      Old Crimean heirloom with large flattened fruits (250–500 g), deep
      red-brown to near-black skin with characteristic green shoulders.
      Juicy, dense flesh with an intense, slightly smoky-sweet flavour.

cycle:
  duree_avant_recolte_jours: [80, 100]
  hauteur_adulte_cm: [150, 200]
  espacement_cm: 80

conservation:
  - methode: frais
    duree_jours: 5
    conditions_i18n: { fr: "Température ambiante, hors réfrigérateur (le froid altère la saveur)", en: "Room temperature; refrigeration alters the flavour" }
  - methode: conserves
    duree_mois: 12
  - methode: sechage
    duree_mois: 12
utilisations_culinaires_i18n:
  fr: [Crue en salade, carpaccio, sauce corsée, bruschetta, farcie]
  en: [Raw in salads, carpaccio, rich sauce, bruschetta, stuffed]

sources:
  - https://fr.wikipedia.org/wiki/Noire_de_Crim%C3%A9e
  - https://www.jardiner-malin.fr/fiche/tomate-noire-de-crimee.html
contributeurs:

nom_scientifique: "Allium cepa 'Rosé de Roscoff'"

i18n:
  fr:
    nom_commun: Oignon Rosé de Roscoff
    noms_alternatifs: [Rosé de Roscoff]
    description: >
      Oignon rosé breton (AOP) à bulbe rond légèrement aplati, à chair douce et
      fruitée. Remarquable pour sa très longue conservation (les fameuses tresses
      des « Johnnies ») tout en gardant sa douceur.
  en:
    nom_commun: Roscoff Pink Onion
    description: >
      Breton pink onion (PDO) with a round, slightly flattened bulb and sweet,
      fruity flesh. Remarkable for very long keeping while staying mild.

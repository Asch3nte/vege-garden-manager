# Fiche plante — carotte_nantaise_amelioree.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: carotte_nantaise_amelioree
version_fiche: 1
categorie: legume
sous_type: legume_racine
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Daucus carota 'Nantaise Améliorée'
famille_botanique: Apiaceae

i18n:
  fr:
    nom_commun: Carotte Nantaise Améliorée
    noms_alternatifs: [Nantaise 2]
    description: >
      Variété classique française semi-longue (15–18 cm), cylindrique, à cœur
      très fin, très sucrée et croquante. L'une des carottes de jardin les plus
      cultivées en France. Excellente crues comme cuites. Bonne conservation.
    conseils_culture: >
      Semer clair en ligne, sur sol profond et bien ameubli sans fumure fraîche.
      Éclaircir à 5–7 cm entre plants dès que les premières feuilles apparaissent.
      Biner pour éviter le croutage. Protéger contre la mouche de la carotte
      avec un voile anti-insectes.
    conseils_recolte: >
      Récolter à partir de 3 mois de semis, quand le collet est bien formé.
      Tirer délicatement ou utiliser une fourche-bêche en sol compacte.
    erreurs_frequentes:
      - Sol trop riche en azote (racines fourchues, trop de feuillage)
      - Semis trop dense non éclairci (racines grêles)
      - Absence de protection contre la mouche de la carotte
  en:
    nom_commun: Nantes Improved Carrot
    description: >
      Classic French semi-long variety (15–18 cm), cylindrical, very fine core,
      very sweet and crisp. One of the most widely grown garden carrots in France.

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:
    - leger
    - bien_draine
  ph_min: 6.0
  ph_max: 7.0
  temperature_min_germination: 10
  temperature_optimale: 18

cycle:
  type: bisannuelle
  duree_germination_jours: [12, 21]
  duree_avant_recolte_jours: [80, 110]
  hauteur_adulte_cm: [20, 40]
  espacement_cm: 6
  profondeur_semis_cm: 1

periodes:
  hemisphere_nord:
    oceanique:
      semis_exterieur: [3, 7]
      recolte: [6, 11]
    continental:
      semis_exterieur: [4, 6]
      recolte: [7, 10]
    mediterraneen:
      semis_exterieur: [2, 7]
      recolte: [5, 11]
  hemisphere_sud:
    oceanique:
      semis_exterieur: [9, 1]
      recolte: [12, 6]

associations:
  beneficies:
    - id: poireau
      raison_i18n: { fr: "Éloignent mutuellement leurs mouches", en: "Mutually repel each other's flies" }
    - id: laitue
      raison_i18n: { fr: "Bon usage de l'espace, peu concurrentes", en: "Good use of space, low competition" }
    - id: soucis
      raison_i18n: { fr: "Repousse la mouche de la carotte", en: "Repels carrot fly" }
  defavorables:
    - id: aneth
      raison_i18n: { fr: "Même famille Apiaceae, attire les mêmes ravageurs", en: "Same Apiaceae family, attracts the same pests" }
    - id: fenouil
      raison_i18n: { fr: "Même famille, inhibe la croissance", en: "Same family, inhibits growth" }
rotation:
  famille: apiaceae
  delai_retour_annees: 3
  precedents_favorables: [legumineuses, asteraceae]
  precedents_defavorables: [apiaceae]

conservation:
  - methode: frais
    duree_jours: 21
    conditions_i18n: { fr: "Réfrigérateur, sac perforé, ou sable humide en cave", en: "Refrigerator, perforated bag, or damp sand in cellar" }
  - methode: congelation
    duree_mois: 12
    conditions_i18n: { fr: "Éplucher et blanchir 3 min avant congélation", en: "Peel and blanch 3 min before freezing" }
utilisations_culinaires_i18n:
  fr: [Crue, râpée en salade, en julienne, soupe, purée, glacée au beurre]
  en: [Raw, grated salad, julienne, soup, purée, glazed in butter]

sources:
  - https://fr.wikipedia.org/wiki/Carotte
contributeurs:
  - "@potagerer"

# Fiche mère (espèce) — Céleri-rave.
# Taxonomie & description : tool/scrap_fiche.dart (GBIF × Wikidata × Wikipédia).
# Agronomie généralisée depuis la variété + références. Généré (Lot 3), relu.
id: LEG-005
version_fiche: 1
categorie: legume
sous_type: legume_racine
schema_version: 1
difficulte: 3
usages:
  - alimentaire

rusticite:
  zone_min: zone5
nom_scientifique: Apium graveolens
famille_botanique: Apiaceae

i18n:
  fr:
    nom_commun: Céleri-rave
    noms_alternatifs: [Céleri-rave]
    description: >
      Variété de céleri de la famille des Apiacées, cultivée pour son hypocotyle
      renflé (boule) charnu et parfumé, consommé comme légume-racine.
    conseils_culture: >
      Semer en intérieur très tôt (février) : cycle très long. Repiquer après
      les gelées dans un sol très riche et toujours humide — le céleri-rave ne
      supporte pas la sécheresse. Enlever les feuilles latérales pour favoriser
      le développement du bulbe. Ne pas enterrer le collet.
    conseils_recolte: >
      Récolter de septembre à décembre selon les besoins. Se conserve très bien
      en terre sous paillis en régions douces.
    erreurs_frequentes:
      - "Manque d'eau constant (bulbe dur et creux)"
      - Semis trop tardif (bulbe trop petit)
      - Collet trop enterré (pourriture)
  en:
    nom_commun: Celeriac
    description: >
      A group of Apium graveolens cultivars grown for their edible bulb-like
      hypocotyl.


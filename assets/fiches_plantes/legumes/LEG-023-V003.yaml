# Fiche fille (variété) — Artichaut Camus de Bretagne. Hérite de LEG-023.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-023-V003
parent_id: LEG-023
version_fiche: 1
schema_version: 1

nom_scientifique: "Cynara cardunculus var. scolymus 'Camus de Bretagne'"

i18n:
  fr:
    nom_commun: Artichaut Camus de Bretagne
    noms_alternatifs: [Camus de Bretagne, Gros Camus]
    description: >
      Gros artichaut vert à capitule arrondi, charnu et volumineux, à fond épais
      très apprécié. Variété de référence en Bretagne ; demande un sol riche et
      frais et redoute les hivers rigoureux.
  en:
    nom_commun: Camus de Bretagne Artichoke
    description: >
      Large green artichoke with a rounded, fleshy, bulky head and a prized thick
      base. The reference Breton variety; needs rich, moist soil and dislikes
      harsh winters.

conservation:
  - methode: frais
    duree_jours: 7
    conditions_i18n: { fr: "Réfrigérateur, tige dans l'eau", en: "Refrigerator, stem in water" }
utilisations_culinaires_i18n:
  fr: [Cuit à la vapeur, fonds farcis, à la vinaigrette]
  en: [Steamed, stuffed bases, with vinaigrette]

sources:
  - https://fr.wikipedia.org/wiki/Artichaut
contributeurs:
  - "@potagerer"

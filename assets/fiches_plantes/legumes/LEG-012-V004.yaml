# Fiche fille (variété) — Épinard America. Hérite de LEG-012.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-012-V004
parent_id: LEG-012
version_fiche: 1
schema_version: 1

nom_scientifique: "Spinacia oleracea 'America'"

i18n:
  fr:
    nom_commun: Épinard America
    noms_alternatifs: [America]
    description: >
      Épinard à feuilles épaisses cloquées vert foncé, à port dressé, résistant à
      la montaison. Bien adapté aux semis de fin d'été et d'automne pour des
      récoltes tardives ; qualité gustative appréciée.
  en:
    nom_commun: America Spinach
    description: >
      Spinach with thick, savoyed dark-green leaves and an upright habit,
      bolt-resistant. Well suited to late-summer and autumn sowings.
conservation:
  - methode: frais
    duree_jours: 4
    conditions_i18n: { fr: "Réfrigérateur, bac à légumes", en: "Refrigerator, crisper drawer" }
  - methode: congelation
    duree_mois: 10
    conditions_i18n: { fr: "Blanchir 1 min, presser, puis congeler", en: "Blanch 1 min, press, then freeze" }
utilisations_culinaires_i18n:
  fr: [Jeune cru en salade, en branche, en gratin, en quiche]
  en: [Young raw in salad, sautéed, gratin, quiche]

sources:
  - https://fr.wikipedia.org/wiki/%C3%89pinard
contributeurs:
  - "@potagerer"

# Fiche mère (espèce) — Carotte.
# Taxonomie & description : tool/scrap_fiche.dart (GBIF × Wikidata × Wikipédia).
# Agronomie généralisée depuis la variété + références. Généré (Lot 3), relu.
id: LEG-004
version_fiche: 1
categorie: legume
sous_type: legume_racine
schema_version: 1
difficulte: 2
usages:
  - alimentaire

rusticite:
  zone_min: zone3
nom_scientifique: Daucus carota
famille_botanique: Apiaceae

i18n:
  fr:
    nom_commun: Carotte
    noms_alternatifs: [Carotte cultivée]
    description: >
      Légume-racine bisannuel de la famille des Apiacées, cultivé en annuel pour
      sa racine pivotante charnue, riche en carotène. Préfère les sols meubles,
      profonds et sans cailloux.
    conseils_culture: >
      Semer clair en ligne, sur sol affiné et sans fumure fraîche. Éclaircir
      pour laisser ~5 cm entre plants. Biner régulièrement.
    conseils_recolte: >
      Récolter au besoin dès que les racines ont grossi ; les variétés tardives
      se conservent en terre ou en silo.
    erreurs_frequentes:
      - Sol caillouteux ou trop riche en fumier frais (racines fourchues)
      - Semis trop dense non éclairci
  en:
    nom_commun: Carrot
    description: >
      Root vegetable of the Apiaceae family, typically orange and rich in
      beta-carotene; a biennial grown as an annual.

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:
    - leger
    - bien_draine
  ph_min: 6.0
  ph_max: 7.0
  temperature_optimale: 18
  ensoleillement_min: mi_ombre
  temperature_min_survie: -15
  gele_fatal: false
  arrosage_detaille:
    phases_sensibles:
      - germination
      - grossissement
    note_i18n:
      fr: >-
        Gardez le lit de semence humide jusqu'à la levée, qui est lente (deux à
        trois semaines). Ensuite, arrosez régulièrement pendant le grossissement
        des racines : une reprise d'arrosage après une période sèche fait
        éclater les carottes.

# Fiche mère (espèce) — Pomme de terre.
# Taxonomie & description : tool/scrap_fiche.dart (GBIF × Wikidata × Wikipédia).
# Agronomie généralisée depuis la variété + références. Généré (Lot 3), relu.
id: LEG-020
version_fiche: 1
categorie: legume
sous_type: legume_tubercule
schema_version: 1
difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone4
nom_scientifique: Solanum tuberosum
famille_botanique: Solanaceae

i18n:
  fr:
    nom_commun: Pomme de terre
    noms_alternatifs: [Patate]
    description: >
      Plante de la famille des Solanacées cultivée pour ses tubercules
      comestibles riches en amidon ; vivace par ses tubercules mais cultivée en
      annuelle.
    conseils_culture: >
      Faire germer les plants-tubercules en caissettes 3–4 semaines avant la
      plantation (pré-germination). Planter en sol meuble et bien travaillé.
      Butter 2–3 fois au cours de la croissance pour éviter le verdissement.
      Arroser régulièrement lors de la formation des tubercules.
    conseils_recolte: >
      Arracher quand les fanes commencent à jaunir. Laisser sécher les
      tubercules 2 h à l'air avant de stocker. Éviter la lumière (verdissement).
    erreurs_frequentes:
      - Pas de buttage (tubercules verts et toxiques)
      - 'Rotation insuffisante (mildiou, gale commune)'
      - Sol compact (tubercules déformés)
  en:
    nom_commun: Potato
    description: >
      Grown for its starchy edible tubers (Solanum tuberosum); a perennial
      cultivated as an annual.


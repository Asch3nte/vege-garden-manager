nom_scientifique: "Solanum lycopersicum 'Gardener's Delight'"

i18n:
  fr:
    nom_commun: Tomate Gardener's Delight
    noms_alternatifs: [Délice du jardinier]
    description: >
      Tomate-cerise rouge à la saveur sucrée et parfumée, extrêmement productive,
      formant de longues grappes régulières. Plant indéterminé robuste et facile,
      idéal pour débuter. À tuteurer.
  en:
    nom_commun: Gardener's Delight Tomato
    description: >
      Sweet, aromatic red cherry tomato, extremely productive, bearing long,
      regular trusses. Robust, easy indeterminate plant, ideal for beginners.


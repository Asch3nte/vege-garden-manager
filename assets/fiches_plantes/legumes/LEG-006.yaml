rusticite:
  zone_min: zone3
nom_scientifique: Brassica oleracea
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Chou brocoli
    noms_alternatifs: [Brocoli]
    description: >
      Chou de la famille des Brassicacées (groupe Italica), cultivé pour ses
      inflorescences vertes denses consommées comme légume avant floraison.
    conseils_culture: >
      Semer en pépinière, repiquer à 50 cm. Sol riche en azote, bien travaillé.
      Arroser régulièrement. Couper la tête principale avant que les bractées ne
      s'ouvrent (fleurissent). Après la coupe principale, arroser et fertiliser
      pour favoriser les jets latéraux.
    conseils_recolte: >
      Récolter la tête principale en premier, puis les jets secondaires dès
      qu'ils atteignent 5–8 cm. Couper régulièrement pour prolonger la
      production.
    erreurs_frequentes:
      - 'Laisser la tête principale fleurir (bractées jaunes, perte de saveur)'
      - Espacement insuffisant (têtes petites)
      - Sol acide (hernie des crucifères)
  en:
    nom_commun: Broccoli
    description: >
      A Brassica oleracea cultivar (Italica group) grown for its edible green
      flower head.


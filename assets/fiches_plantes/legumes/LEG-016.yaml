i18n:
  fr:
    nom_commun: Oignon
    noms_alternatifs: [Ognon]
    description: >
      Plante bisannuelle de la famille des Amaryllidacées, cultivée pour son
      bulbe à saveur et odeur fortes, consommé comme légume ou condiment.
    conseils_culture: >
      Planter des bulbilles ou semer en février–mars sous abri. Repiquer en sol
      meuble et bien drainé. Ne pas enterrer le bulbe trop profondément : le
      collet doit affleurer. Arroser modérément, réduire avant la récolte pour
      favoriser la conservation.
    conseils_recolte: >
      Récolter quand les fanes se couchent et jaunissent. Arracher et laisser
      sécher 2–3 semaines à l'air avant de stocker.
    erreurs_frequentes:
      - 'Sol trop riche en azote (trop de feuilles, bulbe mal formé)'
      - Humidité excessive en fin de cycle (pourriture du collet)
      - Récolte avant que les fanes se couchent
  en:
    nom_commun: Onion
    description: >
      A bulb vegetable (Allium cepa), the most widely cultivated species of the
      genus Allium.


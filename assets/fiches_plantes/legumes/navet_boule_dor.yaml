# Fiche plante — navet_boule_dor.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: navet_boule_dor
version_fiche: 1
categorie: legume
sous_type: legume_racine
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Brassica rapa 'Boule d'Or'
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Navet Boule d'Or
    noms_alternatifs: [Navet jaune Boule d'Or]
    description: >
      Variété ancienne française à racine ronde d'un beau jaune doré, chair
      jaune très fine et douce, moins piquante que les navets blancs. Saveur
      légèrement sucrée, appréciée même par ceux qui n'aiment pas le navet
      classique. Cycle court, très productive.
    conseils_culture: >
      Semer en place en lignes, éclaircir à 15 cm. Préfère les sols frais et
      profonds. Éviter la chaleur intense qui monte les plantes à graines.
      Arroser régulièrement pour une croissance rapide et une chair tendre.
    conseils_recolte: >
      Récolter à 7–10 cm de diamètre, avant que la racine ne devienne fibreuse
      ou ne se creuse. Les jeunes feuilles sont comestibles en salade.
    erreurs_frequentes:
      - Sol acide (favorise la hernie des crucifères)
      - Semis en plein été (montaison prématurée par la chaleur)
      - Récolte tardive (racines creuses et amères)
  en:
    nom_commun: Boule d'Or Turnip
    noms_alternatifs: [Golden Ball Turnip]
    description: >
      Old French variety with round, golden-yellow roots, fine and mild flesh,
      less pungent than white turnips. Slightly sweet flavor.

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:
    - leger
    - bien_draine
    - frais
  ph_min: 6.5
  ph_max: 7.5
  temperature_min_germination: 8
  temperature_optimale: 15

cycle:
  type: annuelle
  duree_germination_jours: [5, 10]
  duree_avant_recolte_jours: [45, 70]
  hauteur_adulte_cm: [20, 35]
  espacement_cm: 15
  profondeur_semis_cm: 1

periodes:
  hemisphere_nord:
    oceanique:
      semis_exterieur: [3, 5]
      recolte: [5, 8]
    continental:
      semis_exterieur: [3, 5]
      recolte: [5, 8]
    mediterraneen:
      semis_exterieur: [2, 4]
      recolte: [4, 7]
  hemisphere_sud:
    oceanique:
      semis_exterieur: [9, 11]
      recolte: [11, 2]

associations:
  beneficies:
    - id: laitue
      raison_i18n: { fr: "Bon usage de l'espace, cycles courts complémentaires", en: "Good space use, complementary short cycles" }
    - id: pois
      raison_i18n: { fr: "Les légumineuses enrichissent le sol en azote", en: "Legumes enrich soil with nitrogen" }
  defavorables:
    - id: moutarde
      raison_i18n: { fr: "Même famille, partage les mêmes maladies", en: "Same family, shares the same diseases" }
rotation:
  famille: brassicaceae
  delai_retour_annees: 4
  precedents_favorables: [legumineuses, cucurbitaceae]
  precedents_defavorables: [brassicaceae]

conservation:
  - methode: frais
    duree_jours: 21
    conditions_i18n: { fr: "Cave en sable humide ou réfrigérateur", en: "Cellar in damp sand or refrigerator" }
  - methode: congelation
    duree_mois: 12
    conditions_i18n: { fr: "Blanchir 2 min avant congélation", en: "Blanch 2 min before freezing" }
utilisations_culinaires_i18n:
  fr: [Pot-au-feu, gratin, purée, sauté au beurre, soupe, en quartiers rôtis]
  en: [Pot-au-feu, gratin, purée, sautéed in butter, soup, roasted wedges]


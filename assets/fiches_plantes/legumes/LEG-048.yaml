# Fiche mère (espèce) — Patate douce.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Tubercule de chaleur, conduite annuelle. Lot « courantes restantes ».
id: LEG-048
version_fiche: 1
categorie: legume
sous_type: legume_tubercule
schema_version: 1
difficulte: 2
usages:
  - alimentaire

rusticite:
  zone_min: zone9
nom_scientifique: Ipomoea batatas
famille_botanique: Convolvulaceae

i18n:
  fr:
    nom_commun: Patate douce
    noms_alternatifs: [Batate]
    description: >
      Plante de la famille des Convolvulacées, cultivée pour ses tubercules
      sucrés. Frileuse et gourmande en chaleur, elle se conduit en annuelle sous
      climat tempéré, plantée par jeunes plants après tout risque de gel.
    conseils_culture: >
      Planter les jeunes plants en sol léger, réchauffé et bien drainé, sur
      butte ou paillage plastique pour capter la chaleur. Laisser les tiges
      ramper ou palisser. Arroser régulièrement en été.
    conseils_recolte: >
      Récolter les tubercules avant les premières gelées, quand le feuillage
      commence à jaunir. Les laisser ressuyer puis les conserver au chaud.
    erreurs_frequentes:
      - Plantation en sol froid (croissance bloquée)
      - Récolte après une gelée (tubercules qui pourrissent au stockage)
      - Excès d'azote (feuillage abondant, peu de tubercules)
  en:
    nom_commun: Sweet potato
    description: >
      Plant of the Convolvulaceae family, grown for its sweet tubers. Frost-tender
      and heat-loving, grown as an annual in temperate climates from slips planted
      after all frost risk.


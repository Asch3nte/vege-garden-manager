i18n:
  fr:
    nom_commun: Ail
    noms_alternatifs: [Ail cultivé, Ail commun]
    description: >
      Plante de la famille des Amaryllidacées, cultivée en annuelle pour son
      bulbe composé de caïeux (gousses) à saveur et odeur fortes. Condiment
      majeur et remarquable répulsif au potager : ses composés soufrés
      éloignent pucerons et de nombreux ravageurs et champignons.
    conseils_culture: >
      Planter les caïeux pointe vers le haut, en sol léger et bien drainé, au
      soleil. L'ail d'automne (planté oct.–déc.) profite du froid hivernal
      (vernalisation) ; l'ail de printemps se plante en fév.–mars. Ne pas
      fumer avant plantation (l'excès d'azote fait pourrir le bulbe). Réduire
      l'arrosage en fin de cycle.
    conseils_recolte: >
      Récolter quand le feuillage jaunit et se couche, par temps sec. Arracher,
      puis laisser sécher (ressuyage) 2–3 semaines à l'ombre et à l'air avant
      de tresser ou stocker au sec.
    erreurs_frequentes:
      - Sol trop humide ou trop riche en azote (pourriture du bulbe)
      - Planter trop profond ou pointe en bas
      - Récolter trop tard (bulbe éclaté, mauvaise conservation)
  en:
    nom_commun: Garlic
    description: >
      An Amaryllidaceae grown as an annual for its bulb of strong-flavoured
      cloves. A major condiment and a notable garden repellent: its sulphur
      compounds deter aphids and many pests and fungi.


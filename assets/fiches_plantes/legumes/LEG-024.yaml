# Fiche mère (espèce) — Fenouil bulbeux.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Légume-bulbe ombellifère, allélopathique (défavorable à de nombreux voisins).
# Créée au lot « fleurs compagnes » pour résoudre les références orphelines
# (ex-id legacy `fenouil`).
id: LEG-024
version_fiche: 1
categorie: legume
sous_type: legume_bulbe
schema_version: 1
difficulte: 2
usages:
  - alimentaire
  - condimentaire

rusticite:
  zone_min: zone6
nom_scientifique: Foeniculum vulgare var. azoricum
famille_botanique: Apiaceae

i18n:
  fr:
    nom_commun: Fenouil
    noms_alternatifs: [Fenouil bulbeux, Fenouil doux, Fenouil de Florence]
    description: >
      Légume-bulbe de la famille des Apiacées, cultivé pour sa base charnue au
      goût anisé, consommée crue ou cuite. Le feuillage et les graines sont
      aromatiques. Plante allélopathique : elle inhibe la croissance de nombreux
      voisins et se cultive plutôt à l'écart.
    conseils_culture: >
      Semer en place à partir de la fin du printemps pour éviter la montée à
      graines prématurée liée aux jours longs. Sol frais et riche, arrosage
      régulier. Butter légèrement la base pour blanchir le bulbe.
    conseils_recolte: >
      Récolter les bulbes bien formés et fermes avant les fortes gelées, en les
      coupant au ras du sol.
    erreurs_frequentes:
      - Semis trop précoce (montée à graines sans former de bulbe)
      - Manque d'eau (bulbes filandreux)
      - Proximité de cultures sensibles (effet allélopathique)
  en:
    nom_commun: Fennel
    description: >
      Bulb vegetable of the Apiaceae family, grown for its fleshy anise-flavoured
      base eaten raw or cooked. Allelopathic: it inhibits the growth of many
      neighbours and is best grown apart.


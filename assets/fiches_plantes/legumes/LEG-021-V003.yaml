  - methode: frais
    duree_mois: 8
    conditions_i18n: { fr: "Local sec et aéré, 10–15 °C", en: "Dry, airy room, 10–15 °C" }
utilisations_culinaires_i18n:
  fr: [En soupe, rôtie, en purée, en tarte sucrée]
  en: [Soup, roasted, mashed, sweet pie]

sources:

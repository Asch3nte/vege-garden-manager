# Fiche plante — potimarron_rouge_vif_etampes.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: potimarron_rouge_vif_etampes
version_fiche: 1
categorie: legume
sous_type: legume_fruit
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Cucurbita maxima 'Rouge Vif d'Étampes'
famille_botanique: Cucurbitaceae

i18n:
  fr:
    nom_commun: Potiron Rouge Vif d'Étampes
    noms_alternatifs: [Potiron de Cendrillon, Cinderella Pumpkin]
    description: >
      Variété française spectaculaire à gros fruits très aplatis et très côtelés,
      d'un rouge orangé intense. Peut atteindre 10–20 kg. Chair jaune orangée,
      légèrement sucrée. Très bonne conservation. Utilisée dans de nombreux
      desserts et soupes.
    conseils_culture: >
      Semer sous abri 3 semaines avant le repiquage. Planter dans des buttes
      enrichies en compost. Pincer les tiges principales à 4–5 feuilles au-delà
      du dernier fruit fixé pour concentrer la sève. Pailler abondamment pour
      conserver l'humidité.
    conseils_recolte: >
      Attendre que la tige se liège et brunisse avant de couper. Laisser sécher
      2 semaines à l'air dans un endroit sec avant la mise en conservation.
    erreurs_frequentes:
      - Arrosage excessif (pourriture du collet)
      - Sol pauvre (fruits petits et peu sucrés)
      - Récolte avant maturité complète (mauvaise conservation)
  en:
    nom_commun: Rouge Vif d'Étampes Pumpkin
    noms_alternatifs: [Cinderella Pumpkin]
    description: >
      Spectacular French variety with large, very flat and deeply ribbed fruits
      of intense orange-red. Can reach 10–20 kg. Slightly sweet yellow-orange flesh.


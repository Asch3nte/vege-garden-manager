# Fiche fille (variété) — Haricot Contender. Hérite de LEG-013.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-013-V002
parent_id: LEG-013
version_fiche: 1
schema_version: 1

nom_scientifique: "Phaseolus vulgaris 'Contender'"

i18n:
  fr:
    nom_commun: Haricot Contender
    noms_alternatifs: [Contender]
    description: >
      Haricot nain mangetout à gousses vertes fines et charnues, sans fil, très
      précoce et productif. Rustique et tolérant, il convient bien aux semis
      précoces et aux débutants. Port buissonnant sans tuteurage.
  en:
    nom_commun: Contender Bean
    description: >
      Dwarf green snap bean with fine, fleshy, stringless pods, very early and
      productive. Hardy and tolerant, good for early sowings and beginners.

conservation:
  - methode: frais
    duree_jours: 5
    conditions_i18n: { fr: "Réfrigérateur, tiroir à légumes", en: "Refrigerator, vegetable drawer" }
  - methode: congelation
    duree_mois: 10
    conditions_i18n: { fr: "Équeuter et blanchir 3 min", en: "Top and tail, blanch 3 min" }
utilisations_culinaires_i18n:
  fr: [Vapeur, poêlé, en salade, en conserve]
  en: [Steamed, sautéed, in salad, canned]

sources:
  - https://fr.wikipedia.org/wiki/Haricot
contributeurs:
  - "@potagerer"

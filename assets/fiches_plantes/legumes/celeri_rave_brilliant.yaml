# Fiche plante — celeri_rave_brilliant.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: celeri_rave_brilliant
version_fiche: 1
categorie: legume
sous_type: legume_racine
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Apium graveolens var. rapaceum 'Brilliant'
famille_botanique: Apiaceae

i18n:
  fr:
    nom_commun: Céleri-rave Brilliant
    noms_alternatifs: [Céléri-rave Brillant]
    description: >
      Variété productive à gros bulbe rond très régulier (600 g–1,2 kg), peau
      lisse, chair blanche fine et parfumée. L'une des meilleures variétés
      pour sa régularité et sa résistance aux maladies. Saveur de céleri
      prononcée mais pas agressive. Bonne conservation hivernale.
    conseils_culture: >
      Semer en intérieur très tôt (février) : cycle très long. Repiquer après
      les gelées dans un sol très riche et toujours humide — le céleri-rave
      ne supporte pas la sécheresse. Enlever les feuilles latérales pour
      favoriser le développement du bulbe. Ne pas enterrer le collet.
    conseils_recolte: >
      Récolter de septembre à décembre selon les besoins. Se conserve très
      bien en terre sous paillis en régions douces.
    erreurs_frequentes:
      - Manque d'eau constant (bulbe dur et creux)
      - Semis trop tardif (bulbe trop petit)
      - Collet trop enterré (pourriture)
  en:
    nom_commun: Brilliant Celeriac
    description: >
      Productive variety with a large, very regular round bulb (600 g–1.2 kg),
      smooth skin, fine white flesh with good celery flavor. One of the best
      varieties for its regularity and disease resistance.

besoins:
  ensoleillement: plein_soleil
  arrosage: eleve
  qualites_sol:
    - riche
    - frais
    - bien_draine
  ph_min: 6.0
  ph_max: 7.0
  temperature_min_germination: 15
  temperature_optimale: 18

cycle:
  type: bisannuelle
  duree_germination_jours: [14, 21]
  duree_avant_recolte_jours: [180, 240]
  hauteur_adulte_cm: [40, 60]
  espacement_cm: 35
  profondeur_semis_cm: 1

periodes:
  hemisphere_nord:
    oceanique:
      semis_interieur: [2, 3]
      plantation: [5, 6]
      recolte: [9, 12]
    continental:
      semis_interieur: [2, 3]
      plantation: [5, 6]
      recolte: [9, 11]
    mediterraneen:
      semis_interieur: [1, 2]
      plantation: [4, 5]
      recolte: [8, 11]
  hemisphere_sud:
    oceanique:
      semis_interieur: [8, 9]
      plantation: [11, 12]
      recolte: [3, 6]

associations:
  beneficies:
    - id: poireau
      raison_i18n: { fr: "Association classique, mêmes besoins en eau", en: "Classic companion, same water needs" }
    - id: laitue
      raison_i18n: { fr: "Bon usage de l'espace en début de culture", en: "Good space use at the start of the season" }
  defavorables:
    - id: persil
      raison_i18n: { fr: "Même famille Apiaceae, mêmes maladies et ravageurs", en: "Same Apiaceae family, same diseases and pests" }
rotation:
  famille: apiaceae
  delai_retour_annees: 3
  precedents_favorables: [legumineuses, cucurbitaceae]
  precedents_defavorables: [apiaceae]

conservation:
  - methode: frais
    duree_mois: 4
    conditions_i18n: { fr: "Cave fraîche (0–5 °C) dans du sable humide", en: "Cool cellar (0–5 °C) in damp sand" }
  - methode: congelation
    duree_mois: 12
    conditions_i18n: { fr: "Cuire ou blanchir avant congélation", en: "Cook or blanch before freezing" }
utilisations_culinaires_i18n:
  fr: [Rémoulade, soupe, gratin, vapeur, rôti, purée, en pot-au-feu]
  en: [Rémoulade, soup, gratin, steamed, roasted, purée, pot-au-feu]

sources:
  - https://fr.wikipedia.org/wiki/C%C3%A9leri-rave
contributeurs:
  - "@potagerer"

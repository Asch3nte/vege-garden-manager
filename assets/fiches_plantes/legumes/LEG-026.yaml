# Fiche mère (espèce) — Fève.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Légumineuse rustique fixatrice d'azote. Lot « potagères courantes ».
id: LEG-026
version_fiche: 1
categorie: legume
sous_type: legume_fruit
schema_version: 1
difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone6
nom_scientifique: Vicia faba
famille_botanique: Fabaceae

i18n:
  fr:
    nom_commun: Fève
    noms_alternatifs: [Fève des marais, Gourgane]
    description: >
      Légumineuse annuelle de la famille des Fabacées, cultivée pour ses grosses
      graines consommées fraîches ou sèches. Très rustique, elle fixe l'azote de
      l'air et enrichit le sol. Ses sommités attirent les pucerons noirs, qu'on
      peut étêter pour protéger le reste de la culture.
    conseils_culture: >
      Semer en place, en sol frais et bien drainé, en fin d'hiver ou à l'automne
      sous climat doux. Butter les jeunes plants et pincer les têtes dès
      l'apparition des premières fleurs et des pucerons noirs.
    conseils_recolte: >
      Récolter les gousses jeunes pour une consommation fraîche, ou attendre le
      dessèchement pour les graines sèches.
    erreurs_frequentes:
      - Semis en sol détrempé (pourriture des graines)
      - Absence d'étêtage (invasion de pucerons noirs)
  en:
    nom_commun: Broad bean
    description: >
      Hardy annual legume of the Fabaceae family, grown for its large seeds eaten
      fresh or dried. It fixes atmospheric nitrogen and enriches the soil.


i18n:
  fr:
    nom_commun: Piment aji
    noms_alternatifs: [Capsicum baccatum, Aji, Piment péruvien]
    description: >
      Espèce andine, pilier des cuisines péruvienne et bolivienne, où « ají »
      désigne le piment en général. Elle se reconnaît immédiatement à ses fleurs
      blanches marquées de taches jaune-vert à la gorge, caractère unique dans le
      genre. Port très vigoureux et élancé, pouvant dépasser 1,50 m et prendre un
      aspect de petit arbuste. Piquant moyen à élevé (30 000 à 50 000 SHU pour
      l'aji amarillo) associé à un net arôme fruité, souvent décrit comme abricoté
      ou citronné, qui fait toute la valeur culinaire de l'espèce.
    conseils_culture: >
      Cycle long et besoins de chaleur proches de ceux du habanero : semis en
      janvier-février au chaud, culture sous abri conseillée au nord de la Loire.
      Prévoir de la place et un tuteur : sa vigueur et sa hauteur en font la plus
      encombrante des quatre espèces cultivées, mal adaptée aux petits pots.
      Vivace, elle se conserve d'une année sur l'autre hors gel et devient alors
      très productive.
    conseils_recolte: >
      Récolter à pleine coloration, généralement orange vif à rouge selon la
      variété : c'est à ce stade que l'arôme fruité, principal intérêt de
      l'espèce, est développé. Les fruits, allongés et charnus, se prêtent bien à
      la purée et au séchage.
    erreurs_frequentes:
      - Ne pas prévoir la place ni le tuteurage (plants de 1,50 m qui versent)
      - Récolter avant pleine maturité (arôme fruité absent, seul le piquant reste)
      - Semis tardif (fruits encore verts aux premières gelées)
  en:
    nom_commun: Aji pepper
    noms_alternatifs: [Capsicum baccatum, Peruvian pepper]
    description: >
      Andean species central to Peruvian and Bolivian cooking, recognisable by
      its white flowers spotted yellow-green in the throat — unique in the genus.
      Very vigorous, often over 1.5 m, with medium to high heat and a distinct
      fruity, apricot-like aroma.


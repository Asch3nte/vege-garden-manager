nom_scientifique: Asparagus officinalis
famille_botanique: Asparagaceae

i18n:
  fr:
    nom_commun: Asperge
    noms_alternatifs: [Asperge officinale]
    description: >
      Plante vivace de la famille des Asparagacées, cultivée pour ses jeunes
      pousses (turions) récoltées au printemps. Culture de longue haleine : une
      aspergeraie s'installe pour dix à quinze ans mais ne produit qu'à partir de
      la troisième année.
    conseils_culture: >
      Planter les griffes au printemps dans une tranchée profonde, en sol léger,
      profond et bien drainé. Ne pas récolter les deux premières années pour
      laisser les griffes se renforcer. Butter pour les asperges blanches.
    conseils_recolte: >
      Couper les turions à la base quand ils atteignent 15–20 cm, au printemps,
      pendant six à huit semaines, à partir de la troisième année.
    erreurs_frequentes:
      - Récolte trop précoce (griffes épuisées, aspergeraie ruinée)
      - Sol lourd et humide (pourriture des griffes)
      - Récolte prolongée trop tard en saison (plante affaiblie)
  en:
    nom_commun: Asparagus
    description: >
      Perennial of the Asparagaceae family, grown for its young spears harvested
      in spring. A long-term crop: a bed lasts 10–15 years but only produces from
      the third year.


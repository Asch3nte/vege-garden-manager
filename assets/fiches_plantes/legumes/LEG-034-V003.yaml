# Fiche fille (variété) — Céleri branche Doré Chemin. Hérite de LEG-034.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-034-V003
parent_id: LEG-034
version_fiche: 1
schema_version: 1

nom_scientifique: "Apium graveolens var. dulce 'Doré Chemin'"

i18n:
  fr:
    nom_commun: Céleri branche Doré Chemin
    noms_alternatifs: [Doré Chemin]
    description: >
      Céleri à côtes dorées légèrement autoblanchissantes, tendres et douces,
      demandant peu ou pas de blanchiment. Variété appréciée pour sa facilité et
      sa saveur fine et peu amère.
  en:
    nom_commun: Doré Chemin Celery
    description: >
      Celery with golden, slightly self-blanching ribs, tender and mild, needing
      little or no blanching. Valued for ease and a fine, low-bitterness flavour.
conservation:
  - methode: frais
    duree_jours: 12
    conditions_i18n: { fr: "Réfrigérateur, pieds dans un peu d'eau", en: "Refrigerator, stalks in a little water" }
utilisations_culinaires_i18n:
  fr: [Cru en salade, braisé, en soupe, en mirepoix]
  en: [Raw in salad, braised, in soup, mirepoix]

sources:
  - https://fr.wikipedia.org/wiki/C%C3%A9leri
contributeurs:

i18n:
  fr:
    nom_commun: Laitue
    noms_alternatifs: [Salade]
    description: >
      Légume-feuille annuel de la famille des Astéracées, à cycle court, cultivé
      pour ses feuilles tendres consommées en salade. Apprécie la fraîcheur.
    conseils_culture: >
      Semer ou repiquer en sol frais, arroser régulièrement pour éviter la
      montaison. Échelonner les semis pour récolter en continu.
    conseils_recolte: >
      Récolter le matin, la pomme bien formée, avant la montée à graines.
    erreurs_frequentes:
      - "Manque d'eau ou forte chaleur (montaison prématurée)"
      - Semis trop profond (lève mal)
  en:
    nom_commun: Lettuce
    description: >
      A short-cycle annual leaf vegetable of the Asteraceae family, mostly eaten
      raw in salads.


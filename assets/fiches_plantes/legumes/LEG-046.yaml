i18n:
  fr:
    nom_commun: Oseille
    noms_alternatifs: [Oseille commune, Grande oseille, Surelle]
    description: >
      Plante vivace de la famille des Polygonacées, cultivée pour ses feuilles
      au goût acidulé (soupes, sauces, poissons). Rustique et facile, elle
      repousse plusieurs années à la même place.
    conseils_culture: >
      Semer ou planter en sol frais, au soleil ou à mi-ombre. Supprimer les
      hampes florales pour prolonger la production de feuilles tendres. Diviser
      la touffe tous les trois à quatre ans.
    conseils_recolte: >
      Cueillir les feuilles jeunes au fur et à mesure des besoins, du printemps à
      l'automne.
    erreurs_frequentes:
      - Laisser monter à graines (feuilles rares et coriaces)
      - Sol sec (feuilles petites et très acides)
  en:
    nom_commun: Sorrel
    description: >
      Perennial of the Polygonaceae family, grown for its tart leaves. Hardy and
      easy, it regrows for several years in the same spot.


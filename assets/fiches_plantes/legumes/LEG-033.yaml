i18n:
  fr:
    nom_commun: Panais
    noms_alternatifs: [Grand chervis]
    description: >
      Légume-racine bisannuel de la famille des Apiacées, cultivé pour sa racine
      charnue au goût doux et sucré, proche de la carotte. Très rustique, il se
      bonifie avec le froid et se conserve en terre tout l'hiver.
    conseils_culture: >
      Semer en place au printemps en sol profond, meuble et sans cailloux, avec
      des graines fraîches (elles perdent vite leur pouvoir germinatif). La levée
      est lente ; garder le sol humide jusqu'à l'apparition des plants.
    conseils_recolte: >
      Arracher les racines à partir de l'automne, au fur et à mesure des besoins.
      Une gelée avant récolte améliore la saveur.
    erreurs_frequentes:
      - Graines trop vieilles (levée très irrégulière)
      - Sol caillouteux (racines fourchues)
      - Semis en sol sec (échec de la levée lente)
  en:
    nom_commun: Parsnip
    description: >
      Biennial root vegetable of the Apiaceae family, grown for its sweet,
      carrot-like root. Very hardy; it sweetens with cold and keeps in the ground
      all winter.


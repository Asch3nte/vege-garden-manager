  - alimentaire

rusticite:
  zone_min: zone6
nom_scientifique: Cynara cardunculus
famille_botanique: Asteraceae

i18n:
  fr:
    nom_commun: Artichaut
    noms_alternatifs: [Artichaut commun]
    description: >
      Plante vivace de la famille des Astéracées cultivée pour ses capitules
      floraux (têtes) charnus, consommés comme légume avant floraison.
    conseils_culture: >
      Planter des éclats de pied au printemps. Sol profond, riche, bien drainé.
      Pailler copieusement en automne pour protéger les souches du gel.
      Supprimer les tiges florales secondaires pour concentrer la sève sur les
      capitules principaux. Renouveler les pieds tous les 3–5 ans.
    conseils_recolte: >
      Récolter les capitules avant que les bractées s'ouvrent, encore serrées et
      fermes. Couper à 10 cm de tige. La récolte principale a lieu en mai–juin,
      avec parfois une seconde en automne.
    erreurs_frequentes:
      - Plantation sans paillage hivernal (gèle des souches)
      - Sol trop pauvre (capitules petits)
      - 'Récolte tardive (bractées ouvertes, cœur dur)'
  en:
    nom_commun: Artichoke
    description: >
      A perennial thistle (Asteraceae) cultivated for its edible flower heads.


# Fiche mère (espèce) — Tomate.
# Taxonomie & description : tool/scrap_fiche.dart (GBIF × Wikidata × Wikipédia).
# Agronomie généralisée depuis la variété + références. Généré (Lot 3), relu.
id: LEG-001
version_fiche: 1
categorie: legume
sous_type: legume_fruit
schema_version: 1
difficulte: 2
usages:
  - alimentaire

rusticite:
  zone_min: zone9
nom_scientifique: Solanum lycopersicum
famille_botanique: Solanaceae

i18n:
  fr:
    nom_commun: Tomate
    noms_alternatifs: [Pomme d'amour]
    description: >
      Plante annuelle de la famille des Solanacées, cultivée pour ses fruits
      charnus consommés comme légumes-fruits, crus ou cuits. Gourmande en
      chaleur, en soleil et en sol riche.
    conseils_culture: >
      Tuteurer dès la plantation. Arroser au pied, jamais sur le feuillage (le
      mildiou se développe sur les feuilles humides). Pailler pour garder le sol
      frais et espacer les arrosages.
    conseils_recolte: >
      Récolter à pleine maturité, quand le fruit est ferme et bien coloré.
    erreurs_frequentes:
      - Arrosage du feuillage (favorise le mildiou)
      - Plantation trop précoce (sensible au gel)
      - Manque de tuteurage (tiges cassantes sous le poids des fruits)
  en:
    nom_commun: Tomato
    description: >
      Annual plant of the Solanaceae family, grown for its fleshy fruit eaten as
      a vegetable, raw or cooked.

besoins:
  ensoleillement: plein_soleil
  arrosage: eleve
  qualites_sol:
    - riche
    - bien_draine
    - frais
  ph_min: 6.0
  ph_max: 7.0
  ensoleillement_min: mi_ombre
  temperature_min_germination: 18
  temperature_optimale: 22
  temperature_min_survie: 5
  gele_fatal: true
  arrosage_detaille:
    phases_sensibles:
      - floraison
      - fructification
    note_i18n:
      fr: >-
        Arrosez régulièrement au pied, sans à-coups : une irrigation irrégulière
        pendant la nouaison et le grossissement des fruits favorise la nécrose
        apicale (« cul noir ») et l'éclatement. Évitez de mouiller le feuillage
        et paillez pour lisser l'humidité du sol.

  - alimentaire

rusticite:
  zone_min: zone3
nom_scientifique: Spinacia oleracea
famille_botanique: Amaranthaceae

i18n:
  fr:
    nom_commun: Épinard
    description: >
      Plante potagère annuelle de la famille des Amaranthacées, cultivée pour
      ses feuilles tendres consommées comme légume, crues ou cuites.
    conseils_culture: >
      Semer en place de août à octobre pour une récolte automnale et hivernale.
      Sol riche en azote mais bien drainé. Éviter les semis estivaux : la
      chaleur et les jours longs provoquent la montaison rapide.
    conseils_recolte: >
      Cueillir les feuilles externes dès qu'elles sont bien formées, en laissant
      le cœur intact pour une production continue. Éviter de récolter sous le
      gel.
    erreurs_frequentes:
      - Semis en plein été (montaison immédiate)
      - Sol acide (croissance chétive)
      - "Manque d'azote (feuilles petites et pâles)"
  en:
    nom_commun: Spinach
    description: >
      A leafy green of the Amaranthaceae family eaten fresh or cooked.


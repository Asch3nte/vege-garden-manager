usages:
  - alimentaire

rusticite:
  zone_min: zone9
nom_scientifique: Cucurbita maxima
famille_botanique: Cucurbitaceae

i18n:
  fr:
    nom_commun: Potimarron
    noms_alternatifs: [Potiron doux]
    description: >
      Groupe de cultivars de courge (Cucurbita maxima) à chair dense et saveur
      de châtaigne, consommée comme légume à maturité.
    conseils_culture: >
      Semer sous abri 3 semaines avant le repiquage. Planter dans des buttes
      enrichies en compost. Pincer les tiges principales à 4–5 feuilles au-delà
      du dernier fruit fixé pour concentrer la sève. Pailler abondamment pour
      conserver l'humidité.
    conseils_recolte: >
      Attendre que la tige se liège et brunisse avant de couper. Laisser sécher
      2 semaines à l'air dans un endroit sec avant la mise en conservation.
    erreurs_frequentes:
      - Arrosage excessif (pourriture du collet)
      - Sol pauvre (fruits petits et peu sucrés)
      - Récolte avant maturité complète (mauvaise conservation)
  en:
    nom_commun: Kuri squash
    description: >
      A Cucurbita maxima cultivar group with dense, chestnut-flavored flesh.


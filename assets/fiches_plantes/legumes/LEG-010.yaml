# Taxonomie & description : tool/scrap_fiche.dart (GBIF × Wikidata × Wikipédia).
# Agronomie généralisée depuis la variété + références. Généré (Lot 3), relu.
id: LEG-010
version_fiche: 1
categorie: legume
sous_type: legume_fruit
schema_version: 1
difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone9
nom_scientifique: Cucurbita moschata
famille_botanique: Cucurbitaceae

i18n:
  fr:
    nom_commun: Courge musquée
    noms_alternatifs: [Butternut]
    description: >
      Espèce de courge de la famille des Cucurbitacées, cultivée pour son fruit
      à chair musquée consommé à maturité ; tolère bien la chaleur humide.
    conseils_culture: >
      Semer sous abri 3 semaines avant la mise en place. Planter dans des buttes
      enrichies en compost mûr. Laisser courir les tiges sur le sol ou sur un
      filet pour économiser la place. Pailler abondamment pour conserver
      l'humidité et freiner les adventices.
    conseils_recolte: >
      Récolter quand la tige se liège : couper avec 5 cm de pédoncule pour
      améliorer la conservation. Laisser sécher 2–3 semaines à l'air sec.
    erreurs_frequentes:
      - Récolte trop précoce (chair pas sucrée)
      - Stockage sans séchage préalable (pourriture)
      - Manque de pollinisateurs (mauvaise nouaison)
  en:
    nom_commun: Butternut squash
    description: >
      A Cucurbita moschata squash grown for its sweet, musky flesh; tolerant of
      hot, humid weather.


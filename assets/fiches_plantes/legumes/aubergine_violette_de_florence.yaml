  duree_germination_jours: [10, 18]
  duree_avant_recolte_jours: [75, 100]
  hauteur_adulte_cm: [60, 100]
  espacement_cm: 60
  profondeur_semis_cm: 1

periodes:
  hemisphere_nord:
    oceanique:
      semis_interieur: [2, 3]
      plantation: [5, 6]
      recolte: [7, 10]
    continental:
      semis_interieur: [2, 3]
      plantation: [5, 6]
      recolte: [7, 10]
    mediterraneen:

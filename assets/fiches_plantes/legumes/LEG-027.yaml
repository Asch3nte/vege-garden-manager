# Fiche mère (espèce) — Échalote.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Légume-bulbe alliacé, répulsif. Lot « potagères courantes ».
id: LEG-027
version_fiche: 1
categorie: legume
sous_type: legume_bulbe
schema_version: 1
difficulte: 1
usages:
  - alimentaire
  - condimentaire
  - repulsif

rusticite:
  zone_min: zone5
nom_scientifique: Allium cepa var. aggregatum
famille_botanique: Amaryllidaceae

i18n:
  fr:
    nom_commun: Échalote
    noms_alternatifs: [Échalote traditionnelle, Échalote grise]
    description: >
      Légume-bulbe de la famille des Amaryllidacées, proche de l'oignon, cultivé
      pour ses bulbes en gousses au goût fin. Planté par bulbes. Ses composés
      soufrés aident à brouiller les odeurs et à éloigner certains ravageurs des
      cultures voisines, notamment la mouche de la carotte.
    conseils_culture: >
      Planter les bulbes en sol léger, bien drainé et non fumé récemment, pointe
      affleurante. Éviter les excès d'eau. Ne pas cultiver près des légumineuses.
    conseils_recolte: >
      Arracher quand le feuillage jaunit et se couche, par temps sec, puis faire
      sécher les bulbes à l'air avant stockage.
    erreurs_frequentes:
      - Sol humide et fraîchement fumé (pourriture des bulbes)
      - Plantation trop profonde
  en:
    nom_commun: Shallot
    description: >
      Bulb vegetable of the Amaryllidaceae family, close to the onion, grown from
      bulbs for its finely flavoured clustered bulbs.


i18n:
  fr:
    nom_commun: Piment habanero
    noms_alternatifs: [Capsicum chinense, Piment antillais, Piment-bonnet]
    description: >
      Espèce des Caraïbes et du bassin amazonien — son épithète chinense est une
      erreur historique de son descripteur, elle n'a rien de chinois. Elle
      rassemble les piments les plus forts du monde, du habanero classique
      (100 000 à 350 000 SHU) au Carolina Reaper (plus de 1 500 000 SHU), mais
      aussi des variétés sans piquant comme l'aji dulce. Fruits typiquement
      lanternés ou fripés, à la peau fine, portés par plusieurs fleurs par nœud.
      Son parfum fruité et floral, très reconnaissable, la distingue autant que
      sa force.
    conseils_culture: >
      La plus exigeante des espèces de Capsicum sous climat tempéré : germination
      lente et capricieuse (jusqu'à 4 semaines à 25–28 °C), cycle long de 100 à
      140 jours. Semer dès janvier-février avec chaleur de fond, et prévoir une
      serre, une véranda ou un mur exposé au sud — en plein champ au nord de la
      Loire, les fruits n'ont souvent pas le temps de mûrir. Rentrer un pied en
      pot l'hiver permet de le conserver plusieurs années : la plante est vivace
      et produit bien mieux en deuxième année.
    conseils_recolte: >
      Attendre la coloration complète : un habanero vert n'a ni son arôme fruité
      ni son plein piquant. Gants obligatoires — la capsaïcine de cette espèce
      reste sur la peau et brûle plusieurs heures. Ne jamais broyer ces piments
      sans ventilation, les vapeurs sont irritantes.
    erreurs_frequentes:
      - Semer trop tard (cycle trop long, aucune récolte mûre avant les gelées)
      - Attendre les mêmes délais qu'un piment annuum (germination et maturation bien plus lentes)
      - Manipuler à mains nues (brûlures durables, accidents oculaires)
      - Jeter le pied à l'automne (rentré hors gel, il produit davantage l'année suivante)
  en:
    nom_commun: Habanero pepper
    noms_alternatifs: [Capsicum chinense, Bonnet pepper]
    description: >
      Caribbean and Amazonian species — the epithet chinense is a historical
      mistake, it is not Chinese. It holds the world's hottest chillies as well
      as heatless ones like aji dulce, and is recognisable by its fruity, floral
      aroma. Slow to germinate and long to ripen.


# Fiche mère (espèce) — Piment (Capsicum annuum).
# Arbitrage 2026-08-16 : une fiche mère par espèce botanique de Capsicum.
# Le poivron doux, également C. annuum, garde sa fiche distincte (LEG-019) :
# usage culinaire et conduite assez éloignés pour être cherchés séparément.

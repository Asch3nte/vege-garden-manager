conservation:
  - methode: sechage
    duree_mois: 24
    conditions_i18n: { fr: "Enfilés en chapelet (ristra) et suspendus dans un local sec et aéré — méthode traditionnelle basque et mexicaine", en: "Threaded into a ristra and hung in a dry airy room — the traditional Basque and Mexican method" }
  - methode: congelation
    duree_mois: 12
    conditions_i18n: { fr: "Entiers, sans blanchiment ; la texture se ramollit mais le piquant est intact", en: "Whole, without blanching; texture softens but heat is unaffected" }
  - methode: conserves
    duree_mois: 12
    conditions_i18n: { fr: "Au vinaigre ou à l'huile, après stérilisation", en: "In vinegar or oil, after sterilising" }
  - methode: frais
    duree_jours: 14

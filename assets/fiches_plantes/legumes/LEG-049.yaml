    - id: FLE-003
      type: plante_piege
      raison_i18n: { fr: "L'œillet d'Inde détourne les nématodes et les pucerons des solanacées", en: "French marigold diverts nematodes and aphids from nightshades" }
    - id: LEG-004
      raison_i18n: { fr: "Voisinage favorable : enracinements complémentaires, pas de concurrence directe", en: "Favourable neighbour: complementary rooting, no direct competition" }
    - id: ARO-008
      type: repulsion_ravageur
      raison_i18n: { fr: "Le romarin gêne plusieurs ravageurs par son odeur camphrée", en: "Rosemary hampers several pests with its camphor scent" }
  defavorables:
    - id: LEG-024
      type: allelopathie

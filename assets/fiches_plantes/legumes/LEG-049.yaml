i18n:
  fr:
    nom_commun: Piment
    noms_alternatifs: [Piment fort, Piment doux, Chile]
    description: >
      Espèce de loin la plus cultivée du genre Capsicum : elle rassemble la
      quasi-totalité des piments du bassin méditerranéen et du Mexique, du
      piment d'Espelette au jalapeño en passant par le cayenne. Plante buissonnante
      annuelle sous nos climats (vivace dans son aire d'origine), de 50 à 90 cm,
      à fleurs blanches solitaires. Le piquant, dû à la capsaïcine concentrée dans
      les placentas blancs qui portent les graines, se mesure en unités Scoville
      (SHU) et va, chez cette seule espèce, du quasi nul (piquillo, 500 SHU) au
      très relevé (cayenne, 50 000 SHU).
    conseils_culture: >
      Semer au chaud (22–25 °C) de février à mars, la germination étant lente et
      exigeante en chaleur : sans tapis chauffant ou pièce à 22 °C, les levées
      sont très irrégulières. Repiquer en pleine terre seulement quand les nuits
      dépassent 12 °C, mi-mai à juin. Sol riche, drainé, plein soleil et
      situation abritée. Arroser régulièrement sans détremper. Un stress hydrique
      ou thermique augmente le piquant — utile ou non selon l'usage recherché.
      Excellent en pot de 10 L sur une terrasse chaude.
    conseils_recolte: >
      Cueillir vert pour un goût plus végétal et un piquant moindre, ou attendre
      la coloration complète (rouge, jaune, chocolat selon variété) pour le
      maximum de saveur et de capsaïcine. La récolte régulière stimule la
      production. Porter des gants pour manipuler les variétés fortes, et ne
      jamais se toucher les yeux après.
    erreurs_frequentes:
      - Semis dans une pièce trop fraîche (germination erratique ou nulle sous 18 °C)
      - Repiquage trop précoce en sol froid (plant bloqué pour toute la saison)
      - Excès d'azote (feuillage abondant, peu de fruits)
      - Manipuler les variétés fortes sans gants (brûlures durables aux mains et aux yeux)
  en:
    nom_commun: Chilli pepper
    noms_alternatifs: [Chile, Hot pepper]
    description: >
      By far the most widely grown Capsicum species, covering nearly all
      Mediterranean and Mexican chillies from Espelette to jalapeño and cayenne.
      Heat, from capsaicin in the white placenta, ranges within this one species
      from almost none to distinctly hot.


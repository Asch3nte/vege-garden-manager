# Fiche fille (variété) — Bette à cardes rouges (Rhubarb Chard). Hérite de LEG-029.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-029-V003
parent_id: LEG-029
version_fiche: 1
schema_version: 1

nom_scientifique: "Beta vulgaris var. cicla 'Rhubarb Chard'"

i18n:
  fr:
    nom_commun: Bette à cardes rouges
    noms_alternatifs: [Rhubarb Chard, à carde rouge, Rouge de Rhubarbe]
    description: >
      Bette à cardes rouge vif et feuilles vert sombre nervurées de rouge, très
      décorative. Saveur légèrement plus prononcée que la blanche ; feuilles et
      cardes se cuisinent séparément. Rustique et productive.
  en:
    nom_commun: Rhubarb Chard
    description: >
      Chard with bright-red ribs and dark-green red-veined leaves, very decorative.
      Slightly stronger flavour than white chard; ribs and greens cooked separately.
conservation:
  - methode: frais
    duree_jours: 5
    conditions_i18n: { fr: "Réfrigérateur, bac à légumes", en: "Refrigerator, crisper drawer" }
utilisations_culinaires_i18n:
  fr: [Vert en branche/en gratin, cardes en gratin, en poêlée]
  en: [Greens sautéed/gratin, ribs in gratin, stir-fried]

sources:
  - https://fr.wikipedia.org/wiki/Bette_(plante)
contributeurs:
  - "@potagerer"

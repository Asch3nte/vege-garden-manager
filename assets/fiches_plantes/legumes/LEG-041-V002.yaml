# Fiche fille (variété) — Pastèque Crimson Sweet. Hérite de LEG-041.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-041-V002
parent_id: LEG-041
version_fiche: 1
schema_version: 1

nom_scientifique: "Citrullus lanatus 'Crimson Sweet'"

i18n:
  fr:
    nom_commun: Pastèque Crimson Sweet
    noms_alternatifs: [Crimson Sweet]
    description: >
      Grosse pastèque ronde à écorce vert clair rayée de vert foncé, à chair
      rouge vif très sucrée et peu de pépins. Productive et savoureuse ; demande
      une bonne saison chaude pour atteindre sa taille (6–10 kg).
  en:
    nom_commun: Crimson Sweet Watermelon
    description: >
      Large round watermelon with light-green rind striped dark green and very
      sweet bright-red flesh with few seeds. Productive and tasty; needs a good
      warm season (6–10 kg).

conservation:
  - methode: frais
    duree_jours: 12
    conditions_i18n: { fr: "Frais et sombre entier ; réfrigérateur une fois coupé", en: "Cool and dark whole; refrigerator once cut" }
utilisations_culinaires_i18n:
  fr: [Crue en tranches, en salade de fruits, en jus]
  en: [Raw in slices, in fruit salad, juiced]

sources:
  - https://fr.wikipedia.org/wiki/Past%C3%A8que
contributeurs:
  - "@potagerer"

i18n:
  fr:
    nom_commun: Cresson alénois
    noms_alternatifs: [Cresson de jardin, Passerage cultivée]
    description: >
      Petite plante condimentaire annuelle de la famille des Brassicacées, à
      croissance extrêmement rapide, cultivée pour ses jeunes feuilles au goût
      piquant. Se sème toute l'année, y compris en intérieur.
    conseils_culture: >
      Semer dense en surface, sur sol frais ou sur substrat humide, à la lumière.
      Récolter très jeune. Échelonner les semis pour une production continue.
    conseils_recolte: >
      Couper les jeunes pousses aux ciseaux dès 10–15 cm, environ deux à trois
      semaines après le semis.
    erreurs_frequentes:
      - Substrat qui se dessèche (levée et pousses irrégulières)
      - Récolte trop tardive (goût âcre, tiges dures)
  en:
    nom_commun: Garden cress
    description: >
      Very fast-growing annual seasoning plant of the Brassicaceae family, grown
      for its peppery young leaves. Sown year-round, including indoors.


# Fiche mère (espèce) — Piment oiseau (Capsicum frutescens).
# Arbitrage 2026-08-16 : une fiche mère par espèce botanique de Capsicum.
id: LEG-051
varietes_connues:
  - LEG-051-V001
  - LEG-051-V002
version_fiche: 1
categorie: legume
sous_type: legume_fruit
schema_version: 1
difficulte: 3
usages:
  - alimentaire
  - condimentaire
  - ornementale

rusticite:
  zone_min: zone10

nom_scientifique: Capsicum frutescens
famille_botanique: Solanaceae

i18n:
  fr:
    nom_commun: Piment oiseau
    noms_alternatifs: [Capsicum frutescens, Piment enragé, Malagueta, Piment-café]
    description: >
      Espèce tropicale au port buissonnant très ramifié, portant de très petits
      fruits allongés, dressés vers le ciel — d'où leur consommation par les
      oiseaux, qui ne perçoivent pas la capsaïcine et en dispersent les graines,
      à l'origine du nom. Piquant élevé et franc, de 50 000 à 100 000 SHU, sans
      la note fruitée des habaneros. C'est l'espèce du tabasco et des piments de
      table antillais et réunionnais. Plante réellement vivace et ligneuse à la
      base, qui peut vivre plusieurs années hors gel.
    conseils_culture: >
      Mêmes exigences de chaleur que le habanero : semis précoce à 25 °C, culture
      sous abri au nord de la Loire. Sa ramification très dense en fait un
      excellent sujet de pot, décoratif par ses fruits dressés colorés. Tailler
      légèrement à la sortie de l'hiver sur les pieds conservés. La production
      s'étale longuement, avec des fruits à tous les stades sur le même plant.
    conseils_recolte: >
      Récolter au fur et à mesure de la coloration, les fruits mûrissant de façon
      échelonnée. Très petits, ils se sèchent entiers sans préparation. Gants
      recommandés malgré leur taille.
    erreurs_frequentes:
      - Sous-estimer le piquant à cause de la petite taille des fruits
      - Culture en extérieur non abrité au nord (cycle trop long pour mûrir)
      - Jeter le pied en fin de saison (vivace ligneux, très productif en 2e année)
  en:
    nom_commun: Bird's eye chilli
    noms_alternatifs: [Capsicum frutescens, Malagueta]
    description: >
      Tropical, densely branched species with tiny upward-pointing fruits eaten
      and spread by birds, which do not perceive capsaicin. Sharply hot without
      the fruity note of habaneros — the species behind Tabasco sauce.


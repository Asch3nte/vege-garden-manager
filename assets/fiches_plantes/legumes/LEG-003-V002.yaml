id: LEG-003-V002
parent_id: LEG-003
version_fiche: 1
schema_version: 1

nom_scientifique: "Beta vulgaris 'de Détroit'"

i18n:
  fr:
    nom_commun: Betterave de Détroit
    noms_alternatifs: [de Détroit, Détroit améliorée, Noire plate d'Égypte]
    description: >
      Betterave potagère ronde rouge foncé, à chair uniforme sucrée sans anneaux
      marqués. Variété de référence, productive et de bonne conservation ; c'est
      la betterave rouge classique du potager.
  en:
    nom_commun: Detroit Beetroot
    description: >
      Round dark-red beetroot with uniform, sweet flesh and no marked rings. A
      reference variety, productive and a good keeper; the classic red beet.
conservation:

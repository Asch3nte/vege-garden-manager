# Fiche fille (variété) — Tomate Brandywine. Hérite de LEG-001.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-001-V017
parent_id: LEG-001
version_fiche: 1
schema_version: 1

nom_scientifique: "Solanum lycopersicum 'Brandywine'"

i18n:
  fr:
    nom_commun: Tomate Brandywine
    noms_alternatifs: [Brandywine rose]
    description: >
      Variété ancienne américaine à gros fruits rose-rouge, à chair fondante et
      au goût riche, réputée l'une des meilleures. Plant indéterminé à feuillage
      de pomme de terre ; peu productif mais savoureux, plutôt tardif.
  en:
    nom_commun: Brandywine Tomato
    description: >
      Old American variety with large pink-red fruits, melting flesh and a rich
      flavour, rated among the best. Potato-leaf indeterminate plant; low-yielding
      but flavourful, rather late.

conservation:
  - methode: frais
    duree_jours: 5
    conditions_i18n: { fr: "Température ambiante, à l'abri de la lumière", en: "Room temperature, away from light" }
utilisations_culinaires_i18n:
  fr: [Crue en salade, en tranches, farcie]
  en: [Raw in salad, in slices, stuffed]

sources:
  - https://fr.wikipedia.org/wiki/Tomate
contributeurs:
  - "@potagerer"

# Fiche plante — radis_cherry_belle.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: radis_cherry_belle
version_fiche: 1
categorie: legume
sous_type: legume_racine
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Raphanus sativus 'Cherry Belle'
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Radis Cherry Belle
    description: >
      Variété de référence mondiale à petit radis rond parfaitement sphérique,
      rouge vif, chair blanche croquante et douce, peu piquante. Cycle
      ultra-court (20–25 jours). Idéal pour initier les enfants au jardinage
      et pour les semis échelonnés tout au long de la saison fraîche.
    conseils_culture: >
      Semer en place toutes les 2–3 semaines pour une récolte continue.
      Sol meuble, sans cailloux. Ne jamais laisser sécher le sol : les radis
      deviennent creux et piquants. Éviter les semis en plein été (montaison
      rapide, racines filandreuses).
    conseils_recolte: >
      Récolter dès que la racine mesure 2–3 cm de diamètre, sans attendre.
      Un radis trop gros est creux et piquant. Consommer rapidement après récolte.
    erreurs_frequentes:
      - Sol trop dense ou trop riche en azote (trop de feuilles, peu de racines)
      - Oubli de récolte (radis creux et épicés)
      - Semis en plein été (montaison, racines inutilisables)
  en:
    nom_commun: Cherry Belle Radish
    description: >
      World-reference variety with small, perfectly round, bright red radish,
      crisp and mild white flesh, barely spicy. Ultra-short cycle (20–25 days).

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:
    - leger
    - bien_draine
  ph_min: 6.0
  ph_max: 7.0
  temperature_min_germination: 8
  temperature_optimale: 15

cycle:
  type: annuelle
  duree_germination_jours: [3, 7]
  duree_avant_recolte_jours: [20, 30]
  hauteur_adulte_cm: [15, 30]
  espacement_cm: 5
  profondeur_semis_cm: 1

periodes:
  hemisphere_nord:
    oceanique:
      semis_exterieur: [3, 5]
      recolte: [4, 6]
    continental:
      semis_exterieur: [3, 5]
      recolte: [4, 6]
    mediterraneen:
      semis_exterieur: [2, 5]
      recolte: [3, 6]
  hemisphere_sud:
    oceanique:
      semis_exterieur: [9, 11]
      recolte: [10, 12]

associations:
  beneficies:
    - id: laitue
      raison_i18n: { fr: "Cycle court complémentaire, optimise l'espace", en: "Complementary short cycle, optimizes space" }
    - id: carotte
      raison_i18n: { fr: "Le radis ameublit le sol pour les carottes", en: "Radish loosens soil for carrots" }
  defavorables:
    - id: moutarde
      raison_i18n: { fr: "Même famille Brassicaceae, mêmes ravageurs", en: "Same Brassicaceae family, same pests" }
rotation:

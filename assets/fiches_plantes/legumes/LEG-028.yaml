# Fiche mère (espèce) — Mâche.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Salade d'hiver très rustique. Lot « potagères courantes ».
id: LEG-028
version_fiche: 1
categorie: legume
sous_type: legume_feuille
schema_version: 1
difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone5
nom_scientifique: Valerianella locusta
famille_botanique: Caprifoliaceae

i18n:
  fr:
    nom_commun: Mâche
    noms_alternatifs: [Doucette, Rampon, Salade de blé]
    description: >
      Petite salade annuelle de la famille des Caprifoliacées, cultivée pour ses
      rosettes de feuilles tendres récoltées en automne et en hiver. Très
      rustique, peu exigeante, idéale en culture de fin de saison après un
      légume d'été.
    conseils_culture: >
      Semer en place de la fin de l'été à l'automne, sur sol tassé et frais.
      La germination est meilleure à la fraîcheur ; arroser régulièrement tant
      que les températures restent douces.
    conseils_recolte: >
      Récolter les rosettes entières au couteau, au ras du sol, au fur et à
      mesure des besoins pendant tout l'hiver.
    erreurs_frequentes:
      - Semis trop tardif en sol sec (levée irrégulière)
      - Semis de printemps par forte chaleur (montée à graines rapide)
  en:
    nom_commun: Lamb's lettuce
    description: >
      Small annual salad of the Caprifoliaceae family, grown for its tender leaf
      rosettes harvested in autumn and winter. Very hardy and undemanding.


# Fiche fille (variété) — Pâtisson Blanc. Hérite de LEG-040.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-040-V001
parent_id: LEG-040
version_fiche: 1
schema_version: 1

nom_scientifique: "Cucurbita pepo 'Blanc'"

i18n:
  fr:
    nom_commun: Pâtisson Blanc
    noms_alternatifs: [Blanc, Bonnet de prêtre blanc]
    description: >
      Pâtisson classique en forme de soucoupe festonnée blanc crème, à chair
      blanche ferme et fine, proche de l'artichaut en goût. À récolter jeune pour
      une chair tendre ; devient décoratif à maturité.
  en:
    nom_commun: White Pattypan
    description: >
      Classic scalloped saucer-shaped pattypan, cream-white, with firm, fine
      white flesh close to artichoke in flavour. Harvest young for tender flesh.

conservation:
  - methode: frais
    duree_jours: 10
    conditions_i18n: { fr: "Réfrigérateur, tiroir à légumes", en: "Refrigerator, vegetable drawer" }
utilisations_culinaires_i18n:
  fr: [Vapeur, farci, en gratin, poêlé]
  en: [Steamed, stuffed, gratin, sautéed]

sources:
  - https://fr.wikipedia.org/wiki/P%C3%A2tisson
contributeurs:
  - "@potagerer"

i18n:
  fr:
    nom_commun: Chicorée witloof
    noms_alternatifs: [Endive, Chicon, Chicorée de Bruxelles]
    description: >
      Chicorée bisannuelle de la famille des Astéracées, cultivée en deux temps :
      une racine au potager en été, puis un forçage à l'obscurité en hiver qui
      produit le chicon blanc et croquant. Spécialité belge.
    conseils_culture: >
      Semer en pleine terre au début de l'été pour obtenir des racines saines.
      À l'automne, arracher les racines, couper le feuillage et les forcer à
      l'obscurité, au chaud et à l'humidité, pour produire les chicons.
    conseils_recolte: >
      Récolter les chicons après trois à quatre semaines de forçage, quand ils
      sont bien formés, fermes et blancs.
    erreurs_frequentes:
      - Semis trop précoce (montée à graines la première année)
      - Forçage à la lumière (chicons verts et amers)
      - Racines trop grosses ou fourchues (forçage difficile)
  en:
    nom_commun: Belgian endive
    description: >
      Biennial chicory of the Asteraceae family, grown in two stages: a root in
      summer, then forced in the dark in winter to produce the white, crisp chicon.


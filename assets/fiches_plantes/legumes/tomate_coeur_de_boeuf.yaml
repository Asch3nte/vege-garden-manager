# Fiche plante — tomate_coeur_de_boeuf.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: tomate_coeur_de_boeuf
version_fiche: 1
categorie: legume
sous_type: legume_fruit
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Solanum lycopersicum 'Cuor di Bue'
famille_botanique: Solanaceae

i18n:
  fr:
    nom_commun: Tomate Cœur de Bœuf
    noms_alternatifs: [Cuor di Bue, Tomate côtelée géante]
    description: >
      Variété ancienne italienne à gros fruits côtelés pouvant dépasser 500 g,
      charnus et peu aqueux, à chair dense et sucrée. Idéale pour les salades,
      les tomates farcies et les sauces corsées.
    conseils_culture: >
      Tuteurer solidement dès la plantation : les fruits sont lourds et la tige
      doit supporter leur poids. Supprimer les gourmands pour favoriser de gros
      fruits. Arroser régulièrement au pied pour éviter l'éclatement. Un paillage
      épais est fortement recommandé.
    conseils_recolte: >
      Récolter quand le fruit est bien coloré et cède légèrement sous le doigt.
      Ne pas attendre la sur-maturité : la peau fine se fissure facilement.
    erreurs_frequentes:
      - Arrosage irrégulier (cause l'éclatement des fruits)
      - Absence de taille des gourmands (fruits trop petits)
      - Plantation trop tôt (sensible au froid)
  en:
    nom_commun: Beefsteak Tomato
    noms_alternatifs: [Cuor di Bue, Oxheart Tomato]
    description: >
      Old Italian heirloom variety with large ribbed fruits exceeding 500 g,
      meaty and low in water, with dense and sweet flesh.

besoins:
  ensoleillement: plein_soleil
  arrosage: eleve
  qualites_sol:
    - riche
    - bien_draine
    - frais
  ph_min: 6.0
  ph_max: 7.0
  temperature_min_germination: 18
  temperature_optimale: 22

cycle:
  type: annuelle
  duree_germination_jours: [6, 12]
  duree_avant_recolte_jours: [80, 100]
  hauteur_adulte_cm: [120, 200]
  espacement_cm: 70
  profondeur_semis_cm: 1

periodes:
  hemisphere_nord:
    oceanique:
      semis_interieur: [2, 4]
      plantation: [5, 6]
      recolte: [7, 10]
    continental:
      semis_interieur: [3, 4]
      plantation: [5, 6]
      recolte: [8, 10]
    mediterraneen:
      semis_interieur: [1, 3]
      plantation: [4, 5]
      recolte: [6, 10]
  hemisphere_sud:
    oceanique:
      semis_interieur: [8, 10]
      plantation: [11, 12]
      recolte: [1, 4]

associations:
  beneficies:
    - id: basilic
      raison_i18n: { fr: "Repousse les pucerons, améliore le goût", en: "Repels aphids, enhances flavor" }
    - id: capucine
      raison_i18n: { fr: "Plante-piège à pucerons", en: "Aphid trap crop" }
  defavorables:
    - id: pomme_de_terre
      raison_i18n: { fr: "Même famille, partage le mildiou", en: "Same family, shares blight" }
    - id: fenouil
      raison_i18n: { fr: "Inhibe la croissance des plantes voisines", en: "Inhibits growth of nearby plants" }
rotation:
  famille: solanaceae
  delai_retour_annees: 4
  precedents_favorables: [legumineuses, engrais_verts]
  precedents_defavorables: [solanaceae]

conservation:
  - methode: frais
    duree_jours: 5
    conditions_i18n: { fr: "Température ambiante, à l'abri de la lumière", en: "Room temperature, away from light" }
  - methode: conserves
    duree_mois: 12
  - methode: sechage
    duree_mois: 12
utilisations_culinaires_i18n:
  fr: [Crue en salade, farcie, en sauce, confite, séchée]
  en: [Raw in salads, stuffed, in sauces, candied, dried]

sources:
  - https://fr.wikipedia.org/wiki/Tomate_cœur_de_bœuf
contributeurs:
  - "@potagerer"

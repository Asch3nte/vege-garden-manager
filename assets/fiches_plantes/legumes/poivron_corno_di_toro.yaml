# Fiche plante — poivron_corno_di_toro.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: poivron_corno_di_toro
version_fiche: 1
categorie: legume
sous_type: legume_fruit
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Capsicum annuum 'Corno di Toro'
famille_botanique: Solanaceae

i18n:
  fr:
    nom_commun: Poivron Corno di Toro
    noms_alternatifs: [Piment Corne de taureau, Poivron corne rouge]
    description: >
      Variété italienne emblématique à fruits longs et effilés en forme de corne
      (15–20 cm), rouge à maturité, très doux et sucré. Chair épaisse et
      savoureuse, excellente crue ou grillée. Plant vigoureux très productif.
    conseils_culture: >
      Démarrer en semis intérieur 8–10 semaines avant le repiquage. Repiquer
      après tout risque de gel dans un sol réchauffé. Tuteurer si nécessaire
      sous le poids des fruits. Arroser régulièrement mais sans excès.
    conseils_recolte: >
      Récolter vert pour libérer le plant, ou attendre la coloration rouge
      complète pour une saveur maximale. Plus le fruit mûrit, plus il est sucré.
    erreurs_frequentes:
      - Plantation trop tôt en sol froid (choc thermique, plant chétif)
      - Stress hydrique (fruits déformés)
      - Manque de soleil (mauvaise coloration)
  en:
    nom_commun: Corno di Toro Pepper
    noms_alternatifs: [Bull's Horn Pepper]
    description: >
      Iconic Italian variety with long, tapered horn-shaped fruits (15–20 cm),
      red when ripe, very sweet and mild. Thick, flavorful flesh, excellent
      raw or grilled.

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:

nom_scientifique: "Allium sativum 'Violet de Cadours'"

i18n:
  fr:
    nom_commun: Ail Violet de Cadours
    noms_alternatifs: [Violet de Cadours]
    description: >
      Ail violet à tunique striée de violet, à la saveur prononcée, bénéficiant
      d'une AOP. Planté à l'automne, il forme de gros bulbes ; conservation
      correcte, un peu moins longue que les ails blancs.
  en:
    nom_commun: Cadours Purple Garlic
    description: >
      Purple garlic with violet-streaked skin and a pronounced flavour, with a
      PDO. Planted in autumn, forming large bulbs; fair keeping.

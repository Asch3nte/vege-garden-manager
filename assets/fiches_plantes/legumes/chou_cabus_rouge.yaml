    - bien_draine
    - lourd
  ph_min: 6.5
  ph_max: 7.5
  temperature_min_germination: 8
  temperature_optimale: 16

cycle:
  type: bisannuelle
  duree_germination_jours: [7, 14]
  duree_avant_recolte_jours: [120, 180]
  hauteur_adulte_cm: [40, 60]
  espacement_cm: 60
  profondeur_semis_cm: 1

periodes:

# Fiche plante — chou_cabus_rouge.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: chou_cabus_rouge
version_fiche: 1
categorie: legume
sous_type: legume_feuille
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Brassica oleracea var. capitata f. rubra
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Chou Rouge Cabus
    noms_alternatifs: [Chou rouge pommé, Red Cabbage]
    description: >
      Variété de chou pommé à feuilles rouge violacé très serrées formant une
      pomme dense et lourde (1–2 kg). Chair croquante, légèrement sucrée.
      Excellente conservation en terre ou en cave. Riche en antioxydants
      (anthocyanines). Résistante au froid jusqu'à −8 °C.
    conseils_culture: >
      Semer sous abri tôt au printemps, repiquer en sol riche et bien travaillé.
      Espacer suffisamment (60 cm) pour que les pommes se forment. Butter
      légèrement le plant pour le stabiliser. Arroser régulièrement.
      Inspecter régulièrement les feuilles pour la piéride du chou.
    conseils_recolte: >
      Récolter quand la pomme est bien ferme sous la pression de la main.
      Couper à la base avec un couteau. Se conserve plusieurs mois en cave.
    erreurs_frequentes:
      - Espacement insuffisant (pommes mal formées)
      - Sol acide (hernie des crucifères)
      - Manque de cuivre dans le sol (chlorose)
  en:
    nom_commun: Red Cabus Cabbage
    description: >
      Cabbage variety with tightly packed, purple-red leaves forming a dense,
      heavy head (1–2 kg). Crisp, slightly sweet flesh. Excellent storage.
      Rich in antioxidants (anthocyanins). Frost-resistant to −8 °C.

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:

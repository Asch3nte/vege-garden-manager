nom_scientifique: "Cucurbita pepo 'Sunburst'"

i18n:
  fr:
    nom_commun: Pâtisson Jaune
    noms_alternatifs: [Sunburst, Jaune d'or]
    description: >
      Pâtisson festonné jaune d'or vif, décoratif et savoureux, à chair tendre.
      Variété productive à récolter très jeune (5–8 cm) pour le meilleur de sa
      texture. Plant buissonnant compact.
  en:
    nom_commun: Yellow Pattypan (Sunburst)
    description: >
      Bright golden-yellow scalloped pattypan, decorative and tasty, with tender
      flesh. Productive; harvest very young (5–8 cm) for the best texture.


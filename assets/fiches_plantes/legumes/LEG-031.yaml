# Fiche mère (espèce) — Chou de Bruxelles.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Brassicacée d'hiver à pommes axillaires. Lot « potagères courantes ».
id: LEG-031
version_fiche: 1
categorie: legume
sous_type: legume_feuille
schema_version: 1
difficulte: 2
usages:
  - alimentaire

rusticite:
  zone_min: zone6
nom_scientifique: Brassica oleracea var. gemmifera
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Chou de Bruxelles
    noms_alternatifs: [Chou à jets]
    description: >
      Brassicacée bisannuelle cultivée comme annuelle pour ses petites pommes
      axillaires étagées le long d'une haute tige. Culture longue et rustique :
      les pommes se bonifient avec les premières gelées.
    conseils_culture: >
      Semer au printemps, repiquer en sol ferme, riche et bien pourvu en eau.
      Tuteurer les tiges hautes en sol exposé au vent. Ne pas récolter trop tôt :
      le froid améliore la saveur.
    conseils_recolte: >
      Cueillir les pommes de bas en haut, au fur et à mesure de leur formation,
      dès qu'elles sont fermes et bien serrées.
    erreurs_frequentes:
      - Sol trop meuble (plants qui versent, pommes lâches)
      - Récolte trop précoce (pommes amères)
      - Manque d'eau en été (pommes lâches et clairsemées)
  en:
    nom_commun: Brussels sprout
    description: >
      Biennial brassica grown as an annual for its small axillary heads arranged
      along a tall stem. A long, hardy crop; the sprouts improve after the first
      frosts.


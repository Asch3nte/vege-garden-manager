# Fiche mère (espèce) — Radis.
# Taxonomie & description : tool/scrap_fiche.dart (GBIF × Wikidata × Wikipédia).
# Agronomie généralisée depuis la variété + références. Généré (Lot 3), relu.
id: LEG-022
version_fiche: 1
categorie: legume
sous_type: legume_racine
schema_version: 1
difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone3
nom_scientifique: Raphanus sativus
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Radis
    description: >
      Plante potagère de la famille des Brassicacées, à cycle très court,
      cultivée pour son hypocotyle charnu consommé cru comme légume.
    conseils_culture: >
      Semer en place toutes les 2–3 semaines pour une récolte continue. Sol
      meuble, sans cailloux. Ne jamais laisser sécher le sol : les radis
      deviennent creux et piquants. Éviter les semis en plein été (montaison
      rapide, racines filandreuses).
    conseils_recolte: >
      Récolter dès que la racine mesure 2–3 cm de diamètre, sans attendre. Un
      radis trop gros est creux et piquant. Consommer rapidement après récolte.
    erreurs_frequentes:
      - 'Sol trop dense ou trop riche en azote (trop de feuilles, peu de racines)'
      - Oubli de récolte (radis creux et épicés)
      - 'Semis en plein été (montaison, racines inutilisables)'
  en:
    nom_commun: Radish
    description: >
      A fast-growing Brassicaceae grown for its edible taproot, usually eaten
      raw.


nom_scientifique: "Beta vulgaris var. cicla 'Bright Lights'"

i18n:
  fr:
    nom_commun: Bette Bright Lights
    noms_alternatifs: [Bright Lights, Five Colors, Arc-en-ciel]
    description: >
      Mélange de bettes à cardes multicolores (jaune, orange, rose, rouge, blanc)
      très décoratif, mêlant potager et massif ornemental. Feuilles et cardes
      tendres et savoureuses ; à récolter feuille à feuille.
  en:
    nom_commun: Bright Lights Chard
    description: >
      A mix of multicoloured chards (yellow, orange, pink, red, white), very
      decorative, at home in both the veg patch and ornamental beds. Tender.

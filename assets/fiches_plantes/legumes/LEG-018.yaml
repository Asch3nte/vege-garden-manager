difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone4
nom_scientifique: Pisum sativum
famille_botanique: Fabaceae

i18n:
  fr:
    nom_commun: Pois
    noms_alternatifs: [Petit pois, Pois cultivé]
    description: >
      Plante annuelle de la famille des Fabacées, cultivée pour ses graines
      (petits pois) ou ses gousses ; fixe l'azote de l'air.
    conseils_culture: >
      Semer en place dès la fin de l'hiver, le pois aime le froid. Installer des
      rames ou un filet dès la plantation. Ne pas arroser excessivement (la
      pourriture des racines est fréquente en sol détrempé). Enrichir le sol en
      compost mûr, jamais en fumier frais.
    conseils_recolte: >
      Récolter les gousses plates, avant que les grains ne se forment et ne
      durcissent. Ramasser tous les 2–3 jours pour prolonger la production.
    erreurs_frequentes:
      - Semis en sol détrempé (pourriture)
      - 'Oubli de tuteurage (tiges couchées, mauvaise aération)'
      - Récolte tardive (gousses dures et non comestibles)
  en:
    nom_commun: Pea
    description: >
      An annual legume (Fabaceae) grown for its seeds or pods; it fixes
      atmospheric nitrogen.


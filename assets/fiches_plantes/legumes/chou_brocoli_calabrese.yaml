# Fiche plante — chou_brocoli_calabrese.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: chou_brocoli_calabrese
version_fiche: 1
categorie: legume
sous_type: legume_fleur
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Brassica oleracea var. italica 'Calabrese'
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Brocoli Calabrese
    noms_alternatifs: [Brocoli vert calabrais, Calabrese Broccoli]
    description: >
      Variété italienne de référence à grande tête principale bleue-verte
      (15–20 cm), dense et compacte, puis nombreux jets secondaires après
      la coupe. Chair très tendre et savoureuse, riche en vitamine C et K.
      Cycle plus rapide que les autres brassicacées. Extrêmement productive
      grâce aux pousses secondaires.
    conseils_culture: >
      Semer en pépinière, repiquer à 50 cm. Sol riche en azote, bien travaillé.
      Arroser régulièrement. Couper la tête principale avant que les bractées
      ne s'ouvrent (fleurissent). Après la coupe principale, arroser et
      fertiliser pour favoriser les jets latéraux.
    conseils_recolte: >
      Récolter la tête principale en premier, puis les jets secondaires dès
      qu'ils atteignent 5–8 cm. Couper régulièrement pour prolonger la production.
    erreurs_frequentes:
      - Laisser la tête principale fleurir (bractées jaunes, perte de saveur)
      - Espacement insuffisant (têtes petites)
      - Sol acide (hernie des crucifères)
  en:
    nom_commun: Calabrese Broccoli
    description: >
      Italian reference variety with a large blue-green main head (15–20 cm),
      dense and compact, then numerous secondary shoots after cutting. Very
      tender and flavorful flesh, rich in vitamins C and K.

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:
    - riche
    - bien_draine
    - frais
  ph_min: 6.5
  ph_max: 7.5
  temperature_min_germination: 8
  temperature_optimale: 17

cycle:
  type: annuelle
  duree_germination_jours: [5, 10]
  duree_avant_recolte_jours: [70, 100]
  hauteur_adulte_cm: [50, 80]
  espacement_cm: 50
  profondeur_semis_cm: 1

periodes:
  hemisphere_nord:
    oceanique:
      semis_interieur: [3, 5]
      plantation: [5, 7]
      recolte: [8, 11]
    continental:
      semis_interieur: [4, 5]
      plantation: [5, 7]
      recolte: [8, 10]
    mediterraneen:
      semis_interieur: [3, 5]
      plantation: [5, 7]
      recolte: [8, 11]
  hemisphere_sud:
    oceanique:
      semis_interieur: [9, 11]
      plantation: [11, 1]
      recolte: [2, 5]

associations:
  beneficies:
    - id: laitue
      raison_i18n: { fr: "Profite de l'espace sous les brocolis", en: "Uses space under broccoli" }
    - id: aneth
      raison_i18n: { fr: "Attire les insectes auxiliaires contre les chenilles", en: "Attracts beneficial insects against caterpillars" }
  defavorables:
    - id: moutarde
      raison_i18n: { fr: "Même famille, mêmes maladies et ravageurs", en: "Same family, same diseases and pests" }
rotation:
  famille: brassicaceae
  delai_retour_annees: 4
  precedents_favorables: [legumineuses, solanaceae]
  precedents_defavorables: [brassicaceae]

conservation:
  - methode: frais
    duree_jours: 5
    conditions_i18n: { fr: "Réfrigérateur, dans un sac perforé", en: "Refrigerator, in a perforated bag" }
  - methode: congelation
    duree_mois: 12
    conditions_i18n: { fr: "Séparer en fleurettes, blanchir 3 min avant congélation", en: "Divide into florets, blanch 3 min before freezing" }
utilisations_culinaires_i18n:
  fr: [Vapeur, gratin, soupe, wok, pasta, rôti à l'huile, cru en dip]
  en: [Steamed, gratin, soup, stir-fry, pasta, roasted in oil, raw as dip]

sources:
  - https://fr.wikipedia.org/wiki/Brocoli
contributeurs:
  - "@potagerer"

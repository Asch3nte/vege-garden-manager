i18n:
  fr:
    nom_commun: Céleri branche
    noms_alternatifs: [Céleri à côtes, Céleri à couper]
    description: >
      Légume-tige bisannuel de la famille des Apiacées, cultivé pour ses côtes
      charnues et croquantes. Exigeant en eau et en sol riche, il demande un
      arrosage régulier pour éviter les côtes creuses et filandreuses.
    conseils_culture: >
      Semer au chaud, repiquer en sol très riche et frais, arroser abondamment
      et régulièrement. Lier et butter les pieds en fin de culture pour blanchir
      les côtes si souhaité.
    conseils_recolte: >
      Récolter les côtes extérieures au fur et à mesure, ou le pied entier à
      maturité, avant les fortes gelées.
    erreurs_frequentes:
      - Manque d'eau (côtes creuses, amères et filandreuses)
      - Sol pauvre (plants chétifs)
      - Repiquage trop précoce (montée à graines)
  en:
    nom_commun: Celery
    description: >
      Biennial stalk vegetable of the Apiaceae family, grown for its fleshy,
      crisp ribs. Demanding in water and rich soil.


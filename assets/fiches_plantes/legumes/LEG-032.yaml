# Fiche mère (espèce) — Chou frisé (kale).
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Brassacée non pommée très rustique. Lot « potagères courantes ».
id: LEG-032
version_fiche: 1
categorie: legume
sous_type: legume_feuille
schema_version: 1
difficulte: 1
usages:
  - alimentaire

rusticite:
  zone_min: zone6
nom_scientifique: Brassica oleracea var. sabellica
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Chou frisé
    noms_alternatifs: [Kale, Chou frisé non pommé, Chou plume]
    description: >
      Brassicacée non pommée cultivée pour ses feuilles frisées récoltées au fur
      et à mesure. Parmi les choux les plus rustiques et les plus faciles : les
      feuilles se bonifient au froid et la récolte s'étale de l'automne au
      printemps.
    conseils_culture: >
      Semer du printemps au début de l'été, repiquer en sol riche et frais.
      Récolter régulièrement les feuilles extérieures pour prolonger la
      production. Supporte bien le gel.
    conseils_recolte: >
      Cueillir les feuilles extérieures les plus développées, en laissant le
      cœur produire de nouvelles pousses tout l'hiver.
    erreurs_frequentes:
      - Récolte du bourgeon central (stoppe la production)
      - Sol pauvre (feuilles petites et dures)
  en:
    nom_commun: Kale
    description: >
      Non-heading brassica grown for its curly leaves picked as needed. One of
      the hardiest, easiest cabbages; the leaves sweeten with cold and cropping
      runs from autumn to spring.


i18n:
  fr:
    nom_commun: Chou-fleur
    description: >
      Chou de la famille des Brassicacées cultivé pour son méristème floral
      hypertrophié et charnu (la pomme), consommé comme légume.
    conseils_culture: >
      Semer en pépinière de mars à mai. Repiquer en sol riche, frais et profond.
      Butter légèrement. Attacher les grandes feuilles autour de la pomme pour
      la blanchir (les feuilles la protègent du soleil qui la ferait jaunir).
      Arroser régulièrement, la sécheresse favorise la montée à graines.
    conseils_recolte: >
      Couper quand la pomme est bien compacte et avant qu'elle ne commence à se
      diviser en fleurettes. Une fois coupée, consommer dans la semaine.
    erreurs_frequentes:
      - Oubli de blanchiment des pommes (jaunissement sous le soleil)
      - Sol acide (hernie des crucifères)
      - Sécheresse en formation de pomme (montaison)
  en:
    nom_commun: Cauliflower
    description: >
      A Brassica oleracea cultivar grown for its dense head of undeveloped
      flower buds (the curd).


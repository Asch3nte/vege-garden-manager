nom_scientifique: "Brassica oleracea var. gongylodes 'Blanc de Vienne'"

i18n:
  fr:
    nom_commun: Chou-rave Blanc de Vienne
    noms_alternatifs: [Blanc de Vienne, Vienne blanc]
    description: >
      Chou-rave hâtif à boule vert pâle, à chair blanche tendre et douce. Rapide
      et facile, à récolter jeune (taille d'une balle de tennis) pour éviter la
      chair fibreuse.
  en:
    nom_commun: White Vienna Kohlrabi
    description: >
      Early kohlrabi with a pale-green globe and tender, mild white flesh. Quick
      and easy; harvest young to avoid fibrous flesh.


# Fiche fille (variété) — Chou-rave Blanc de Vienne. Hérite de LEG-036.
# Ne déclare que ce qui diffère de la mère (héritage sparse, ADR-0005).
id: LEG-036-V001
parent_id: LEG-036
version_fiche: 1

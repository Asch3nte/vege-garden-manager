# Fiche plante — pois_mangetout_carouby.
# Spécification : docs/07-base-de-connaissances-yaml.md · Schéma : ../_schema/fiche_plante_schema.yaml

id: pois_mangetout_carouby
version_fiche: 1
categorie: legume
sous_type: legume_fruit
usages:
  - alimentaire
schema_version: 1

nom_scientifique: Pisum sativum var. saccharatum 'Carouby de Maussane'
famille_botanique: Fabaceae

i18n:
  fr:
    nom_commun: Pois Mange-tout Carouby de Maussane
    noms_alternatifs: [Carouby, Pois plate-côte]
    description: >
      Variété provençale ancienne à grosses gousses plates (10–12 cm), vert
      clair, se mangeant entières avant que les grains ne se forment. Saveur
      délicate et sucrée. Plant grimpant pouvant atteindre 1,5 m, très productif
      et résistant. L'une des meilleures variétés de mangetout pour les potagers.
    conseils_culture: >
      Semer en place dès la fin de l'hiver, le pois aime le froid. Installer
      des rames ou un filet dès la plantation. Ne pas arroser excessivement
      (la pourriture des racines est fréquente en sol détrempé). Enrichir le
      sol en compost mûr, jamais en fumier frais.
    conseils_recolte: >
      Récolter les gousses plates, avant que les grains ne se forment et ne
      durcissent. Ramasser tous les 2–3 jours pour prolonger la production.
    erreurs_frequentes:
      - Semis en sol détrempé (pourriture)
      - Oubli de tuteurage (tiges couchées, mauvaise aération)
      - Récolte tardive (gousses dures et non comestibles)
  en:
    nom_commun: Carouby de Maussane Snow Pea
    noms_alternatifs: [Carouby Mangetout]
    description: >
      Old Provençal variety with large, flat pods (10–12 cm), eaten whole before
      the peas form. Delicate, sweet flavor. Climbing plant up to 1.5 m, very
      productive and resistant.

besoins:
  ensoleillement: plein_soleil
  arrosage: modere
  qualites_sol:
    - bien_draine
    - leger
  ph_min: 6.0
  ph_max: 7.5
  temperature_min_germination: 5
  temperature_optimale: 15

cycle:
  type: annuelle
  duree_germination_jours: [8, 15]
  duree_avant_recolte_jours: [70, 90]
  hauteur_adulte_cm: [100, 150]
  espacement_cm: 10
  profondeur_semis_cm: 3

periodes:
  hemisphere_nord:
    oceanique:
      semis_exterieur: [2, 4]
      recolte: [5, 7]
    continental:
      semis_exterieur: [3, 4]
      recolte: [5, 7]
    mediterraneen:
      semis_exterieur: [1, 3]
      recolte: [4, 6]
  hemisphere_sud:
    oceanique:
      semis_exterieur: [8, 10]
      recolte: [11, 1]

associations:
  beneficies:
    - id: carotte
      raison_i18n: { fr: "Fixe l'azote, enrichit le sol pour les carottes", en: "Fixes nitrogen, enriches soil for carrots" }
    - id: laitue
      raison_i18n: { fr: "Le pois ombre légèrement la laitue en été", en: "Peas slightly shade lettuce in summer" }
  defavorables:
    - id: oignon
      raison_i18n: { fr: "Les alliacées inhibent les légumineuses", en: "Alliums inhibit legumes" }
    - id: fenouil
      raison_i18n: { fr: "Inhibe la croissance des plantes voisines", en: "Inhibits growth of nearby plants" }
rotation:
  famille: fabaceae
  delai_retour_annees: 3
  precedents_favorables: [brassicaceae, cucurbitaceae]
  precedents_defavorables: [fabaceae]

conservation:
  - methode: frais
    duree_jours: 3
    conditions_i18n: { fr: "Réfrigérateur, à consommer rapidement", en: "Refrigerator, consume quickly" }
  - methode: congelation
    duree_mois: 12
    conditions_i18n: { fr: "Blanchir 1 min avant congélation", en: "Blanch 1 min before freezing" }
utilisations_culinaires_i18n:

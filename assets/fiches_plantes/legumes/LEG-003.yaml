i18n:
  fr:
    nom_commun: Betterave
    noms_alternatifs: [Betterave potagère, Betterave rouge]
    description: >
      Plante potagère bisannuelle de la famille des Amaranthacées, cultivée
      comme annuelle pour sa racine charnue consommée comme légume ; les jeunes
      feuilles sont aussi comestibles.
    conseils_culture: >
      Semer en place, tremper les graines 24 h pour accélérer la germination.
      Éclaircir à 10 cm. Sol meuble et sans cailloux. Arroser modérément ; la
      sécheresse rend les racines fibreuses et moins savoureuses.
    conseils_recolte: >
      Récolter à 6–7 cm de diamètre pour une saveur optimale. Les grosses
      betteraves deviennent creuses et ligneuses.
    erreurs_frequentes:
      - Sol compact ou caillouteux (racines déformées)
      - Récolte trop tardive (fibrosité)
      - Semis non éclairci (grappes de racines grêles)
  en:
    nom_commun: Beetroot
    description: >
      Root vegetable (Beta vulgaris), eaten raw, roasted, steamed or boiled; the
      leaves are edible too.


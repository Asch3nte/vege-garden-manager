i18n:
  fr:
    nom_commun: Courgette
    description: >
      Courge d'été de la famille des Cucurbitacées, récoltée jeune quand le
      fruit est encore tendre, consommée comme légume.
    conseils_culture: >
      Semer à plat, 2–3 graines par pot, garder le plus vigoureux. Repiquer
      après les dernières gelées. Arroser copieusement au pied. Récolter
      fréquemment pour stimuler la production : une courgette oubliée freine les
      suivantes.
    conseils_recolte: >
      Récolter régulièrement à 15–20 cm pour obtenir la chair la plus tendre.
      Les fruits laissés sur le plant grossissent rapidement et durcissent.
    erreurs_frequentes:
      - Laisser les fruits trop grossir (épuise le plant)
      - "Arrosage irrégulier (favorise l'oïdium)"
      - Semis en sol froid (pourriture des graines)
  en:
    nom_commun: Zucchini
    description: >
      A summer squash (Cucurbita pepo) harvested young, while the fruit is still
      tender.


rusticite:
  zone_min: zone6
nom_scientifique: Eruca vesicaria
famille_botanique: Brassicaceae

i18n:
  fr:
    nom_commun: Roquette
    noms_alternatifs: [Roquette cultivée, Rucola]
    description: >
      Salade annuelle de la famille des Brassicacées, à croissance très rapide,
      cultivée pour ses feuilles au goût piquant et poivré. Idéale en semis
      échelonnés du printemps à l'automne.
    conseils_culture: >
      Semer en place, à mi-ombre l'été pour retarder la montée à graines. Garder
      le sol frais. Récolter jeune pour des feuilles douces ; le piquant
      s'accentue avec la chaleur et l'âge.
    conseils_recolte: >
      Cueillir les feuilles jeunes à la demande ; couper au-dessus du collet
      pour permettre une repousse.
    erreurs_frequentes:
      - Semis en plein été (montée à graines rapide, feuilles très piquantes)
      - Sol sec (feuilles dures et amères)
  en:
    nom_commun: Rocket
    description: >
      Fast-growing annual salad of the Brassicaceae family, grown for its
      peppery leaves. Ideal in successive sowings from spring to autumn.


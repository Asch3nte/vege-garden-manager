# Fiche mère (espèce) — Roquette.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Salade-condiment brassicacée à croissance rapide. Lot « courantes restantes ».
id: LEG-035
version_fiche: 1
categorie: legume
sous_type: legume_feuille

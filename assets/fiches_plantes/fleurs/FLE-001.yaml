# Fiche mère (espèce) — Capucine.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Fleur compagne (plante-piège à pucerons). Créée au lot « fleurs compagnes »
# pour résoudre les références d'associations orphelines (ex-id legacy `capucine`).
id: FLE-001
version_fiche: 1
categorie: fleur
schema_version: 1
difficulte: 1
usages:
  - ornementale
  - alimentaire
  - compagnonnage
  - mellifere

rusticite:
  zone_min: zone9
nom_scientifique: Tropaeolum majus
famille_botanique: Tropaeolaceae

i18n:
  fr:
    nom_commun: Capucine
    noms_alternatifs: [Capucine grimpante, Grande capucine]
    description: >
      Plante annuelle de la famille des Tropaéolacées, cultivée pour ses fleurs
      vives et son feuillage arrondi. Fleurs et jeunes feuilles sont comestibles,
      au goût poivré. Très prisée au potager comme plante-piège à pucerons.
    conseils_culture: >
      Semer en place après les dernières gelées, en sol pauvre et bien drainé :
      un sol trop riche donne beaucoup de feuilles au détriment des fleurs.
      Installer près des cultures sensibles aux pucerons pour concentrer les
      colonies sur la capucine.
    conseils_recolte: >
      Cueillir les fleurs au fur et à mesure de l'ouverture, le matin. Récolter
      les jeunes feuilles tendres et les boutons (marinés comme des câpres).
    erreurs_frequentes:
      - Sol trop riche (feuillage abondant, floraison pauvre)
      - Semis trop précoce (sensible au moindre gel)
      - Arrosage excessif (favorise le feuillage et les maladies)
  en:
    nom_commun: Nasturtium
    description: >
      Annual plant of the Tropaeolaceae family, grown for its bright edible
      flowers and peppery leaves. Widely used in the vegetable garden as an
      aphid trap crop.


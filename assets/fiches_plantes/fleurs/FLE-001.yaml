i18n:
  fr:
    nom_commun: Capucine
    noms_alternatifs: [Grande capucine, Cresson du Mexique, Capucine grimpante]
    description: >
      Plante annuelle de la famille des Tropaéolacées, cultivée pour ses fleurs
      orangées à rouges et son port grimpant ou retombant. Fleurs et feuilles,
      au goût poivré, sont comestibles. Grande alliée du potager : plante-piège
      à pucerons et couvre-sol mellifère.
    conseils_culture: >
      Semer en place après les dernières gelées, en sol pauvre et bien drainé.
      Un sol trop riche en azote favorise le feuillage au détriment des fleurs.
      Palisser les variétés grimpantes sur un support léger, ou laisser courir
      en couvre-sol au pied des cultures à protéger.
    conseils_recolte: >
      Cueillir les fleurs au fur et à mesure de leur ouverture pour prolonger la
      floraison. Récolter les jeunes feuilles avant qu'elles ne durcissent ;
      les boutons floraux et graines vertes se conservent au vinaigre (faux
      câpres).
    erreurs_frequentes:
      - Sol trop riche (beaucoup de feuilles, peu de fleurs)
      - Semis trop précoce (très sensible au gel)
      - Oublier qu'elle attire massivement les pucerons (c'est son rôle de piège)
  en:
    nom_commun: Nasturtium
    noms_alternatifs: [Garden nasturtium, Indian cress]
    description: >
      An annual of the Tropaeolaceae family grown for its edible peppery flowers
      and leaves. A key companion plant: aphid trap crop and pollinator-friendly
      ground cover.


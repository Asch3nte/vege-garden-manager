nom_scientifique: "Calendula officinalis 'Orange King'"

i18n:
  fr:
    nom_commun: Souci 'Orange King'
    noms_alternatifs: [Calendula 'Orange King']
    description: >
      Variété à grandes fleurs doubles orange foncé, très lumineuses. Floraison
      abondante et prolongée, appréciée pour les bordures et les bouquets.
      Conserve toutes les qualités de compagnonnage et médicinales du type.
    conseils_culture: >
      Culture identique au souci commun. Les fleurs doubles étant plus lourdes,
      un sol pas trop riche évite les tiges molles qui versent.
  en:
    nom_commun: Pot marigold 'Orange King'
    description: >
      A double, deep-orange large-flowered variety with long, generous bloom.
      Keeps all the companion and medicinal qualities of the species.


nom_scientifique: Borago officinalis
famille_botanique: Boraginaceae

i18n:
  fr:
    nom_commun: Bourrache
    noms_alternatifs: [Bourrache officinale, Herbe à la suette]
    description: >
      Plante annuelle de la famille des Boraginacées, aux fleurs bleues
      étoilées très mellifères. Excellente pour attirer abeilles et
      bourdons près des cultures à polliniser. Fleurs et jeunes feuilles
      (goût de concombre) sont comestibles. Se ressème très généreusement.
    conseils_culture: >
      Semer en place au printemps, en plein soleil ou mi-ombre, en sol
      ordinaire bien drainé. Sa racine pivotante ameublit le sol et remonte
      les minéraux. Prévoir de l'espace : elle devient volumineuse et se
      ressème d'elle-même chaque année.
    conseils_recolte: >
      Cueillir les fleurs à pleine ouverture pour décorer salades et desserts.
      Récolter les jeunes feuilles avant qu'elles ne deviennent trop rêches et
      piquantes. Consommer avec modération (alcaloïdes).
    erreurs_frequentes:
      - Sous-estimer son volume et son ressemis (peut devenir envahissante)
      - Récolter des feuilles trop âgées (poils urticants, amertume)
  en:
    nom_commun: Borage
    noms_alternatifs: [Starflower]
    description: >
      An annual of the Boraginaceae family with star-shaped blue flowers highly
      attractive to bees. Excellent for drawing pollinators to crops; flowers
      and young leaves (cucumber flavour) are edible. Self-seeds freely.


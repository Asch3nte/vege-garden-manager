rusticite:
  zone_min: zone6
nom_scientifique: Calendula officinalis
famille_botanique: Asteraceae

i18n:
  fr:
    nom_commun: Souci
    noms_alternatifs: [Souci officinal, Calendula, Souci des jardins]
    description: >
      Plante annuelle de la famille des Astéracées, à floraison jaune à orangé
      longue et généreuse. Fleur comestible et médicinale (calendula), elle
      attire les auxiliaires (syrphes, coccinelles) et éloignerait les
      nématodes du sol. Se ressème spontanément d'année en année.
    conseils_culture: >
      Semer en place au printemps, en tout sol bien drainé et au soleil.
      Supporte des sols pauvres. Supprimer les fleurs fanées prolonge la
      floraison ; en laisser quelques-unes monter en graines pour le
      ressemis spontané.
    conseils_recolte: >
      Cueillir les capitules entièrement ouverts, par temps sec, pour un usage
      alimentaire (pétales en salade) ou médicinal (séchage). Récolter
      régulièrement stimule de nouvelles fleurs.
    erreurs_frequentes:
      - Laisser les fleurs faner sur pied (arrête la floraison)
      - Excès d'eau ou sol mal drainé (oïdium sur le feuillage)
  en:
    nom_commun: Pot marigold
    noms_alternatifs: [Calendula, English marigold]
    description: >
      An annual of the Asteraceae family with long-lasting yellow to orange
      flowers. Edible and medicinal (calendula); attracts beneficial insects
      and is reputed to repel soil nematodes. Self-seeds readily.


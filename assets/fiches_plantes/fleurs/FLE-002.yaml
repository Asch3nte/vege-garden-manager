# Fiche mère (espèce) — Souci officinal.
# Taxonomie & description : GBIF × Wikidata × Wikipédia.
# Fleur compagne (répulsif au potager, mellifère). Créée au lot « fleurs
# compagnes » pour résoudre les références orphelines (ex-id legacy `soucis`).
id: FLE-002
version_fiche: 1
categorie: fleur
schema_version: 1
difficulte: 1
usages:
  - ornementale
  - alimentaire
  - medicinale
  - compagnonnage
  - mellifere

rusticite:
  zone_min: zone7
nom_scientifique: Calendula officinalis
famille_botanique: Asteraceae

i18n:
  fr:
    nom_commun: Souci
    noms_alternatifs: [Souci officinal, Souci des jardins, Calendula]
    description: >
      Plante annuelle de la famille des Astéracées, à floraison orangée
      prolongée. Rustique et facile, elle se ressème seule. Les pétales sont
      comestibles ; elle attire les pollinisateurs et les auxiliaires, et
      contribue à éloigner certains ravageurs du sol.
    conseils_culture: >
      Semer en place au printemps, en plein soleil, dans un sol ordinaire bien
      drainé. Supprimer les fleurs fanées pour prolonger la floraison. Laisser
      quelques fleurs monter en graines pour un ressemis spontané.
    conseils_recolte: >
      Cueillir les fleurs bien ouvertes le matin, par temps sec, pour un usage
      culinaire (pétales) ou en séchage.
    erreurs_frequentes:
      - Excès d'azote (feuillage abondant, floraison réduite)
      - Absence de suppression des fleurs fanées (floraison écourtée)
  en:
    nom_commun: Pot marigold
    description: >
      Hardy annual of the Asteraceae family with long-lasting orange flowers.
      Edible petals; attracts pollinators and beneficial insects and helps keep
      some soil pests away.


i18n:
  fr:
    nom_commun: Œillet d'Inde
    noms_alternatifs: [Tagète, Petit œillet d'Inde]
    description: >
      Plante annuelle de la famille des Astéracées, à floraison jaune-orangé
      dense tout l'été. Réputée pour éloigner les nématodes du sol (sécrétions
      racinaires) et les aleurodes, c'est une compagne classique des
      solanacées. À ne pas confondre avec la rose d'Inde (Tagetes erecta).
    conseils_culture: >
      Semer sous abri en mars-avril ou en place après les gelées, en plein
      soleil. Peu exigeante sur le sol pourvu qu'il soit drainé. Planter en
      bordure ou en intercalaire entre tomates, aubergines et poivrons.
    conseils_recolte: >
      Fleur essentiellement ornementale et de compagnonnage : supprimer les
      capitules fanés entretient une floraison continue jusqu'aux gelées.
    erreurs_frequentes:
      - Semis trop précoce en extérieur (gélif)
      - Confusion avec la rose d'Inde (Tagetes erecta), plus haute
      - Arrosage sur le feuillage le soir (favorise l'oïdium)
  en:
    nom_commun: French marigold
    noms_alternatifs: [Tagetes]
    description: >
      An annual of the Asteraceae family flowering densely all summer in yellow
      and orange. Reputed to repel soil nematodes (root exudates) and
      whiteflies; a classic companion to solanaceous crops.


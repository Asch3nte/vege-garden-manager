# ─────────────────────────────────────────────────────────────────────────────
# Schéma de référence d'une fiche plante — Pot'à Gérer
# Décrit la structure attendue de chaque fichier assets/fiches_plantes/<cat>/<id>.yaml
# Spécification : docs/07-base-de-connaissances-yaml.md
#
# Légende des annotations :
# (requis) : champ obligatoire
# (optionnel) : champ facultatif
# [a, b] : intervalle [min, max]
# enum: … : valeurs autorisées
# ─────────────────────────────────────────────────────────────────────────────

# Métadonnées techniques
id: # (requis) unique, immuable — format canonique CAT3-NNN (espèce) ou
    # CAT3-NNN-VNNN (variété), language-agnostic (ADR-0005). Voir le registre
    # _schema/id_registry.yaml. Format hérité (en cours de migration) : snake_case.
parent_id: # (requis sur une FICHE FILLE / variété ; absent sur une fiche mère)
           # id de la fiche mère (espèce). La fille n'hérite que par fusion :
           # elle ne déclare QUE les champs qui diffèrent de la mère. Son id doit
           # être préfixé par parent_id (ex. LEG-001-V001 ⟶ parent LEG-001).
           # Non surchargeables par une fille : categorie, sous_type,
           # famille_botanique, nom_scientifique, usages, rotation, associations.
varietes_connues: [] # (optionnel, sur une fiche mère) liste informative des ids
                     # de fiches filles connues (ex. [LEG-001-V001, LEG-001-V002])
version_fiche: # (requis) entier, incrémenté à chaque modification de la fiche
categorie: # (requis) enum CategoriePlante : legume | aromatique | fruit | petit_fruit | fleur | cereale | engrais_vert
sous_type: # (optionnel — seulement si categorie: legume) enum SousTypeLegume :
                  # legume_fruit | legume_feuille | legume_racine | legume_bulbe | legume_tige | legume_fleur | legume_tubercule
usages: [] # (requis, ≥ 1) enum UsagePlante (liste) : alimentaire | condimentaire | medicinale |
                  # compagnonnage | repulsif | mellifere | pollinisateur | attire_auxiliaires |
                  # engrais_vert | couvre_sol | brise_vent | tuteur_vivant | ornementale | fourrage
schema_version: # (requis) entier, version du présent schéma
difficulte: # (optionnel) int 1–3 : 1=débutant, 2=intermédiaire, 3=expert (§C doc-16)

# Rusticité tolérée par la plante (§A doc-16)
rusticite:
  zone_min: # (optionnel) ZoneRusticite USDA — limite froide supportée (ex: zone6)
  zone_max: # (optionnel) ZoneRusticite — limite chaude (zones tropicales uniquement)

# Identification botanique
nom_scientifique: # (requis) ex: Solanum lycopersicum
famille_botanique: # (requis) ex: Solanaceae

# Contenu multilingue — 'fr' obligatoire, autres langues optionnelles (texte INLINE)
i18n:
  fr: # (requis)
    nom_commun: # (requis)
    noms_alternatifs: [] # (optionnel) liste
    description: # (requis) texte
    conseils_culture: # (optionnel) texte
    conseils_recolte: # (optionnel) texte
    erreurs_frequentes: [] # (optionnel) liste
  en: # (optionnel) même structure que 'fr'

# Besoins agronomiques (données structurées pour le moteur)
besoins:
  ensoleillement: # (requis) enum NiveauSoleil : plein_soleil | mi_ombre | ombre — niveau préféré
  ensoleillement_min: # (optionnel) NiveauSoleil — minimum toléré (§I doc-16 ; ex: mi_ombre pour la tomate)
  arrosage: # (requis) enum BesoinEau : faible | modere | eleve
  qualites_sol: [] # (requis) liste de QualiteSol : riche | pauvre | bien_draine | mal_draine | frais | sec | lourd | leger
  ph_min: # (requis) 0.0–14.0, <= ph_max
  ph_max: # (requis) 0.0–14.0
  temperature_min_germination: # (optionnel) °C
  temperature_optimale: # (optionnel) °C
  temperature_min_survie: # (optionnel) °C — seuil de mort par gel (§B doc-16 ; distinct du seuil de germination)
  gele_fatal: # (optionnel) bool — vrai si le moindre gel détruit la plante (défaut: false)
  temperature_max_tolerance: # (optionnel) °C — seuil de stress thermique (ADR-0015 ; ex. 28 pour laitue)
  tolerance_secheresse: # (optionnel) enum ToleranceSecheresse : faible | moyenne | forte (ADR-0015)
  arrosage_detaille: # (optionnel, expert — acces.eauDetaillee) détail d'arrosage ; CHAQUE sous-champ optionnel, ≥1 requis. Les chiffres doivent être RÉELS (sourcés), jamais inventés.
    frequence_jours: [] # (optionnel) [min, max] jours entre arrosages, indicatif par temps chaud/sec (0 < min <= max)
    volume_litres_m2: [] # (optionnel) [min, max] L/m² par arrosage (0 < min <= max)
    phases_sensibles: [] # (optionnel) liste de PhaseSensibleEau : germination | feuillaison | floraison | fructification | grossissement
    note_i18n: # (optionnel) { fr: "...", en: "..." } — conseil éditorial localisé
      fr:

# Cycle de culture
cycle:
  type: # (requis) enum: annuelle | bisannuelle | vivace
  duree_germination_jours: [] # (optionnel) [min, max]
  duree_avant_recolte_jours: [] # (requis) [min, max]
  hauteur_adulte_cm: [] # (optionnel) [min, max]
  espacement_cm: # (requis) entier
  profondeur_semis_cm: # (optionnel)
  profondeur_sol_min_cm: # (optionnel) entier — profondeur minimale de terre nécessaire (§D doc-16)
  compatible_hors_sol: # (optionnel) bool — compatible pot/jardinière (défaut: true ; §D doc-16)
  culture_verticale: # (optionnel) bool — supporte/profite d'un tuteur ou treillis (défaut: false ; §E doc-16)
  charge_tuteur: # (optionnel) enum ChargeTuteur : legere | moyenne | lourde — poids de la grimpante
                 # sur son support, pour la règle « grimpante adaptée au tuteur » (ADR-0010 Lot 2)
  enracinement: # (optionnel) enum EnracinementPlante : superficiel | moyen | profond | pivotant
                # système racinaire, pour « ameublit le sol » & concurrence racinaire (ADR-0014)

# Périodes — par hémisphère puis TypeClimat ; mois en entiers 1–12.
# Clés de climat autorisées : tropical | subtropical | aride | semi_aride | mediterraneen |
# oceanique | continental | montagnard | polaire. Le contributeur ne remplit que les
# climats qu'il connaît. La ZoneRusticite sert d'affinage au moteur (pas dans la fiche).
periodes:
  hemisphere_nord:
    oceanique: # (≥ 1 climat requis pour l'hémisphère renseigné)
      semis_interieur: [] # [mois_debut, mois_fin]
      semis_exterieur: [] # (optionnel)
      plantation: []
      recolte: []
    # continental: {…} mediterraneen: {…} (optionnels, même structure)
  hemisphere_sud: {} # (optionnel) même structure

# Associations & rotation — références par 'id' de fiche, jamais par nom
# Associations typées (ADR-0010) : 'type' (optionnel) qualifie le mécanisme.
# 'type' accepte UN token OU une LISTE de tokens (ADR-0012), ex. type: [brouillage_olfactif, repulsion_ravageur].
#   benefices  → TypeBeneficeAssociation : tuteur_structurel | etagement_lumiere |
#                repulsion_ravageur | brouillage_olfactif | attraction_pollinisateurs |
#                plante_piege | fixation_azote | couvre_sol | brise_vent | succession_temporelle
#   defavorables → TypeConflitAssociation : meme_famille_ravageurs | competition_lumiere |
#                competition_azote | allelopathie
# 'type' omis = paire « brute » (compte comme avant, sans mécanisme).
associations:
  beneficies: # (optionnel) liste de { id, type?, raison_i18n: { fr, en } }
    - id:
      type:                       # (optionnel) mécanisme TypeBeneficeAssociation
      raison_i18n: { fr:, en: }
  defavorables: # (optionnel) idem avec type ∈ TypeConflitAssociation
    - id:
      type:                       # (optionnel) mécanisme TypeConflitAssociation
      raison_i18n: { fr:, en: }
rotation:
  famille: # (requis) ex: solanaceae
  delai_retour_annees: # (requis) entier
  precedents_favorables: [] # (optionnel)
  precedents_defavorables: [] # (optionnel)
  fixe_azote: # (optionnel) bool — vrai pour les légumineuses (défaut: false ; §H doc-16)
  besoin_azote: # (optionnel) NiveauBesoin : faible | modere | eleve (§H doc-16)

# Défense ciblée (optionnel, ADR-0010 Lot 2) — slugs du référentiel Bioagresseur
# (_referentiels/bioagresseurs.yaml). Intégrité vérifiée par VerificateurIntegriteRepulsifs.
repulsif_contre: [] # (optionnel) bioagresseurs (maladie OU ravageur) que la plante repousse
piege_a: []         # (optionnel) ravageurs que la plante piège (plante-appât) — doivent être de type ravageur

# Post-récolte (optionnel)
conservation:
  - methode: # ex: frais | conserves | lactofermentation | sechage | congelation
    duree_jours: # OU duree_mois
    conditions_i18n: { fr:, en: }
utilisations_culinaires_i18n:
  fr: []
  en: []

# Source & contribution
sources: [] # (optionnel) URLs
contributeurs: [] # (optionnel) ex: ["@github_username"]

# ─────────────────────────────────────────────────────────────────────────────
# Registre des IDs de fiches plantes — Pot'à Gérer
# Spécification : docs/decisions/0005-fiche-mere-varietes-et-id.md
#
# Une ligne par fiche, ordre numérique par catégorie : `ID: Nom commun (fr)`.
# Index humain lisible ET source de vérité du prochain numéro disponible.
#
# RÈGLES (ADR-0005) :
#   • Format espèce  : [CAT3]-[NUM3]        ex. LEG-001
#   • Format variété : [CAT3]-[NUM3]-V[NUM3] ex. LEG-001-V001
#   • Numéros séquentiels par catégorie, attribués à l'ajout, IMMUABLES.
#     Un numéro supprimé n'est JAMAIS réattribué.
#   • Les variétés sont numérotées dans l'espace de leur espèce (V001, V002…).
#
# Codes catégorie : LEG=legume ARO=aromatique FRU=fruit PFR=petit_fruit
#                   FLE=fleur CER=cereale ENG=engrais_vert
# ─────────────────────────────────────────────────────────────────────────────


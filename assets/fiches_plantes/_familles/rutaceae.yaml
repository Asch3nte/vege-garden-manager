# Fiche famille (ADR-0006) — type sœur des fiches plantes (pas grand-mère).
id: rutaceae
nom_scientifique: Rutaceae
schema_version: 1
categories: [fruit]
i18n:
  fr:
    nom_commun: Rutacées
    description: >
      Famille des agrumes : citronnier, oranger, mandarinier, kumquat, ainsi que

# Fiche famille (ADR-0006) — type sœur des fiches plantes (pas grand-mère).
id: polygonaceae
nom_scientifique: Polygonaceae
schema_version: 1
categories: [legume, cereale, engrais_vert]
i18n:
  fr:
    nom_commun: Polygonacées
    description: >
      Famille de l'oseille et de la rhubarbe, et de la pseudo-céréale sarrasin
      (blé noir). Le sarrasin, à croissance rapide et mellifère, est un engrais
      vert apprécié pour étouffer les adventices.

# Fiche famille (ADR-0006) — type sœur des fiches plantes (pas grand-mère).
id: lamiaceae
nom_scientifique: Lamiaceae
schema_version: 1
categories: [aromatique, fleur]
i18n:
  fr:
    nom_commun: Lamiacées (Labiées)
    description: >
      Grande famille des aromatiques à tige carrée et huiles essentielles :
      basilic, thym, menthe, romarin, sauge, origan, marjolaine, mélisse,
      sarriette, et la lavande. Très mellifères et souvent répulsives.
    pourquoi_rotation: >
      Beaucoup de lamiacées sont vivaces et restent en place plusieurs années ; pour les annuelles comme le basilic, évitez de répéter au même endroit et offrez un sol drainé, car elles craignent l'excès d'eau.
    ennemis_communs_note: >
      Pucerons, cicadelles et aleurodes piquent le feuillage tendre ; en sol trop humide, l'oïdium et les pourritures racinaires guettent.
    associations_note: >
      Très aromatiques et mellifères (thym, sauge, romarin), les lamiacées éloignent par leur odeur de nombreux ravageurs et attirent les pollinisateurs : de précieuses compagnes des choux et des tomates.
maladies_communes: [oidium, rouille, pourriture_racinaire]
ravageurs_communs: [puceron, cicadelle, aleurode]
contributeurs:
  - "@potagerer"

# Fiche famille (ADR-0006) — type sœur des fiches plantes (pas grand-mère).
id: fabaceae
nom_scientifique: Fabaceae
schema_version: 1
categories: [legume, fleur, engrais_vert]
i18n:
  fr:
    nom_commun: Fabacées (Légumineuses)
    description: >
      Légumineuses fixatrices d'azote (symbiose avec des bactéries Rhizobium) :

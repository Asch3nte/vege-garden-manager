# Fiche famille (ADR-0006) — type sœur des fiches plantes (pas grand-mère).
id: geraniaceae
nom_scientifique: Geraniaceae
schema_version: 1
categories: [fleur]
i18n:
  fr:
    nom_commun: Géraniacées
    description: >
      Famille des géraniums vivaces (Geranium) et des pélargoniums (les

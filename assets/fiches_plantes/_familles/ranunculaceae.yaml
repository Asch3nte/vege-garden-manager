# Fiche famille (ADR-0006) — type sœur des fiches plantes (pas grand-mère).
id: ranunculaceae
nom_scientifique: Ranunculaceae
schema_version: 1
categories: [fleur]
i18n:
  fr:
    nom_commun: Renonculacées
    description: >
      Famille ornementale de la nigelle, l'ancolie, la renoncule, la clématite

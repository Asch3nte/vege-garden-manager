# ─────────────────────────────────────────────────────────────────────────────
# Registre des fiches de FAMILLE botanique — Pot'à Gérer
# Spécification : docs/decisions/0006-fiches-famille-botanique.md (ADR-0006)
#
# Index humain lisible. Une ligne par famille : `id: Nom français (latin)`.
# L'id EST le nom scientifique normalisé en slug (cf. FamilleBotanique.normaliserCle).
# Une famille est GLOBALE : elle peut être pertinente pour plusieurs catégories
# (le champ `categories:` de chaque fiche fait foi). Le regroupement ci-dessous
# est purement indicatif (catégorie de rattachement principale).
# ─────────────────────────────────────────────────────────────────────────────


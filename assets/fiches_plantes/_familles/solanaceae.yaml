# Fiche famille (ADR-0006) — type sœur des fiches plantes (pas grand-mère).
id: solanaceae
nom_scientifique: Solanaceae
schema_version: 1
categories: [legume, fleur]
i18n:
  fr:
    nom_commun: Solanacées

# Fiche famille (ADR-0006) — type sœur des fiches plantes (pas grand-mère).
id: iridaceae
nom_scientifique: Iridaceae
schema_version: 1
categories: [fleur]
i18n:
  fr:
    nom_commun: Iridacées
    description: >
      Famille ornementale à rhizomes ou bulbes : iris, glaïeul, crocus et
      freesia. Floraisons graphiques échelonnées selon les genres ; le crocus de

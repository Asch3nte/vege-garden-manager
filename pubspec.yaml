name: pot_a_gerer
description: "Pot'à Gérer — assistant de potager 100% local, open source, respectueux de la vie privée."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_riverpod: ^3.3.1
  riverpod: ^3.2.1
  go_router: ^17.3.0
  http: ^1.6.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.3
  intl: ^0.20.2
  uuid: ^4.5.3
  yaml: ^3.1.3
  path_provider: ^2.1.5
  path: ^1.9.1
  # Sauvegarde locale (export/import JSON) — validées avec le dev (2026-06-13) :
  # share_plus = feuille de partage native pour sortir le fichier ; file_picker =
  # sélection du fichier à importer. Aucune donnée ne part en réseau (100% local).
  share_plus: ^13.2.0
  # Pre-release pinned on purpose (dev-validated 2026-07-06): every *stable*
  # file_picker still pins win32 ^5.x, which blocks the built-in-Kotlin (KGP
  # removal) versions of share_plus (>=13.2) and package_info_plus (>=10.2,
  # transitive via geolocator_linux). The 12 beta migrated to win32 ^6 with an
  # unchanged pickFiles API. Move back to a caret on stable once 12.0.0 ships.
  file_picker: ^12.0.0-beta.7
  # Runtime app version/build number (À propos screen) — validated with the dev
  # (2026-07-07). Already resolved transitively at 10.2.0 via geolocator_linux,
  # so promoting it to a direct dependency needs no other version bump.
  package_info_plus: ^10.2.0
  # Opens external links (source repo) in the platform's default handler —
  # validated with the dev (2026-07-07). 100% local: no data sent by the app.
  url_launcher: ^6.3.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  # NOTE: phosphor_flutter retiré — incompatible Flutter 3.44.1 (il étend
  # IconData, devenu une classe `final`). Pas de version corrigée en amont
  # (cf. docs/08 §7). Icônes Material en attendant ; Phosphor à rebrancher
  # via un wrapper local (fonts .ttf MIT) quand on y reviendra.
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  # Test-only: mocking UrlLauncherPlatform in ouverture_lien_service_test.dart
  # (transitive via url_launcher, promoted to direct so the import lints clean).
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  drift_dev: ^2.33.0
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Génère le code d'internationalisation (ARB -> AppLocalizations) depuis lib/l10n/.
  generate: true

  # Assets embarqués. Un dossier (suffixe '/') inclut les fichiers qu'il contient
  # (non récursif) -> une entrée par catégorie de fiches.
  assets:
    - assets/fiches_plantes/_schema/
    - assets/fiches_plantes/_familles/
    - assets/fiches_plantes/_referentiels/
    - assets/fiches_plantes/legumes/
    - assets/fiches_plantes/aromatiques/
    - assets/fiches_plantes/fruits/
    - assets/fiches_plantes/petits_fruits/
    - assets/fiches_plantes/fleurs/
    - assets/fiches_plantes/cereales/
    - assets/fiches_plantes/engrais_verts/
    - assets/docs_aide/
    - assets/images/
    # Illustrations du glossaire (ADR-0017 D4) : provenance dans SOURCES.txt.
    - assets/images/glossaire/
    # Licences SIL OFL des polices embarquées (enregistrées via LicenseRegistry).
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Inter.txt

  # Polices du design system « Carnet vivant » (docs/08 §4).
  # Manrope (titres) et Inter (corps & UI) sont des polices VARIABLES : un seul
  # fichier .ttf couvre tout l'axe de graisse. On déclare chaque graisse utile
  # vers le même fichier avec son descripteur `weight`, pour que Flutter mappe
  # FontWeight.wXXX sur la bonne instance de l'axe. Licences : SIL OFL 1.1
  # (assets/fonts/OFL-*.txt).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 500
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700
        - asset: assets/fonts/Manrope.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

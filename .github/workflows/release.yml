name: Release

# Pushing a v* tag (e.g. v1.0.0) builds the signed APK and AAB, then opens a
# draft GitHub Release with them; nothing is public until the draft is published.
# A manual run only signs, to check the key secrets: no Release is created.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main and matches the pubspec version
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main"
            exit 1
          fi
          version=$(sed -nE 's/^version:[[:space:]]*"?([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match pubspec version $version"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      # Installed only now: dependency and code-generation steps never see it.
      - name: Install the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing secret for $secret"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK and AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties

      - name: Refuse a debug-signed APK or AAB
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # Both tools print their errors on stdout: shown before failing.
          if ! apk=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk 2>&1); then
            echo "$apk"
            echo "::error::APK signature does not verify"
            exit 1
          fi
          if ! aab=$(keytool -J-Duser.language=en -printcert -jarfile build/app/outputs/bundle/release/app-release.aab 2>&1); then
            echo "$aab"
            echo "::error::AAB certificate unreadable"
            exit 1
          fi
          echo "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          echo "$aab" | grep -m1 'Owner:'
          if echo "$apk" | grep -q 'CN=Android Debug' || echo "$aab" | grep -q 'CN=Android Debug' \
            || ! echo "$aab" | grep -q 'Owner:'; then
            echo "::error::Release signed with the debug key, or unsigned"
            exit 1
          fi

      - name: Collect the release files
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/pot-a-gerer-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/pot-a-gerer-$TAG.aab"
          (cd dist && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: release
          path: dist/
          retention-days: 7

  # Separate job: only it holds the write token, never the release key.
  draft:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Draft the GitHub Release
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --title "$TAG" --generate-notes
          fi

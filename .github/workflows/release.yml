name: Release

# Pushing a v* tag (e.g. v1.0.0) builds the signed APK and AAB, then opens a
# draft GitHub Release with them; nothing is public until the draft is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Check the tag matches the pubspec version
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match pubspec version $version"
            exit 1
          fi

      - name: Install the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing secret for $secret"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK and AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Refuse a debug-signed APK
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certificat=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$certificat" | grep 'Signer #1 certificate DN'
          if echo "$certificat" | grep -q 'CN=Android Debug'; then
            echo "::error::APK signed with the debug key"
            exit 1
          fi

      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/pot-a-gerer-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/pot-a-gerer-$TAG.aab"
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$TAG" dist/* --draft --title "$TAG" --generate-notes

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
